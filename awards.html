<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F5F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>جوائز البطولة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="vendor/supabase.min.js?v=20260910-1"></script>
<script src="uefa-player-images.js?v=20260913-2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Tajawal",sans-serif;background:#F5F3EE;color:#2C2C2A;direction:rtl;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(ellipse 800px 500px at 50% 0%,rgba(201,168,76,.15),transparent 65%);}
a{text-decoration:none;color:inherit}

.nav{position:sticky;top:0;z-index:100;background:rgba(245,243,238,.9);backdrop-filter:blur(16px);border-bottom:1px solid #E0DCCF;padding:env(safe-area-inset-top,0) 0 0}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;max-width:900px;margin:0 auto}
.nav-back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:#0F2A4A;padding:9px 20px;background:linear-gradient(180deg,#ffffff,#EDEAE0);border:1px solid #D8D2C0;border-radius:20px;box-shadow:0 3px 0 #C9C2AC,0 4px 8px rgba(0,0,0,.12);transition:.15s}
.nav-back:active{transform:translateY(2px);box-shadow:0 1px 0 #C9C2AC,0 2px 4px rgba(0,0,0,.1)}
@media(max-width:480px){.nav-back{font-size:13px;padding:8px 16px}}
.nav-title{font-size:15px;font-weight:900;color:#c9a84c}

.hero{text-align:center;padding:40px 20px 20px;max-width:700px;margin:0 auto}
.hero-trophy{font-size:56px;margin-bottom:12px;display:block;filter:drop-shadow(0 0 20px rgba(201,168,76,.4))}
.hero h1{font-size:clamp(22px,5vw,34px);font-weight:900;color:#2C2C2A;margin-bottom:8px}
.hero p{font-size:13px;color:#79786A;line-height:1.7}

.wrap{max-width:900px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.award-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}

@keyframes fadeSlideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.award-card{animation:fadeSlideUp .5s ease-out both}
.hero{animation:fadeSlideUp .5s ease-out both}

.award-card{
  background:#FFFFFF;
  border:1px solid rgba(201,168,76,.35);
  border-radius:20px;overflow:hidden;
  position:relative;
}
.award-card.top{border-color:rgba(201,168,76,.7);background:linear-gradient(160deg,#FFFBF0,#FFFFFF)}

.award-banner{
  height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.95) 0 28%,transparent 29%),linear-gradient(145deg,var(--award-soft,#fff7dc),#fff 65%);
  border-bottom:1px solid rgba(201,168,76,.15);
}
.award-banner::before{content:"";position:absolute;inset:14px;border:1px solid color-mix(in srgb,var(--award-color,#c9a84c) 35%,transparent);border-radius:18px}
.award-banner::after{content:"";position:absolute;width:190px;height:190px;border:24px solid color-mix(in srgb,var(--award-color,#c9a84c) 10%,transparent);border-radius:50%;top:-98px;left:-70px}
.award-photo{
  width:112px;height:112px;border-radius:50%;object-fit:cover;position:relative;z-index:2;
  border:4px solid #fff;outline:3px solid var(--award-color,#c9a84c);
  box-shadow:0 12px 26px rgba(15,42,74,.2);
}
.award-photo-ph{
  width:112px;height:112px;border-radius:50%;position:relative;z-index:2;
  background:rgba(201,168,76,.08);
  border:3px dashed rgba(201,168,76,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;text-align:center;padding:12px;color:#8b6b20;font-weight:800;
  cursor:pointer;transition:.2s;
}
.award-photo-ph:hover{background:rgba(201,168,76,.14);border-color:rgba(201,168,76,.5)}
.award-emblem{position:absolute;z-index:4;right:22px;bottom:18px;width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#f3e8c3);border:2px solid var(--award-color,#c9a84c);box-shadow:0 8px 18px rgba(15,42,74,.2);transform:rotate(-7deg)}
.award-emblem-icon{font-size:34px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}
.award-emblem-label{position:absolute;left:18px;top:18px;background:var(--award-color,#c9a84c);color:#fff;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:900;z-index:3;box-shadow:0 4px 12px rgba(0,0,0,.12)}

.award-body{padding:16px}
.award-type{font-size:11px;font-weight:800;color:#c9a84c;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.award-name{font-size:17px;font-weight:900;color:#2C2C2A;margin-bottom:4px;line-height:1.3}
.award-team{font-size:12px;color:#79786A;display:flex;align-items:center;gap:4px}

/* حقل رفع صورة مخفي */
.upload-input{display:none}

/* بطاقة فارغة (placeholder) */
.award-empty{
  background:rgba(0,0,0,.015);
  border:1px dashed #E0DCCF;
  border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;color:#9C9A8D;font-size:13px;
  min-height:200px;
}

.sec-title{font-size:12px;font-weight:800;color:#c9a84c;letter-spacing:1.5px;margin:28px 0 14px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:3px;height:14px;background:#c9a84c;border-radius:2px}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,.2),transparent)}

@media(max-width:480px){
  .award-grid{grid-template-columns:1fr}
  .hero{padding:28px 14px 14px}
}
</style>
<link rel="stylesheet" href="tournament-theme.css?v=20260910-2">
<link rel="stylesheet" href="public-navigation.css?v=20260911-1">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-back" id="backLink" href="index.html">← رجوع</a>
    <span class="nav-title">🏆 جوائز البطولة</span>
    <div></div>
  </div>
</nav>

<div class="hero">
  <span class="hero-trophy">🏆</span>
  <h1 id="tName">جوائز ختام البطولة</h1>
  <p>تكريم أبرز اللاعبين والمدربين والإداريين في البطولة</p>
</div>

<div class="wrap">
  <div class="sec-title">جوائز فردية</div>
  <div class="award-grid" id="awardsGrid">
    <div class="award-empty"><span style="font-size:32px;margin-bottom:10px">⏳</span><p>جاري تحميل الجوائز...</p></div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="tournament-scope.js?v=20260914-2"></script>
<script src="public-navigation.js?v=20260911-1"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const TID=new URLSearchParams(location.search).get('id');
const scopeUrl=url=>window.TournamentScope?.scopedUrl(url)||url;

const AWARD_DEFS=[
  {key:'top_scorer',     title:'هداف البطولة',        ic:'👟', badge:'الحذاء الذهبي', color:'#c79016',soft:'#fff5cf'},
  {key:'best_player',    title:'أفضل لاعب',            ic:'⚽', badge:'الكرة الذهبية', color:'#c9a84c',soft:'#fff8de'},
  {key:'best_goalkeeper',title:'أفضل حارس مرمى',      ic:'🧤', badge:'القفاز الذهبي', color:'#287dcc',soft:'#e7f4ff'},
  {key:'best_admin',     title:'أفضل إداري',           ic:'💼', badge:'التميز الإداري', color:'#278a57',soft:'#e7f8ef'},
  {key:'best_management',title:'أفضل إدارة فريق',     ic:'🏆', badge:'الإدارة المتميزة', color:'#8153c7',soft:'#f1eaff'},
];

async function init(){
  if(!TID){document.getElementById('awardsGrid').innerHTML='<div class="award-empty"><p>لم يتم تحديد البطولة</p></div>';return;}
  const tournamentBack=scopeUrl('tournament.html?id='+TID);
  document.getElementById('backLink').href=tournamentBack;
  window.PublicNavigation?.configureBack(document.getElementById('backLink'),tournamentBack,'البطولة');

  const {data:t}=await sb.from('tournaments').select('name,primary_color,secondary_color,logo_url,cup_logo_url').eq('id',TID).single();
  window.TournamentScope?.applyTournamentTheme(t);
  if(t)document.getElementById('tName').textContent='جوائز '+(t.name_ar||t.name||'');

  const {data:awards}=await sb.from('tournament_awards').select('*').eq('tournament_id',TID);
  const {data:teams}=await sb.from('teams').select('id,name,name_ar').eq('tournament_id',TID);
  const teamName={};(teams||[]).forEach(tm=>teamName[tm.id]=tm.name_ar||tm.name||'');

  const playerIds=(awards||[]).map(a=>a.winner_player_id).filter(Boolean);
  const playerMap={};
  if(playerIds.length){
    const {data:pls}=await sb.from('players').select('id,name,full_name_ar,number,shirt_number,team_id,jersey_photo_url,photo_url,image').in('id',playerIds);
    (pls||[]).forEach(p=>playerMap[p.id]=p);
  }

  const aMap={};(awards||[]).forEach(a=>aMap[a.award_key]=a);

  document.getElementById('awardsGrid').innerHTML=AWARD_DEFS.map((def,i)=>{
    const a=aMap[def.key];
    const player=a?.winner_player_id?playerMap[a.winner_player_id]:null;
    const photo=a?.winner_photo_url||player?.jersey_photo_url||player?.photo_url||player?.image||null;
    const name=a?.winner_name||player?.full_name_ar||player?.name||null;
    const team=a?.winner_team_id?teamName[a.winner_team_id]:'';
    const number=player?.number??player?.shirt_number??null;
    return `<div class="award-card${def.key==='top_scorer'||def.key==='best_player'?' top':''}" style="animation-delay:${i*0.08}s;--award-color:${def.color};--award-soft:${def.soft}">
      <div class="award-banner">
        <span class="award-emblem-label">${def.badge}</span>
        ${photo
          ?`<img class="award-photo" src="${photo}" alt="${name||''}">`
          :`<div class="award-photo-ph" title="أرفق الصورة في ملف اللاعب أو الإداري">الصورة الحقيقية<br>غير مرفقة</div>`}
        <span class="award-emblem" aria-label="${def.badge}"><span class="award-emblem-icon">${def.ic}</span></span>
      </div>
      <div class="award-body">
        <div class="award-type">${def.ic} ${def.title}</div>
        <div class="award-name">${name||'—'}${number!=null?` <span style="opacity:.7">#${number}</span>`:''}</div>
        ${team?`<div class="award-team">👥 ${team}</div>`:''}
      </div>
    </div>`;
  }).join('');
  (awards||[]).forEach(a=>{
    if(!a.winner_player_id)return;
    const index=AWARD_DEFS.findIndex(def=>def.key===a.award_key),player=playerMap[a.winner_player_id];
    const slot=document.querySelectorAll('#awardsGrid .award-card')[index]?.querySelector('.award-photo-ph');
    if(!slot||!player)return;
    slot.dataset.uefaPlayerName=player.name||player.full_name_ar||'';
    slot.dataset.uefaPlayerAlt=player.full_name_ar||player.name||'';
    slot.dataset.uefaTeamId=player.team_id||a.winner_team_id||'';
  });
  window.UefaPlayerImages?.hydrate(document.getElementById('awardsGrid'));
}

init();
</script>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body>
</html>
