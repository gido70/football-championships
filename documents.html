<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>نشرات البطولة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:"Tajawal",sans-serif;background:#0d1117;color:#e6edf3;direction:rtl;margin:0;min-height:100vh}
.nav{background:#161b22;border-bottom:1px solid #21262d;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.nav a{color:#8b949e;text-decoration:none;font-size:13px;border:1px solid #30363d;padding:8px 16px;border-radius:20px;min-height:36px;display:inline-flex;align-items:center}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:19px;color:#c9a84c;margin:0 0 14px}

.doc-list{display:flex;flex-direction:column;gap:10px}
.doc-row{display:flex;align-items:center;gap:14px;background:#161b22;border:1px solid #21262d;border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s;text-align:right;color:inherit;font-family:inherit;width:100%;animation:fadeSlideUp .4s ease-out both}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.doc-row:hover{border-color:#c9a84c}
.doc-emoji{font-size:26px;flex-shrink:0}
.doc-info{flex:1;min-width:0}
.doc-title{font-weight:800;font-size:14px;margin-bottom:2px}
.doc-date{font-size:11.5px;color:#8b949e}
.doc-desc{font-size:12px;color:#8b949e;margin-top:3px;line-height:1.5}
.doc-arrow{color:#58a6ff;font-size:13px;flex-shrink:0}
.empty-note{text-align:center;color:#6e7b8f;padding:60px 0;font-size:13px}
.loading{text-align:center;color:#6e7b8f;padding:40px 0}

.viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:999;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.viewer-overlay.open{display:flex;flex-direction:column}
.viewer-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.viewer-title{font-weight:800;font-size:14px;color:#e6edf3}
.viewer-actions{display:flex;gap:10px;align-items:center}
.viewer-actions a{color:#58a6ff;font-size:12px;text-decoration:none}
.viewer-home{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);color:#c9a84c!important;border-radius:8px;padding:8px 14px!important;font-size:13px!important;font-weight:800;text-decoration:none!important;min-height:38px;display:inline-flex;align-items:center}
.viewer-close{background:none;border:1px solid #30363d;color:#e6edf3;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;min-height:38px}
@media(max-width:480px){
  .wrap{padding:14px 10px 40px}
  .doc-row{padding:11px 12px;gap:10px}
  .doc-emoji{font-size:22px}
  .doc-title{font-size:13px}
  .viewer-overlay{padding:8px}
  .viewer-top{margin-bottom:8px}
  .viewer-title{font-size:13px;flex:1 1 100%;order:1}
  .viewer-actions{order:2;width:100%;justify-content:space-between}
}
.viewer-frame-wrap{flex:1;background:#fff;border-radius:10px;overflow:hidden}
.viewer-frame-wrap iframe{width:100%;height:100%;border:0}
.doc-cover{height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;background:linear-gradient(145deg,var(--theme-primary,#123f6c),color-mix(in srgb,var(--theme-primary,#123f6c) 72%,#061b33));color:#fff}
.doc-cover-icon{font-size:38px;filter:drop-shadow(0 4px 7px rgba(0,0,0,.22))}
.doc-issue{font-size:10px;font-weight:900;letter-spacing:.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 9px;border-radius:999px}
.doc-new-card{padding:0;border:0;text-align:right;font-family:inherit;cursor:pointer;width:100%}
.doc-new-card:first-child{grid-column:span 2}
.doc-new-card:first-child .doc-cover{height:178px}
.doc-open-label{color:var(--theme-primary,#176b9a);font-weight:900}
@media(max-width:340px){.doc-new-card:first-child{grid-column:span 1}}
</style>
<link rel="stylesheet" href="tournament-theme.css?v=20260910-2">
<link rel="stylesheet" href="content-pages.css?v=20260910-1">
</head>
<body class="content-page">
<div class="nav"><span style="font-weight:800;color:#c9a84c">📰 نشرات البطولة</span><a href="#" id="backLink" onclick="history.back();return false">‹ رجوع للبطولة</a></div>
<div class="wrap">
  <section class="content-hero">
    <div class="content-kicker">🗂️ أرشيف البطولة الرسمي</div>
    <h1 id="tourName">نشرات البطولة</h1>
    <div class="content-summary">الأعداد والتقارير المنشورة مرتبة من الأحدث إلى الأقدم. اضغط على أي عدد لقراءته بحجم كامل.</div>
    <div class="content-count" id="docsCount">⏳ جاري الحصر...</div>
  </section>
  <div id="app"><div class="loading">⏳ جاري التحميل...</div></div>
</div>

<div class="viewer-overlay" id="viewerOverlay">
  <div class="viewer-top">
    <div class="viewer-title" id="viewerTitle"></div>
    <div class="viewer-actions">
      <a id="viewerHomeLink" class="viewer-home" href="#">🏠 الرئيسية</a>
      <a id="viewerExternalLink" href="#" target="_blank" rel="noopener">فتح PDF كاملًا ↗</a>
      <button class="viewer-close" onclick="closeViewer()">✕ إغلاق</button>
    </div>
  </div>
  <div class="viewer-frame-wrap"><iframe id="viewerFrame" title="عرض النشرة"></iframe></div>
</div>

<script src="vendor/supabase.min.js?v=20260910-1"></script>
<script src="supabase-config.js"></script>
<script src="tournament-scope.js?v=20260910-3"></script>
<script src="public-date.js?v=20260910-1"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const qs=new URLSearchParams(location.search);
const TID=qs.get('id')||qs.get('tid');
const scopeUrl=url=>window.TournamentScope?.scopedUrl(url)||url;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function fmtDate(d){return window.PublicDate.format(d,{year:true});}

let DOCS=[];
let visibleDocs=12;
async function load(){
  if(!TID){document.getElementById('app').innerHTML='<div class="empty-note">لم تُحدَّد بطولة</div>';return;}
  const backLink=document.getElementById('backLink');
  backLink.href=scopeUrl('tournament.html?id='+TID);
  backLink.removeAttribute('onclick');
  const [{data:t},{data,error}]=await Promise.all([
    sb.from('tournaments').select('name,primary_color,secondary_color,logo_url,cup_logo_url').eq('id',TID).single(),
    sb.from('documents').select('id,title,description,publish_date,pdf_url,created_at').eq('tournament_id',TID).order('publish_date',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false})
  ]);
  window.TournamentScope?.applyTournamentTheme(t);
  document.getElementById('tourName').textContent=(t?.name||'البطولة')+' — النشرات';

  DOCS=data||[];
  const app=document.getElementById('app');
  if(error){app.innerHTML='<div class="content-error">تعذر تحميل النشرات مؤقتًا. أعد المحاولة بعد قليل.</div>';return;}
  document.getElementById('docsCount').textContent=DOCS.length+' '+(DOCS.length===1?'نشرة منشورة':'نشرات منشورة');
  if(!DOCS.length){app.innerHTML='<div class="content-empty">🗂️<br>لا توجد نشرات منشورة لهذه البطولة حتى الآن</div>';return;}
  renderDocs();
}

function renderDocs(){
  const shown=DOCS.slice(0,visibleDocs);
  document.getElementById('app').innerHTML='<div class="content-grid">'+shown.map((d,i)=>`
    <button class="content-card doc-new-card" onclick="openViewer(${i})" style="animation-delay:${Math.min(i,8)*0.04}s">
      <div class="doc-cover"><span class="doc-cover-icon">📄</span><span class="doc-issue">${i===0?'أحدث عدد':'العدد '+String(DOCS.length-i).padStart(2,'0')}</span></div>
      <div class="content-card-body">
        <div class="content-card-title">${esc(d.title||'نشرة البطولة')}</div>
        ${d.description?`<div class="content-card-desc">${esc(d.description)}</div>`:''}
        <div class="content-meta"><span>${d.publish_date?fmtDate(d.publish_date):'دون تاريخ'}</span><span class="doc-open-label">قراءة ›</span></div>
      </div>
    </button>`).join('')+'</div>'+
    (visibleDocs<DOCS.length?'<button class="load-more" onclick="showMoreDocs()">عرض المزيد ('+(DOCS.length-visibleDocs)+')</button>':'');
}
function showMoreDocs(){visibleDocs+=12;renderDocs();}

function openViewer(i){
  const d=DOCS[i];
  if(!/^https:\/\//i.test(d.pdf_url||'')){alert('رابط النشرة غير صالح');return;}
  document.getElementById('viewerFrame').src=d.pdf_url+'#view=FitH';
  document.getElementById('viewerTitle').textContent=d.title;
  document.getElementById('viewerExternalLink').href=d.pdf_url;
  document.getElementById('viewerHomeLink').href=scopeUrl('tournament.html?id='+TID);
  document.getElementById('viewerOverlay').classList.add('open');
}
function closeViewer(){
  document.getElementById('viewerOverlay').classList.remove('open');
  document.getElementById('viewerFrame').src='';
}
window.openViewer=openViewer;
window.closeViewer=closeViewer;
window.showMoreDocs=showMoreDocs;

load().then(()=>{
  const openId=qs.get('open');
  if(openId){
    const idx=DOCS.findIndex(d=>d.id===openId);
    if(idx>-1)openViewer(idx);
  }
});
</script>
</body>
</html>
