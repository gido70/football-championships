<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطولاتي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Tajawal", sans-serif; font-size: 17px; background: #f0f4f8; color: #1a1a2e; direction: rtl; }

/* NAV - الحل النهائي المضمون */
.nav { background: #1a1a2e; height: 62px; position: sticky; top: 0; z-index: 200; border-bottom: 3px solid #c9a84c; }
.nav-inner {
  max-width: 1300px; margin: 0 auto; height: 100%;
  display: flex; align-items: center; padding: 0 32px;
  flex-direction: row;
}
/* الشعار والروابط كلها على اليمين */
.nav-right {
  display: flex; align-items: center; gap: 6px;
  margin-right: 0;
}
.nav-logo { font-size: 22px; font-weight: 900; color: white; font-family: "Tajawal",sans-serif; display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.nav-logo span { color: #c9a84c; }
.nav-links { display: flex; align-items: center; gap: 6px; }
.nav-links a { color: rgba(255,255,255,.85); text-decoration: none; font-size: 16px; font-weight: 700; font-family: "Tajawal",sans-serif; padding: 8px 18px; border-radius: 8px; transition: .2s; }
.nav-links a:hover { background: rgba(255,255,255,.1); color: white; }
/* زر الأدمن على اليسار */
.nav-left { margin-left: 0; margin-right: auto; }
.btn-admin { background: #c9a84c !important; color: #1a1a2e !important; font-weight: 800 !important; border-radius: 8px; display: inline-block; text-decoration: none; font-size: 16px; font-family: "Tajawal",sans-serif; padding: 8px 18px; }
.btn-admin:hover { background: #a88030 !important; }

/* HERO */
.hero { background: linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); padding: 80px 24px 60px; text-align: center; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center,rgba(201,168,76,.12) 0%,transparent 65%); }
.hero-badge { display: inline-block; background: rgba(201,168,76,.15); border: 1px solid rgba(201,168,76,.4); color: #c9a84c; font-size: 14px; font-weight: 700; font-family: "Tajawal",sans-serif; padding: 7px 20px; border-radius: 30px; margin-bottom: 24px; position: relative; }
.hero h1 { font-size: clamp(36px,5vw,64px); font-weight: 900; color: white; margin-bottom: 16px; line-height: 1.2; font-family: "Tajawal",sans-serif; position: relative; }
.hero h1 em { color: #c9a84c; font-style: normal; }
.hero p { font-size: 18px; color: rgba(255,255,255,.65); margin-bottom: 48px; font-family: "Tajawal",sans-serif; font-weight: 500; position: relative; }
.hero-stats { display: flex; gap: 56px; justify-content: center; flex-wrap: wrap; position: relative; }
.hero-stat { text-align: center; }
.hero-stat-num { font-size: 44px; font-weight: 900; color: #c9a84c; font-family: "Tajawal",sans-serif; line-height: 1; }
.hero-stat-lbl { font-size: 14px; color: rgba(255,255,255,.55); margin-top: 8px; font-family: "Tajawal",sans-serif; font-weight: 500; }

/* MAIN */
.main { max-width: 1200px; margin: 0 auto; padding: 44px 24px; }
.section-hd { font-size: 20px; font-weight: 800; color: #1a1a2e; margin-bottom: 24px; padding-right: 16px; border-right: 5px solid #c9a84c; font-family: "Tajawal",sans-serif; display: flex; align-items: center; gap: 10px; }

/* CARDS */
.t-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(300px,1fr)); gap: 22px; margin-bottom: 60px; }
.t-card { background: white; border-radius: 16px; overflow: hidden; cursor: pointer; transition: all .3s; text-decoration: none; display: block; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
.t-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,.15); }
.t-banner { height: 120px; display: flex; align-items: center; justify-content: center; position: relative; }
.t-logo { width: 68px; height: 68px; object-fit: contain; }
.t-logo-ph { font-size: 52px; }
.t-body { padding: 20px; text-align: right; }
.t-name { font-size: 18px; font-weight: 800; color: #1a1a2e; margin-bottom: 4px; font-family: "Tajawal",sans-serif; }
.t-season { font-size: 14px; color: #666; margin-bottom: 14px; font-family: "Tajawal",sans-serif; }
.t-meta { display: flex; gap: 16px; }
.t-meta span { font-size: 14px; color: #555; font-family: "Tajawal",sans-serif; font-weight: 500; }
.pill { position: absolute; top: 12px; right: 12px; font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-family: "Tajawal",sans-serif; }
.pill-active { background: #e8f5e9; color: #2e7d32; }
.pill-completed { background: #e3f2fd; color: #1565c0; }
.pill-draft { background: #f5f5f5; color: #757575; }

/* LIVE */
.live-section { margin-bottom: 52px; }
.live-card { background: linear-gradient(135deg,#1a1a2e,#0f3460); border: 2px solid #e53e3e; border-radius: 16px; padding: 24px; margin-bottom: 16px; cursor: pointer; transition: .25s; }
.live-card:hover { box-shadow: 0 8px 32px rgba(229,62,62,.35); transform: translateY(-2px); }
.live-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.live-tourn { font-size: 14px; color: rgba(255,255,255,.55); font-family: "Tajawal",sans-serif; }
.live-badge { background: #e53e3e; color: white; font-size: 13px; padding: 5px 14px; border-radius: 20px; font-weight: 700; display: flex; align-items: center; gap: 7px; font-family: "Tajawal",sans-serif; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: white; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; }
.sb-team { text-align: center; }
.sb-name { font-size: 17px; font-weight: 800; color: white; margin-bottom: 8px; font-family: "Tajawal",sans-serif; }
.sb-bar { height: 4px; border-radius: 2px; width: 48px; margin: 0 auto; }
.sb-center { text-align: center; }
.sb-nums { font-size: 52px; font-weight: 900; color: white; display: flex; align-items: center; gap: 12px; justify-content: center; font-family: "Tajawal",sans-serif; }
.sb-sep { font-size: 32px; color: rgba(255,255,255,.25); }
.sb-min { font-size: 15px; color: #fc8181; font-weight: 700; margin-top: 8px; font-family: "Tajawal",sans-serif; }

/* EMPTY / SKELETON */
.empty { text-align: center; padding: 80px 20px; }
.empty-icon { font-size: 64px; margin-bottom: 18px; opacity: .4; }
.empty p { font-size: 17px; line-height: 1.9; font-family: "Tajawal",sans-serif; color: #666; }
.skeleton { background: linear-gradient(90deg,#e8ecf0 25%,#f5f7fa 50%,#e8ecf0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 16px; height: 200px; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

.footer { background: #1a1a2e; color: rgba(255,255,255,.5); padding: 28px; text-align: center; font-size: 14px; font-family: "Tajawal",sans-serif; margin-top: 20px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-right">
      <div class="nav-logo">🏆 بطولاتي <span>⚽</span></div>
      <div class="nav-links">
        <a href="#live">مباشر</a>
        <a href="#tournaments">البطولات</a>
      </div>
    </div>
    <div class="nav-left">
      <a href="admin-home.html" class="btn-admin">⚙️ الأدمن</a>
    </div>
  </div>
</nav>

<div class="hero">
  <div class="hero-badge">⚽ منصة إدارة البطولات</div>
  <h1>بطولات <em>احترافية</em><br>نتائج فورية</h1>
  <p>ترتيب تلقائي · إحصائيات كاملة · نتائج مباشرة لحظة بلحظة</p>
  <div class="hero-stats">
    <div class="hero-stat"><div class="hero-stat-num" id="sT">—</div><div class="hero-stat-lbl">بطولة</div></div>
    <div class="hero-stat"><div class="hero-stat-num" id="sTm">—</div><div class="hero-stat-lbl">فريق</div></div>
    <div class="hero-stat"><div class="hero-stat-num" id="sP">—</div><div class="hero-stat-lbl">لاعب</div></div>
    <div class="hero-stat"><div class="hero-stat-num" id="sM">—</div><div class="hero-stat-lbl">مباراة</div></div>
  </div>
</div>

<div class="main">
  <div class="live-section" id="liveSection" style="display:none">
    <div class="section-hd" id="live">🔴 مباشر الآن</div>
    <div id="liveContainer"></div>
  </div>
  <div class="section-hd" id="tournaments">🏆 البطولات</div>
  <div class="t-grid" id="tGrid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>

<div class="footer">منصة إدارة البطولات · Supabase Realtime</div>

<script>
const sb = supabase.createClient(
  "https://npoowwdjpbvhyjrmeqkv.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wb293d2RqcGJ2aHlqcm1lcWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NDM4MzYsImV4cCI6MjA4OTMxOTgzNn0.8Ii2TUvDDRr_L61WVTEQkgOl9VhAyO6ywoLmUUAadgY"
);
async function loadStats(){
  const [t,tm,p,m]=await Promise.all([
    sb.from("tournaments").select("id",{count:"exact",head:true}),
    sb.from("teams").select("id",{count:"exact",head:true}),
    sb.from("players").select("id",{count:"exact",head:true}),
    sb.from("tournament_matches").select("id",{count:"exact",head:true}),
  ]);
  document.getElementById("sT").textContent=t.count??0;
  document.getElementById("sTm").textContent=tm.count??0;
  document.getElementById("sP").textContent=p.count??0;
  document.getElementById("sM").textContent=m.count??0;
}
async function loadTournaments(){
  const {data}=await sb.from("tournaments").select("*").order("created_at",{ascending:false});
  const g=document.getElementById("tGrid");
  if(!data||!data.length){g.innerHTML='<div class="empty"><div class="empty-icon">🏆</div><p>لا توجد بطولات بعد<br>أنشئ أول بطولة من لوحة الأدمن</p></div>';return;}
  const sl={draft:"مسودة",active:"نشطة",completed:"منتهية",archived:"مؤرشفة"};
  const sc={active:"pill-active",completed:"pill-completed"};
  const tp={groups_knockout:"مجموعات + إقصاء",league:"دوري",knockout:"إقصاء"};
  g.innerHTML=data.map(t=>{
    const bg="linear-gradient(135deg,"+(t.primary_color||"#1a1a2e")+","+(t.secondary_color||"#0f3460")+")";
    return '<a class="t-card" href="tournament.html?id='+t.id+'"><div class="t-banner" style="background:'+bg+'">'+(t.logo_url?'<img class="t-logo" src="'+t.logo_url+'" alt="">':'<div class="t-logo-ph">🏆</div>')+'<span class="pill '+(sc[t.status]||"pill-draft")+'">'+(sl[t.status]||"")+'</span></div><div class="t-body"><div class="t-name">'+t.name+'</div><div class="t-season">'+(t.season||"")+'</div><div class="t-meta"><span>👥 '+(t.num_teams||0)+' فريق</span><span>📋 '+(tp[t.type]||"")+'</span></div></div></a>';
  }).join("");
}
async function loadLive(){
  const {data}=await sb.from("tournament_matches").select("*,home_team:teams!home_team_id(name,primary_color),away_team:teams!away_team_id(name,primary_color),tournament:tournaments(name)").eq("status","live");
  const sec=document.getElementById("liveSection");
  const con=document.getElementById("liveContainer");
  if(!data||!data.length){sec.style.display="none";return;}
  sec.style.display="block";
  con.innerHTML=data.map(m=>'<div class="live-card" onclick="location.href=\'match.html?id='+m.id+'\'"><div class="live-top"><span class="live-tourn">'+(m.tournament?.name||"")+" — "+(m.round_name||"")+'</span><span class="live-badge"><span class="live-dot"></span> مباشر</span></div><div class="scoreboard"><div class="sb-team"><div class="sb-name">'+(m.home_team?.name||"؟")+'</div><div class="sb-bar" style="background:'+(m.home_team?.primary_color||"#c9a84c")+'"></div></div><div class="sb-center"><div class="sb-nums"><span>'+(m.home_score??0)+'</span><span class="sb-sep">—</span><span>'+(m.away_score??0)+'</span></div><div class="sb-min">'+(m.match_minute?m.match_minute+"'":"جارية")+'</div></div><div class="sb-team"><div class="sb-name">'+(m.away_team?.name||"؟")+'</div><div class="sb-bar" style="background:'+(m.away_team?.primary_color||"#e53e3e")+'"></div></div></div></div>').join("");
}
sb.channel("rt").on("postgres_changes",{event:"*",schema:"public",table:"tournament_matches"},()=>{loadLive();loadStats();}).subscribe();
loadStats();loadTournaments();loadLive();
setInterval(loadLive,30000);
</script>
</body>
</html>
