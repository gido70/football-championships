<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة البطولات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Tajawal",sans-serif;background:#0d1117;color:#e6edf3;direction:rtl;min-height:100vh}
/* NAV */
.nav{background:#161b22;border-bottom:3px solid #c9a84c;padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{font-size:20px;font-weight:900;color:white;display:flex;align-items:center;gap:10px}
.nav-logo em{color:#c9a84c;font-style:normal}
.nav-links{display:flex;gap:6px}
.nav-links a{color:rgba(255,255,255,.75);text-decoration:none;font-size:15px;font-weight:600;padding:7px 16px;border-radius:8px;transition:.2s}
.nav-links a:hover{background:rgba(255,255,255,.1);color:white}

/* HERO */
.hero{background:linear-gradient(135deg,#0b1f3a,#16213e,#0f3460);padding:72px 24px 52px;text-align:center;border-bottom:1px solid #21262d}
.hero-badge{display:inline-block;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:#c9a84c;font-size:13px;font-weight:700;padding:6px 18px;border-radius:30px;margin-bottom:22px}
.hero h1{font-size:clamp(32px,5vw,56px);font-weight:900;color:white;margin-bottom:14px;line-height:1.2}
.hero h1 em{color:#c9a84c;font-style:normal}
.hero p{font-size:17px;color:rgba(255,255,255,.6);margin-bottom:44px;font-weight:500}
.hero-stats{display:flex;gap:0;justify-content:center;flex-wrap:wrap}
.hs{text-align:center;padding:0 36px;border-left:1px solid rgba(255,255,255,.1)}
.hs:last-child{border-left:none}
.hs-num{font-size:40px;font-weight:900;color:#c9a84c;line-height:1}
.hs-lbl{font-size:13px;color:rgba(255,255,255,.45);margin-top:6px}
/* LIVE */
.live-sec{max-width:1200px;margin:32px auto 0;padding:0 20px}
.sec-hd{font-size:13px;font-weight:700;color:#c9a84c;text-transform:uppercase;letter-spacing:2px;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.sec-hd::before{content:"";width:4px;height:18px;background:#c9a84c;border-radius:2px}
.sec-hd::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,.2),transparent)}
.live-card{background:linear-gradient(135deg,#1c0a0a,#2a1010);border:2px solid rgba(248,81,73,.3);border-radius:14px;padding:20px 24px;margin-bottom:12px;cursor:pointer;transition:.2s}
.live-card:hover{border-color:#f85149;box-shadow:0 8px 24px rgba(248,81,73,.15)}
.live-top{display:flex;justify-content:space-between;margin-bottom:16px}
.live-tourn{font-size:13px;color:rgba(255,255,255,.45)}
.live-badge{background:#f85149;color:white;font-size:12px;padding:3px 12px;border-radius:20px;font-weight:700;display:flex;align-items:center;gap:6px}
.live-dot{width:7px;height:7px;border-radius:50%;background:white;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.sb-team{text-align:center}
.sb-name{font-size:16px;font-weight:800;color:white;margin-bottom:6px}
.sb-bar{height:4px;border-radius:2px;width:44px;margin:0 auto}
.sb-score{text-align:center}
.sb-nums{font-size:44px;font-weight:900;color:white;display:flex;align-items:center;gap:10px;justify-content:center}
.sb-sep{font-size:28px;color:rgba(255,255,255,.2)}
.sb-min{font-size:13px;color:#f85149;font-weight:700;margin-top:6px}
/* TOURNAMENTS */
.main{max-width:1200px;margin:0 auto;padding:36px 20px}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:48px}
.t-card{background:#161b22;border:1px solid #30363d;border-radius:16px;overflow:hidden;cursor:pointer;transition:.3s;text-decoration:none;display:block}
.t-card:hover{transform:translateY(-5px);border-color:rgba(201,168,76,.4);box-shadow:0 16px 40px rgba(0,0,0,.4)}
.t-banner{height:116px;display:flex;align-items:center;justify-content:center;position:relative}
.t-logo{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.t-logo-ph{display:none}
.t-body{padding:18px}
.t-name{font-size:17px;font-weight:800;color:#e6edf3;margin-bottom:4px}
.t-season{font-size:16px;font-weight:700;color:#c9a84c;margin-bottom:12px;letter-spacing:1px}
.t-meta{display:flex;gap:14px}
.t-meta span{font-size:13px;color:#8b949e}
.pill{position:absolute;top:10px;right:10px;font-size:11px;padding:3px 12px;border-radius:20px;font-weight:700}
.pill-active{background:rgba(63,185,80,.2);color:#3fb950;border:1px solid rgba(63,185,80,.3)}
.pill-completed{background:rgba(88,166,255,.15);color:#58a6ff;border:1px solid rgba(88,166,255,.2)}
.pill-draft{background:#21262d;color:#8b949e;border:1px solid #30363d}
.empty{text-align:center;padding:72px 20px;color:#8b949e}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.35;display:block}
.skeleton{background:linear-gradient(90deg,#161b22 25%,#1c2128 50%,#161b22 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:16px;height:196px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.footer{background:#161b22;border-top:1px solid #21262d;padding:28px;text-align:center;color:#8b949e;font-size:13px;margin-top:20px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">🏆 <em>منصة البطولات</em></div>
</nav>

<div class="hero">
  <div class="hero-badge">⚽ نتائج مباشرة · إحصائيات · ترتيب تلقائي</div>
  <h1>بطولات <em>احترافية</em><br>نتائج فورية</h1>
  <p>كل البطولات في مكان واحد — ترتيب تلقائي ونتائج لحظية</p>
  <div class="hero-stats">
    <div class="hs"><div class="hs-num" id="sT">—</div><div class="hs-lbl">بطولة</div></div>
    <div class="hs"><div class="hs-num" id="sTm">—</div><div class="hs-lbl">فريق</div></div>
    <div class="hs"><div class="hs-num" id="sP">—</div><div class="hs-lbl">لاعب</div></div>
    <div class="hs"><div class="hs-num" id="sM">—</div><div class="hs-lbl">مباراة</div></div>
  </div>
</div>

<div class="live-sec" id="liveSec" style="display:none">
  <div class="sec-hd">🔴 مباريات مباشرة الآن</div>
  <div id="liveWrap"></div>
</div>

<div class="main">
  <div class="sec-hd">🏆 البطولات</div>
  <div class="t-grid" id="tGrid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>

<div class="footer">منصة إدارة البطولات · جميع الحقوق محفوظة</div>

<script>
const sb=supabase.createClient("https://npoowwdjpbvhyjrmeqkv.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wb293d2RqcGJ2aHlqcm1lcWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NDM4MzYsImV4cCI6MjA4OTMxOTgzNn0.8Ii2TUvDDRr_L61WVTEQkgOl9VhAyO6ywoLmUUAadgY");
async function loadStats(){
  const [t,tm,p,m]=await Promise.all([
    sb.from("tournaments").select("id",{count:"exact",head:true}),
    sb.from("teams").select("id",{count:"exact",head:true}),
    sb.from("players").select("id",{count:"exact",head:true}),
    sb.from("matches").select("id",{count:"exact",head:true}),
  ]);
  document.getElementById("sT").textContent=t.count??0;
  document.getElementById("sTm").textContent=tm.count??0;
  document.getElementById("sP").textContent=p.count??0;
  document.getElementById("sM").textContent=m.count??0;
}
async function loadTournaments(){
  const {data}=await sb.from("tournaments").select("*").order("created_at",{ascending:false});
  const g=document.getElementById("tGrid");
  if(!data||!data.length){g.innerHTML='<div class="empty"><span class="empty-icon">🏆</span><p>لا توجد بطولات بعد</p></div>';return;}
  const sl={draft:"مسودة",active:"نشطة",completed:"منتهية",archived:"مؤرشفة"};
  const sc={active:"pill-active",completed:"pill-completed"};
  const tp={groups_knockout:"مجموعات + إقصاء",league:"دوري",knockout:"إقصاء"};
  g.innerHTML=data.map(t=>{
    const bg=`linear-gradient(135deg,${t.primary_color||"#0b1f3a"},${t.secondary_color||"#c9a84c"})`;
    return `<a class="t-card" href="tournament.html?id=${t.id}">
      <div class="t-banner" style="background:${bg}">
        ${(()=>{const s=t.season_label||'';const gh='https://gido70.github.io/football-championships/';const f=s.includes('2027')?'logo_cup_2027.png':s.includes('2026')?'logo_cup_2026.png':(t.logo_url||'');return f?`<img class="t-logo" src="${gh+f}" alt="${t.name}" onerror="this.style.display='none'">`:'<div class="t-logo-ph">🏆</div>';})()}
        <span class="pill ${sc[t.status]||"pill-draft"}">${sl[t.status]||""}</span>
      </div>
      <div class="t-body">
        <div class="t-name">${t.name}</div>
        <div class="t-season">${t.season_label||""}</div>
        <div class="t-meta"><span>👥 ${t.team_count||0} فريق</span><span>📋 ${tp[t.tournament_type]||""}</span></div>
      </div></a>`;
  }).join("");
}
async function loadLive(){
  const {data}=await sb.from("matches").select("*,ht:teams!matches_home_team_id_fkey(name,color_primary),at:teams!matches_away_team_id_fkey(name,color_primary),tr:tournaments(name)").eq("status","live");
  const sec=document.getElementById("liveSec");
  if(!data||!data.length){sec.style.display="none";return;}
  sec.style.display="block";
  document.getElementById("liveWrap").innerHTML=data.map(m=>`
    <div class="live-card" onclick="location.href='tournament.html?id=${m.tournament_id}'">
      <div class="live-top"><span class="live-tourn">${m.tr?.name||""} — ${m.round_name||""}</span><span class="live-badge"><span class="live-dot"></span> مباشر</span></div>
      <div class="sb">
        <div class="sb-team"><div class="sb-name">${m.ht?.name||"؟"}</div><div class="sb-bar" style="background:${m.ht?.color_primary||"#c9a84c"}"></div></div>
        <div class="sb-score"><div class="sb-nums"><span>${m.home_score??0}</span><span class="sb-sep">—</span><span>${m.away_score??0}</span></div><div class="sb-min">${m.match_minute?m.match_minute+"'":""}</div></div>
        <div class="sb-team"><div class="sb-name">${m.at?.name||"؟"}</div><div class="sb-bar" style="background:${m.at?.color_primary||"#4ea1ff"}"></div></div>
      </div></div>`).join("");
}
sb.channel("rt").on("postgres_changes",{event:"*",schema:"public",table:"matches"},()=>{loadLive();loadStats();}).subscribe();
loadStats();loadTournaments();loadLive();
setInterval(loadLive,30000);
</script>
</body>
</html>
