<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المباراة المباشرة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
body{font-family:"Tajawal",sans-serif!important}
.topbar-inner,.page-head,.nav-actions,.actions{flex-direction:row}
/* إصلاح القوائم المنسدلة */
select,input,textarea{background:#0f2a45!important;color:#ffffff!important;font-family:"Tajawal",sans-serif!important}
select option{background:#0f2a45;color:#ffffff;font-family:"Tajawal",sans-serif}
/* لوحة النتيجة */
.match-board{background:linear-gradient(135deg,#071426,#0f2a45);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px;margin-bottom:20px}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin:20px 0}
.sb-team{text-align:center}
.sb-tname{font-size:20px;font-weight:800;color:#eef5ff;margin-bottom:8px;font-family:"Tajawal",sans-serif}
.sb-tbar{height:5px;border-radius:3px;width:56px;margin:0 auto 14px}
.sb-btns{display:flex;gap:10px;justify-content:center}
.sb-btn{width:42px;height:42px;border-radius:50%;border:2px solid;font-size:22px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;background:transparent;font-family:"Tajawal",sans-serif}
.sb-plus{border-color:#34d399;color:#34d399}.sb-plus:hover{background:#34d399;color:#071426}
.sb-minus{border-color:#ff6b6b;color:#ff6b6b}.sb-minus:hover{background:#ff6b6b;color:#071426}
.sb-score{text-align:center}
.sb-nums{font-size:60px;font-weight:900;color:#eef5ff;display:flex;align-items:center;gap:14px;justify-content:center;font-family:"Tajawal",sans-serif}
.sb-sep{color:rgba(255,255,255,.15);font-weight:300}
.sb-min{font-size:15px;color:#ff6b6b;font-weight:700;margin-top:8px;font-family:"Tajawal",sans-serif}
.status-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn-start{background:linear-gradient(135deg,#34d399,#059669)!important}
.btn-end{background:linear-gradient(135deg,#ff6b6b,#cc3333)!important}
.min-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px}
.min-row input{width:80px;text-align:center;padding:8px 12px;font-size:15px;border-radius:10px;font-family:"Tajawal",sans-serif}
/* أحداث */
.evt-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.evt-panel{background:linear-gradient(180deg,rgba(16,40,70,.96),rgba(11,28,49,.96));border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:18px}
.evt-title{font-size:15px;font-weight:700;color:#eef5ff;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.07);font-family:"Tajawal",sans-serif}
.evt-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.evt-btn{padding:11px 8px;border-radius:12px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#eef5ff;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;font-family:"Tajawal",sans-serif;text-align:center}
.evt-btn:hover{border-color:#4ea1ff;background:rgba(78,161,255,.1)}
.evt-btn.g{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.05)}
.evt-btn.y{border-color:rgba(255,213,79,.3);background:rgba(255,213,79,.05)}
.evt-btn.r{border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.05)}
.evt-form{background:rgba(0,0,0,.25);border-radius:12px;padding:14px;display:none;margin-top:8px}
.evt-form.show{display:block}
.evt-form select,.evt-form input{width:100%;margin-bottom:8px;padding:9px 12px;border-radius:10px;font-size:14px}
.ef-btns{display:flex;gap:8px}
.btn-sm{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:"Tajawal",sans-serif}
.btn-sm-ok{background:#4ea1ff;color:#071426}
.btn-sm-x{background:rgba(255,255,255,.1);color:#eef5ff}
/* سجل الأحداث */
.evts-log{background:linear-gradient(180deg,rgba(16,40,70,.96),rgba(11,28,49,.96));border:1px solid rgba(255,255,255,.08);border-radius:20px;overflow:hidden}
.evts-log-hd{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;font-weight:700;color:#eef5ff;font-family:"Tajawal",sans-serif}
.evt-item{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.evt-item:last-child{border-bottom:none}
.evt-mn{background:#112a49;color:#4ea1ff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;min-width:40px;text-align:center;font-family:"Tajawal",sans-serif}
.evt-ic{font-size:18px;width:26px;text-align:center}
.evt-dt{flex:1;color:#b7c6dc;font-family:"Tajawal",sans-serif}
.evt-pl{font-weight:700;color:#eef5ff}
.evt-del{background:none;border:none;cursor:pointer;color:#b7c6dc;padding:4px 8px;border-radius:6px;font-size:14px}
.evt-del:hover{color:#ff6b6b}
.no-evts{padding:24px;text-align:center;color:#b7c6dc;font-size:14px;font-family:"Tajawal",sans-serif}
@media(max-width:640px){.evt-grid{grid-template-columns:1fr}.sb{grid-template-columns:1fr;text-align:center}.sb-nums{font-size:44px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="page-head">
      <div class="page-icon">🎯</div>
      <div class="page-title"><h1>إدارة المباراة المباشرة</h1><p>أهداف · بطاقات · نتيجة فورية للجمهور</p></div>
    </div>
    <div class="nav-actions">
      <a class="btn secondary" href="schedule-admin.html">📅 الجدول</a>
      <a class="btn secondary" href="admin-home.html">← لوحة الأدمن</a>
    </div>
  </div>
</header>

<main class="container">
  <!-- اختيار المباراة -->
  <section class="panel" style="margin-bottom:20px">
    <h3>اختيار المباراة</h3>
    <div class="form-grid">
      <div class="field"><label>البطولة</label><select id="selT" onchange="onTournChange()"><option value="">— اختر البطولة —</option></select></div>
      <div class="field"><label>المباراة</label><select id="selM" onchange="onMatchChange()"><option value="">— اختر المباراة —</option></select></div>
    </div>
    <div id="selStatus" class="status"></div>
  </section>

  <div id="matchPanel" style="display:none">
    <!-- لوحة النتيجة -->
    <div class="match-board">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span id="mRound" style="color:#b7c6dc;font-size:14px;font-family:Tajawal,sans-serif"></span>
        <span id="mStatus" style="font-size:12px;padding:3px 12px;border-radius:20px;background:rgba(255,255,255,.08);color:#b7c6dc;font-family:Tajawal,sans-serif">مجدولة</span>
      </div>
      <div class="sb">
        <div class="sb-team">
          <div class="sb-tname" id="hName">الفريق الأول</div>
          <div class="sb-tbar" id="hBar"></div>
          <div class="sb-btns">
            <button class="sb-btn sb-plus" onclick="chScore('home',1)">+</button>
            <button class="sb-btn sb-minus" onclick="chScore('home',-1)">−</button>
          </div>
        </div>
        <div class="sb-score">
          <div class="sb-nums"><span id="hScore">0</span><span class="sb-sep">—</span><span id="aScore">0</span></div>
          <div class="sb-min" id="mMin"></div>
        </div>
        <div class="sb-team">
          <div class="sb-tname" id="aName">الفريق الثاني</div>
          <div class="sb-tbar" id="aBar"></div>
          <div class="sb-btns">
            <button class="sb-btn sb-plus" onclick="chScore('away',1)">+</button>
            <button class="sb-btn sb-minus" onclick="chScore('away',-1)">−</button>
          </div>
        </div>
      </div>
      <div class="status-row">
        <button class="btn btn-start" id="btnStart" onclick="setMatchStatus('live')">▶ بدء المباراة</button>
        <button class="btn btn-end" id="btnEnd" onclick="setMatchStatus('completed')" disabled>⏹ إنهاء المباراة</button>
      </div>
      <div class="min-row">
        <label style="color:#b7c6dc;font-size:14px;font-family:Tajawal,sans-serif">الدقيقة:</label>
        <input type="number" id="minInput" min="1" max="120" value="1">
        <button class="btn secondary" onclick="saveMin()" style="padding:8px 16px;font-size:14px">تحديث</button>
      </div>
    </div>

    <!-- تسجيل الأحداث -->
    <div class="evt-grid">
      <div class="evt-panel">
        <div class="evt-title" id="hEvtTitle">⚽ الفريق الأول</div>
        <div class="evt-btns">
          <button class="evt-btn g" onclick="openEvt('h','goal')">⚽ هدف</button>
          <button class="evt-btn y" onclick="openEvt('h','yellow_card')">🟨 صفراء</button>
          <button class="evt-btn r" onclick="openEvt('h','red_card')">🟥 حمراء</button>
          <button class="evt-btn" onclick="openEvt('h','substitution')">🔄 تبديل</button>
        </div>
        <div class="evt-form" id="hForm">
          <div style="font-size:13px;color:#b7c6dc;margin-bottom:10px;font-family:Tajawal,sans-serif" id="hFormLbl">تسجيل حدث</div>
          <select id="hPlayer"><option value="">— اللاعب (اختياري) —</option></select>
          <input type="number" id="hMin" placeholder="الدقيقة" min="1" max="120">
          <div class="ef-btns">
            <button class="btn-sm btn-sm-ok" onclick="submitEvt('h')">✓ تأكيد</button>
            <button class="btn-sm btn-sm-x" onclick="closeEvt('h')">إلغاء</button>
          </div>
        </div>
      </div>
      <div class="evt-panel">
        <div class="evt-title" id="aEvtTitle">⚽ الفريق الثاني</div>
        <div class="evt-btns">
          <button class="evt-btn g" onclick="openEvt('a','goal')">⚽ هدف</button>
          <button class="evt-btn y" onclick="openEvt('a','yellow_card')">🟨 صفراء</button>
          <button class="evt-btn r" onclick="openEvt('a','red_card')">🟥 حمراء</button>
          <button class="evt-btn" onclick="openEvt('a','substitution')">🔄 تبديل</button>
        </div>
        <div class="evt-form" id="aForm">
          <div style="font-size:13px;color:#b7c6dc;margin-bottom:10px;font-family:Tajawal,sans-serif" id="aFormLbl">تسجيل حدث</div>
          <select id="aPlayer"><option value="">— اللاعب (اختياري) —</option></select>
          <input type="number" id="aMin" placeholder="الدقيقة" min="1" max="120">
          <div class="ef-btns">
            <button class="btn-sm btn-sm-ok" onclick="submitEvt('a')">✓ تأكيد</button>
            <button class="btn-sm btn-sm-x" onclick="closeEvt('a')">إلغاء</button>
          </div>
        </div>
      </div>
    </div>

    <!-- سجل الأحداث -->
    <div class="evts-log">
      <div class="evts-log-hd">📋 أحداث المباراة</div>
      <div id="evtsList"><div class="no-evts">لا توجد أحداث بعد</div></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
let cur=null,hPl=[],aPl=[],curEvtType=null,curEvtSide=null;
const EL={goal:'هدف',yellow_card:'بطاقة صفراء',red_card:'بطاقة حمراء',substitution:'تبديل'};
const EI={goal:'⚽',yellow_card:'🟨',red_card:'🟥',substitution:'🔄'};

async function init(){
  const {data}=await sb.from('tournaments').select('id,name,season_label').order('created_at',{ascending:false});
  const s=document.getElementById('selT');
  s.innerHTML='<option value="">— اختر البطولة —</option>';
  (data||[]).forEach(t=>s.innerHTML+=`<option value="${t.id}">${t.name}${t.season_label?' - '+t.season_label:''}</option>`);
}

async function onTournChange(){
  const tid=document.getElementById('selT').value;
  const s=document.getElementById('selM');
  s.innerHTML='<option value="">— اختر المباراة —</option>';
  document.getElementById('matchPanel').style.display='none';
  if(!tid)return;
  const {data}=await sb.from('matches').select('id,match_no,round_name,status,home_team_id,away_team_id').eq('tournament_id',tid).order('match_no');
  (data||[]).forEach(m=>{
    const ic=m.status==='live'?'🔴 ':m.status==='completed'?'✅ ':'⏳ ';
    s.innerHTML+=`<option value="${m.id}">${ic}مباراة ${m.match_no||''} — ${m.round_name||''}</option>`;
  });
}

async function onMatchChange(){
  const mid=document.getElementById('selM').value;
  if(!mid){document.getElementById('matchPanel').style.display='none';return;}
  const {data:m}=await sb.from('matches').select('*,ht:teams!matches_home_team_id_fkey(*),at:teams!matches_away_team_id_fkey(*)').eq('id',mid).single();
  if(!m)return;
  cur=m;
  const {data:hp}=await sb.from('players').select('id,name,number').eq('team_id',m.home_team_id).order('number');
  const {data:ap}=await sb.from('players').select('id,name,number').eq('team_id',m.away_team_id).order('number');
  hPl=hp||[];aPl=ap||[];
  fillSel('hPlayer',hPl);fillSel('aPlayer',aPl);
  renderMatch(m);loadEvts();
  document.getElementById('matchPanel').style.display='block';
}

function fillSel(id,players){
  const s=document.getElementById(id);
  s.innerHTML='<option value="">— اللاعب (اختياري) —</option>';
  players.forEach(p=>s.innerHTML+=`<option value="${p.id}">${p.number?'#'+p.number+' ':''}${p.name}</option>`);
}

function renderMatch(m){
  document.getElementById('hName').textContent=m.ht?.name||'الفريق الأول';
  document.getElementById('aName').textContent=m.at?.name||'الفريق الثاني';
  document.getElementById('hEvtTitle').textContent='⚽ '+(m.ht?.name||'الفريق الأول');
  document.getElementById('aEvtTitle').textContent='⚽ '+(m.at?.name||'الفريق الثاني');
  document.getElementById('hBar').style.background=m.ht?.color_primary||'#4ea1ff';
  document.getElementById('aBar').style.background=m.at?.color_primary||'#ff6b6b';
  document.getElementById('hScore').textContent=m.home_score??0;
  document.getElementById('aScore').textContent=m.away_score??0;
  document.getElementById('mRound').textContent=m.round_name||'';
  if(m.match_minute)document.getElementById('mMin').textContent=m.match_minute+"'";
  updateStatusUI(m.status||'scheduled');
}

function updateStatusUI(st){
  const lbl=document.getElementById('mStatus');
  const sl={scheduled:'⏳ مجدولة',live:'🔴 مباشر الآن',completed:'✅ منتهية'};
  lbl.textContent=sl[st]||st;
  document.getElementById('btnStart').disabled=st!=='scheduled';
  document.getElementById('btnEnd').disabled=st!=='live';
}

async function chScore(side,d){
  if(!cur)return;
  const f=side==='home'?'home_score':'away_score';
  const v=Math.max(0,(cur[f]||0)+d);
  await sb.from('matches').update({[f]:v}).eq('id',cur.id);
  cur[f]=v;
  document.getElementById(side==='home'?'hScore':'aScore').textContent=v;
  if(d>0)openEvt(side==='home'?'h':'a','goal');
}

async function setMatchStatus(st){
  if(!cur)return;
  await sb.from('matches').update({status:st,match_minute:st==='live'?1:cur.match_minute}).eq('id',cur.id);
  cur.status=st;updateStatusUI(st);
}

async function saveMin(){
  const m=parseInt(document.getElementById('minInput').value)||1;
  if(!cur)return;
  await sb.from('matches').update({match_minute:m}).eq('id',cur.id);
  cur.match_minute=m;document.getElementById('mMin').textContent=m+"'";
}

function openEvt(side,type){
  curEvtSide=side;curEvtType=type;
  const min=cur?.match_minute||'';
  document.getElementById(side+'FormLbl').textContent='تسجيل: '+(EL[type]||type);
  document.getElementById(side+'Min').value=min;
  document.getElementById(side+'Form').classList.add('show');
}
function closeEvt(side){document.getElementById(side+'Form').classList.remove('show');}

async function submitEvt(side){
  const pid=document.getElementById(side+'Player').value;
  const min=parseInt(document.getElementById(side+'Min').value)||cur?.match_minute||0;
  const tid=side==='h'?cur.home_team_id:cur.away_team_id;
  const {error}=await sb.from('match_events').insert({match_id:cur.id,player_id:pid||null,team_id:tid,event_type:curEvtType,minute:min});
  if(!error){closeEvt(side);loadEvts();}
}

async function loadEvts(){
  const {data}=await sb.from('match_events').select('*,player:players(name,number),team:teams(name)').eq('match_id',cur.id).order('minute');
  const list=document.getElementById('evtsList');
  if(!data||!data.length){list.innerHTML='<div class="no-evts">لا توجد أحداث بعد</div>';return;}
  list.innerHTML=data.map(e=>`
    <div class="evt-item">
      <span class="evt-mn">${e.minute||0}'</span>
      <span class="evt-ic">${EI[e.event_type]||'📌'}</span>
      <div class="evt-dt"><div class="evt-pl">${e.player?.name||'—'}</div><div>${e.team?.name||''} — ${EL[e.event_type]||e.event_type}</div></div>
      <button class="evt-del" onclick="delEvt('${e.id}')">🗑</button>
    </div>`).join('');
}

async function delEvt(id){if(!confirm('حذف؟'))return;await sb.from('match_events').delete().eq('id',id);loadEvts();}

window.chScore=chScore;window.setMatchStatus=setMatchStatus;window.saveMin=saveMin;
window.openEvt=openEvt;window.closeEvt=closeEvt;window.submitEvt=submitEvt;window.delEvt=delEvt;
document.getElementById('selT').addEventListener('change',onTournChange);
document.getElementById('selM').addEventListener('change',onMatchChange);
init();
</script>
</body>
</html>
