<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F5F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="البطولة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-app.png">
<title>المباراة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Tajawal",sans-serif;background:#F5F3EE;color:#2C2C2A;direction:rtl;min-height:100vh;overscroll-behavior-y:contain;overflow-x:hidden}
a{text-decoration:none;color:inherit}
.nav{background:#FFFFFF;border-bottom:1px solid #EDEAE0;padding:calc(8px + env(safe-area-inset-top,0px)) 20px 8px;min-height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-back{color:#79786A;font-size:14px;font-weight:700;padding:7px 16px;border-radius:8px;border:1px solid #E0DCCF;transition:.2s}
.nav-back:hover{background:#EDEAE0;color:#2C2C2A}
.nav-tname{font-size:14px;font-weight:800;color:#c9a84c;display:flex;align-items:center;gap:8px}
.nav-tname img{width:26px;height:26px;border-radius:50%;object-fit:contain}

.scoreboard{position:relative;padding:28px 16px 22px;text-align:center;overflow:hidden}
.sb-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(201,168,76,.18),transparent 60%)}
@keyframes livepulse3{0%{box-shadow:0 0 0 0 rgba(255,59,59,.6)}70%{box-shadow:0 0 0 8px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}
.match-ticker{display:flex;align-items:center;gap:8px;background:#FFFFFF;border:1px solid #EDEAE0;border-bottom:2px solid rgba(255,59,59,.4);height:38px;overflow:hidden}
.match-ticker .mt-label{flex-shrink:0;font-size:11px;font-weight:800;padding:0 12px;height:100%;display:flex;align-items:center;gap:5px;background:rgba(255,59,59,.12);color:#f85149;white-space:nowrap}
.match-ticker .mt-dot{width:7px;height:7px;border-radius:50%;background:#f85149;animation:livepulse3 1.2s infinite}
.mt-viewport{flex:1;overflow:hidden;position:relative;height:100%}
.mt-track{position:absolute;top:0;right:0;white-space:nowrap;height:100%;display:flex;align-items:center;font-size:13px;color:#2C2C2A;will-change:transform}
.mt-sep{margin:0 16px;color:#9C9A8D}
.sb-inner{position:relative;z-index:1;max-width:720px;margin:0 auto}
.sb-meta{display:flex;justify-content:center;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.sb-round{font-size:12px;font-weight:700;color:#79786A;background:#FFFFFF;border:1px solid #E0DCCF;padding:4px 12px;border-radius:20px}
.sb-status{font-size:12px;font-weight:800;padding:4px 14px;border-radius:20px}
.st-live{background:rgba(248,81,73,.15);color:#f85149;border:1px solid rgba(248,81,73,.35)}
.st-live .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f85149;margin-left:6px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.st-done{background:#EDEAE0;color:#79786A;border:1px solid #E0DCCF}
.st-sched{background:rgba(56,138,221,.12);color:#5b9fe0;border:1px solid rgba(56,138,221,.3)}

.teams-row{display:flex;align-items:flex-start;justify-content:center;gap:6px}
.team-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.team-badge{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#2C2C2A;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.team-name{font-size:16px;font-weight:800;text-align:center;max-width:140px}
.team-score{font-size:40px;font-weight:900;line-height:1;margin-top:2px}
.score-mid{display:flex;flex-direction:column;align-items:center;gap:6px;padding:38px 8px 0;min-width:36px}
.score-sep{color:#3a4150;font-size:30px;font-weight:700}
.score-min{font-size:13px;font-weight:800;color:#f85149}
.score-vs{font-size:13px;font-weight:700;color:#79786A}

.info-strip{max-width:900px;margin:24px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:0 16px}
.info-chip{background:#FFFFFF;border:1px solid #E0DCCF;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;color:#c9d1d9;display:flex;align-items:center;gap:7px}
.info-chip b{color:#79786A;font-weight:700}
.var-banner{max-width:900px;margin:14px auto 0;text-align:center;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.35);color:#c9a84c;font-weight:800;font-size:13px;padding:9px;border-radius:10px}
.var-log-wrap{max-width:900px;margin:14px auto 0;background:#F5F3EE;border:1px solid #E0DCCF;border-radius:12px;padding:12px 14px}
.var-log-title{font-size:12px;font-weight:900;color:#79786A;margin-bottom:8px}
.var-log-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#2C2C2A;padding:6px 0;border-bottom:1px solid #E0DCCF}
.var-log-row:last-child{border-bottom:none}
.var-log-badge{font-weight:900;font-size:11px;padding:2px 8px;border-radius:10px}

.stream-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#f85149,#cc3333);color:#fff;font-weight:800;font-size:14px;padding:10px 22px;border-radius:30px;margin-top:18px}
.video-embed-wrap{position:relative;width:100%;max-width:760px;margin:18px auto 0;padding-bottom:56.25%;height:0;border-radius:14px;overflow:hidden;border:1px solid #E0DCCF;background:#000}
.video-embed-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(22,27,34,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid #EDEAE0;display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;padding:10px 6px calc(8px + env(safe-area-inset-bottom,0px));font-size:11px;font-weight:700;cursor:pointer;border:none;background:transparent;color:#9C9A8D;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:"Tajawal",sans-serif;transition:.15s}
.tab .tab-ic{font-size:21px;line-height:1}
.tab.active{color:#c9a84c}
.tab:active{transform:scale(.92)}

.vote-wrap{padding:18px 16px 24px;max-width:760px;margin:0 auto}
.vote-title{font-size:16px;font-weight:900;text-align:center;margin-bottom:6px}
.vote-sub{font-size:12px;color:#79786A;text-align:center;margin-bottom:18px}
.vote-grid{display:flex;flex-direction:column;gap:10px}
.vote-card{background:#FFFFFF;border:1px solid #E0DCCF;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.vote-card:active{transform:scale(.97)}
.vote-card.voted{border-color:#c9a84c;background:rgba(201,168,76,.08)}
.vote-card.winner{border-color:#ffd700}
.vote-av{width:44px;height:44px;border-radius:50%;background:#EDEAE0;object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#9C9A8D;font-size:14px}
.vote-info{flex:1}
.vote-name{font-size:14px;font-weight:800}
.vote-team{font-size:11px;color:#79786A;margin-top:1px}
.vote-pct{font-size:16px;font-weight:900;color:#c9a84c;flex-shrink:0}
.vote-bar-bg{position:absolute;bottom:0;left:0;height:3px;width:100%;background:#EDEAE0}
.vote-bar-fill{position:absolute;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#c9a84c,#ffd700);transition:width .6s ease}
.vote-done{text-align:center;padding:24px 0;color:#79786A;font-size:13px}
.vote-total{text-align:center;font-size:11px;color:#9C9A8D;margin-top:12px}

/* ردود الفعل الحية */
.react-wrap{padding:24px 16px;max-width:500px;margin:0 auto;text-align:center}
.react-title{font-size:17px;font-weight:900;margin-bottom:6px}
.react-sub{font-size:12px;color:#79786A;margin-bottom:28px;line-height:1.6}
.react-btns{display:flex;justify-content:center;gap:14px;margin-bottom:28px}
.react-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:#FFFFFF;border:1.5px solid #E0DCCF;
  border-radius:18px;padding:16px 20px;
  cursor:pointer;transition:.15s;font-family:inherit;min-width:72px;
}
.react-btn:active{transform:scale(.92)}
.react-btn.fired{border-color:#c9a84c;background:rgba(201,168,76,.1)}
.react-ic{font-size:32px;line-height:1;transition:.2s}
.react-btn:active .react-ic{transform:scale(1.4)}
.react-cnt{font-size:13px;font-weight:900;color:#c9a84c}
.react-bar-wrap{background:#FFFFFF;border:1px solid #E0DCCF;border-radius:14px;padding:16px 18px}
.react-bar-title{font-size:12px;color:#79786A;font-weight:700;margin-bottom:12px;text-align:right}
.react-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.react-bar-row:last-child{margin-bottom:0}
.react-bar-ic{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.react-bar-bg{flex:1;height:8px;background:#EDEAE0;border-radius:10px;overflow:hidden}
.react-bar-fill{height:100%;border-radius:10px;transition:width .6s ease}
.react-bar-pct{font-size:11px;color:#79786A;font-weight:700;width:30px;text-align:left;flex-shrink:0}
.react-total{font-size:11px;color:#9C9A8D;margin-top:12px;text-align:center}
.pred-wrap{padding:20px 16px;max-width:500px;margin:0 auto;text-align:center}
.pred-title{font-size:17px;font-weight:900;margin-bottom:6px}
.pred-sub{font-size:12px;color:#79786A;margin-bottom:22px;line-height:1.6}
.pred-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px}
.pred-team{font-size:13px;font-weight:800;width:100px;line-height:1.3}
.pred-team.away{text-align:right}
.pred-score-box{display:flex;align-items:center;gap:8px}
.pred-inp{width:52px;height:52px;background:#FFFFFF;border:2px solid #E0DCCF;border-radius:12px;text-align:center;font-size:22px;font-weight:900;color:#2C2C2A;font-family:inherit}
.pred-inp:focus{outline:none;border-color:#c9a84c}
.pred-sep{font-size:20px;color:#3a4150;font-weight:900}
.pred-btn{display:block;width:100%;background:linear-gradient(135deg,#c9a84c,#a8842e);color:#2C2C2A;border:none;padding:12px;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
.pred-done{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);border-radius:14px;padding:16px;margin-bottom:18px;font-size:14px;font-weight:800;color:#3fb950}
.pred-stats{background:#FFFFFF;border:1px solid #E0DCCF;border-radius:14px;padding:14px;text-align:right}
.pred-stats-title{font-size:12px;font-weight:800;color:#79786A;margin-bottom:10px;text-align:center}
.pred-stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #EDEAE0;font-size:13px}
.pred-stat-row:last-child{border-bottom:none}
.pred-stat-score{font-family:monospace;font-size:14px;font-weight:900;color:#c9a84c;letter-spacing:2px}
.pred-stat-pct{font-size:11px;color:#79786A}

.main{max-width:900px;margin:0 auto;padding:18px 16px calc(84px + env(safe-area-inset-bottom,0px))}
.pane{display:none;animation:fadeIn .25s ease}
.pane.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.empty{text-align:center;padding:50px 0;color:#79786A}
.empty span{font-size:36px;display:block;margin-bottom:8px}

/* events */
.evt-row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-bottom:1px solid #EDEAE0;border-right:4px solid transparent}
.evt-row.away-side{flex-direction:row-reverse;text-align:left;border-right:none;border-left:4px solid transparent}
.evt-ic{font-size:18px;width:30px;text-align:center}
.evt-min{font-size:12px;font-weight:800;color:#79786A;width:34px;text-align:center}
.evt-name{font-size:14px;font-weight:700;flex:1}

/* ===== مكوّن بطاقة اللاعب الموحّد (يُستخدم في كل صفحة) ===== */
.pchip{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.03);border:1px solid #EDEAE0;border-radius:30px;padding:5px 12px 5px 6px;max-width:100%;color:#2C2C2A}
.pchip-photo{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid #E0DCCF}
.pchip-av{width:30px;height:30px;border-radius:50%;background:#EDEAE0;border:1.5px solid #E0DCCF;font-size:11px;font-weight:800;color:#79786A;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pchip-num{font-size:10px;font-weight:900;color:#c9a84c;flex-shrink:0}
.pchip-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip-role{font-size:10px;font-weight:800;color:#9C9A8D;margin-right:4px;flex-shrink:0}
.pchip.goal{border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.06)}
.pchip.yellow{border-color:rgba(255,213,79,.4);background:rgba(255,213,79,.06)}
.pchip.red{border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.06)}
.pchip.motm{border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.1)}
.team-section{padding:16px 16px 4px}
.team-hd{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.lu-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 0 12px}
@media(min-width:420px){.pl-grid{grid-template-columns:repeat(5,1fr)}}
.pl-card{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.pl-card.pl-sub{opacity:.6}
.pl-num{font-size:11px;font-weight:900;color:#79786A}
.pl-photo-wrap{width:54px;height:54px}
.pl-photo{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #E0DCCF}
.pl-initials{width:54px;height:54px;border-radius:50%;background:#EDEAE0;border:2px solid #E0DCCF;font-size:14px;font-weight:800;color:#9C9A8D;display:flex;align-items:center;justify-content:center}
.pl-name{font-size:11px;font-weight:800;line-height:1.3;color:#2C2C2A;width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-badge{font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;background:rgba(201,168,76,.2);color:#c9a84c}
.pl-badge.sub{background:rgba(139,148,158,.15);color:#79786A}
.pl-badge.injury{background:rgba(248,81,73,.15);color:#f85149}
.staff-row{display:flex;gap:10px;padding:0 0 14px;flex-wrap:wrap}
.staff-card{display:flex;align-items:center;gap:10px;flex:1;min-width:140px;background:linear-gradient(135deg,#EDEAE0,#FFFFFF);border:1px solid;border-radius:12px;padding:10px 12px}
.staff-photo{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0}
.staff-initials{width:44px;height:44px;border-radius:10px;border:2px solid;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#F5F3EE}
.staff-info{min-width:0}
.staff-role{font-size:10px;font-weight:800;letter-spacing:.5px;margin-bottom:3px}
.staff-name{font-size:13px;font-weight:700;color:#2C2C2A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.lu-team-hd{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid}
.lu-pl{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px}
.lu-num{width:22px;height:22px;border-radius:6px;background:#EDEAE0;color:#79786A;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lu-injury{color:#f85149;font-size:12px}
.lu-sub-hd{font-size:11px;color:#79786A;font-weight:700;margin:12px 0 6px;letter-spacing:.5px}
@media(max-width:600px){.lu-grid{grid-template-columns:1fr}}

.motm{max-width:900px;margin:18px auto 0;background:linear-gradient(135deg,#EDEAE0,#FFFFFF);border:1px solid #c9a84c;border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:14px}
.winner-banner{max-width:900px;margin:14px auto 0;background:linear-gradient(135deg,#2d6a4f,#1e4d38);color:#fff;border-radius:14px;padding:12px 20px;text-align:center;font-size:15px;font-weight:900}
.winner-banner .cup{font-size:18px;margin-left:6px}
.draw-banner{max-width:900px;margin:14px auto 0;background:#EDEAE0;color:#79786A;border-radius:14px;padding:12px 20px;text-align:center;font-size:14px;font-weight:800}
.motm-ic{font-size:30px}
.motm-lbl{font-size:11px;color:#c9a84c;font-weight:800;letter-spacing:.5px}
.motm-name{font-size:16px;font-weight:800}

/* زر الرجوع العائم في الموبايل */
.float-back{display:none;position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:16px;z-index:199;background:rgba(6,14,26,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(201,168,76,.3);border-radius:30px;padding:10px 18px;font-size:13px;font-weight:800;color:#c9a84c;text-decoration:none;box-shadow:0 4px 18px rgba(0,0,0,.4)}
@media(max-width:760px){.float-back{display:flex;align-items:center;gap:6px}}
</style>
</head>
<body>

<div class="nav">
  <a class="nav-back" id="backLink" href="index.html">← الرئيسية</a>
  <div class="nav-tname" id="navTName"></div>
</div>

<div class="scoreboard">
  <div class="sb-glow"></div>
  <div class="sb-inner">
    <div class="sb-meta">
      <span class="sb-round" id="roundLbl"></span>
      <span class="sb-status" id="statusLbl"></span>
    </div>
    <div class="teams-row">
      <div class="team-col">
        <div class="team-badge" id="hBadge"></div>
        <div class="team-name" id="hName"></div>
        <div class="team-score" id="hScore">–</div>
      </div>
      <div class="score-mid">
        <div class="score-sep">:</div>
        <div class="score-min" id="liveMin" style="display:none"></div>
        <div class="score-vs" id="vsLbl" style="display:none">VS</div>
      </div>
      <div class="team-col">
        <div class="team-badge" id="aBadge"></div>
        <div class="team-name" id="aName"></div>
        <div class="team-score" id="aScore">–</div>
      </div>
    </div>
    <div id="varBanner" class="var-banner" style="display:none"></div>
    <div class="info-strip" id="infoStrip"></div>
    <div id="varLogDisplay"></div>
  </div>
</div>

<div id="winnerWrap"></div>

<div id="motmWrap"></div>

<div class="main" style="padding-bottom:0">
  <div id="streamWrap"></div>
</div>

<div id="matchNewsTicker"></div>

<div class="main">
  <div class="pane active" id="p-events"><div id="eventsWrap"></div></div>
  <div class="pane" id="p-lineups"><div id="lineupsWrap"></div></div>
  <div class="pane" id="p-vote"><div id="voteWrap"></div></div>
  <div class="pane" id="p-predict"><div id="predictWrap"></div></div>
  <div class="pane" id="p-react"><div id="reactWrap"></div></div>
</div>

<div class="tabbar">
  <a class="tab" href="index.html"><span class="tab-ic">🏠</span>الرئيسية</a>
  <button class="tab active" data-p="events" onclick="showTab('events')"><span class="tab-ic">⚡</span>الأحداث</button>
  <button class="tab" data-p="lineups" onclick="showTab('lineups')"><span class="tab-ic">👥</span>التشكيلة</button>
  <button class="tab" data-p="vote" onclick="showTab('vote');loadVote()"><span class="tab-ic">⭐</span>صوّت</button>
  <button class="tab" data-p="predict" onclick="showTab('predict');loadPredict()"><span class="tab-ic">🎯</span>توقّع</button>

<script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const qs=new URLSearchParams(location.search);
const MID=qs.get('id');
const EL={goal:'هدف',yellow_card:'بطاقة صفراء',red_card:'بطاقة حمراء',substitution:'تبديل',injury:'إصابة'};
const EI={goal:'⚽',yellow_card:'🟨',red_card:'🟥',substitution:'🔄',injury:'🩹'};

function showTab(p){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.p===p));
  document.querySelectorAll('.pane').forEach(el=>el.classList.toggle('active',el.id==='p-'+p));

// ---------- تصويت نجم المباراة ----------
function getSessionKey(){
  let k=localStorage.getItem('vote_sk');
  if(!k){k=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('vote_sk',k);}
  return k;
}

let voteLoaded=false;
async function loadVote(){
  if(!cur){document.getElementById('voteWrap').innerHTML='<div class="vote-done">اختر مباراة أولاً لتصويت على نجمها</div>';return;}
  if(voteLoaded)return;
  voteLoaded=true;
  await renderVote();
}

async function renderVote(){
  const wrap=document.getElementById('voteWrap');
  const MID=cur.id;
  const sk=getSessionKey();

  // اجلب اللاعبين من الفريقين
  const {data:lineups}=await sb.from('match_lineups').select('player:players(id,name,full_name_ar,number,jersey_photo_url,team_id)').eq('match_id',MID);
  const players=(lineups||[]).map(l=>l.player).filter(Boolean);

  if(!players.length){
    wrap.innerHTML='<div class="vote-wrap"><div class="vote-title">⭐ صوّت على نجم المباراة</div><div class="vote-done">لم تُحمَّل التشكيلة بعد — لا يمكن التصويت الآن</div></div>';
    return;
  }

  // اجلب التصويتات الحالية
  const {data:votes}=await sb.from('match_votes').select('player_id,session_key').eq('match_id',MID);
  const myVote=(votes||[]).find(v=>v.session_key===sk)?.player_id||null;
  const total=(votes||[]).length||1;
  const countMap={};
  (votes||[]).forEach(v=>{if(v.player_id)countMap[v.player_id]=(countMap[v.player_id]||0)+1;});
  const topId=Object.entries(countMap).sort((a,b)=>b[1]-a[1])[0]?.[0];

  function initials(n){return(n||'؟').trim().split(' ').map(w=>w[0]).slice(0,2).join('');}
  function teamColorOf(teamId){return teamId===cur.home_team_id?cur.ht?.primary_color:(teamId===cur.away_team_id?cur.at?.primary_color:null);}

  const cards=players.map(p=>{
    const cnt=countMap[p.id]||0;
    const pct=Math.round(cnt/total*100);
    const isMyVote=myVote===p.id;
    const isWinner=p.id===topId&&total>1;
    const tColor=teamColorOf(p.team_id);
    return `<div class="vote-card ${isMyVote?'voted':''} ${isWinner?'winner':''}" onclick="castVote('${p.id}','${MID}')">
      ${p.jersey_photo_url?`<img class="vote-av" src="${p.jersey_photo_url}">`:`<div class="vote-av" style="overflow:hidden;padding:0">${genAvatarSvg(tColor,null,p.number)}</div>`}
      <div class="vote-info">
        <div class="vote-name">${p.full_name_ar||p.name}${isMyVote?' ✓':''}</div>
        <div class="vote-team">${isWinner?'🏆 المتصدر الآن':''}</div>
      </div>
      <div class="vote-pct">${myVote?pct+'%':''}</div>
      <div class="vote-bar-bg"></div>
      <div class="vote-bar-fill" style="width:${myVote?pct:0}%"></div>
    </div>`;
  }).join('');

  wrap.innerHTML=`<div class="vote-wrap">
    <div class="vote-title">⭐ صوّت على نجم المباراة</div>
    <div class="vote-sub">${myVote?'شكرًا — صوّتك سُجِّل. النتائج الآن:':'اختر اللاعب الأبرز في رأيك — صوت واحد فقط'}</div>
    <div class="vote-grid">${cards}</div>
    <div class="vote-total">${total>1?'إجمالي الأصوات: '+(total-1)+' صوت':''}</div>
  </div>`;
}

async function castVote(playerId,matchId){
  const sk=getSessionKey();
  const {error}=await sb.from('match_votes').upsert({
    match_id:matchId,
    tournament_id:cur.tournament_id,
    player_id:playerId,
    session_key:sk
  },{onConflict:'match_id,session_key'});
  if(!error){voteLoaded=false;await renderVote();}
}
window.castVote=castVote;

let predictLoaded=false;
async function loadPredict(){

  predictLoaded=true;

function getPlayerName(){return localStorage.getItem('wc_player_name')||'';}
function setPlayerName(n){localStorage.setItem('wc_player_name',n);}

async function renderPredict(){
  const wrap=document.getElementById('predictWrap');
  const MID=cur.id;
  const sk=getSessionKey();
  const hName=cur.ht?.name_ar||cur.ht?.name||'الفريق الأول';
  const aName=cur.at?.name_ar||cur.at?.name||'الفريق الثاني';
  const myName=getPlayerName();

  if(!myName){
    wrap.innerHTML=`<div class="pred-wrap">
      <div class="pred-title">🎯 توقّع النتيجة</div>
      <div class="pred-sub">اكتب اسمك أولاً — يظهر في لوحة المتصدرين وتُحسب به نقاطك</div>
      <input class="pred-inp" id="nameInp" type="text" maxlength="30" placeholder="اسمك" style="width:100%;text-align:center;margin:10px 0">
      <button class="pred-btn" onclick="saveNameAndRender()">متابعة</button>
    </div>`;
    return;
  }

  const {data:preds}=await sb.from('match_predictions').select('home_score_pred,away_score_pred,session_key,player_name,created_at').eq('match_id',MID);
  const myPred=(preds||[]).find(p=>p.session_key===sk);
  const total=(preds||[]).length;

  let closestBanner='';
  if(cur.status==='completed'&&cur.home_score!=null&&cur.away_score!=null&&total>0){
    const withDist=(preds||[]).map(p=>{
      const dist=Math.abs(p.home_score_pred-cur.home_score)+Math.abs(p.away_score_pred-cur.away_score);
      const exact=(Number(p.home_score_pred)===Number(cur.home_score)&&Number(p.away_score_pred)===Number(cur.away_score));
      return {...p,dist,exact};
    }).sort((a,b)=>a.dist-b.dist||(a.exact===b.exact?0:(a.exact?-1:1))||(new Date(a.created_at)-new Date(b.created_at)));
    const winner=withDist[0];
    if(winner){
      closestBanner=`<div class="pred-wrap" style="border:2px solid #c9a84c;background:linear-gradient(160deg,rgba(201,168,76,.15),transparent);margin-bottom:14px;text-align:center">
        <div style="font-size:32px">🏆</div>
        <div style="font-weight:900;color:#c9a84c;font-size:16px;margin:6px 0">أقرب توقع لهذه المباراة</div>
        <div style="font-weight:800;font-size:18px">${escapeHtmlPn(winner.player_name||'مجهول')}</div>
        <div style="color:#79786A;font-size:12px;margin-top:4px">توقع ${winner.home_score_pred} - ${winner.away_score_pred} ${winner.exact?'· 🎯 نتيجة دقيقة!':''}</div>
      </div>`;
    }
  }

  // إحصاء النتائج المتوقعة
  const scoreCount={};
  (preds||[]).forEach(p=>{
    const k=`${p.home_score_pred}-${p.away_score_pred}`;
    scoreCount[k]=(scoreCount[k]||0)+1;
  });
  const topScores=Object.entries(scoreCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const statsHtml=total>0?`<div class="pred-stats">
    <div class="pred-stats-title">📊 أكثر النتائج توقعًا (${total} مشارك)</div>
    ${topScores.map(([sc,cnt])=>`<div class="pred-stat-row">
      <span class="pred-stat-score">${sc.replace('-',' : ')}</span>
      <span>${cnt} توقع</span>
      <span class="pred-stat-pct">${Math.round(cnt/total*100)}%</span>
    </div>`).join('')}
  </div>`:'';

  const leaderboardLink=`<a href="leaderboard.html?tid=${cur.tournament_id}" class="pred-btn" style="display:block;text-align:center;background:#c9a84c;margin-top:10px">🏆 لوحة المتصدرين</a>`;

  const isLocked=cur.status!=='scheduled';

  if(isLocked&&myPred){
    wrap.innerHTML=`${closestBanner}<div class="pred-wrap">
      <div class="pred-title">🔒 توقعاتك — ${escapeHtmlPn(myName)}</div>
      <div class="pred-done">توقعت: ${hName} ${myPred.home_score_pred} - ${myPred.away_score_pred} ${aName}</div>
      <div class="pred-sub">التوقعات مغلقة الآن — لا يمكن التعديل بعد بداية المباراة</div>
      ${leaderboardLink}
      <div style="margin-top:16px">${statsHtml}</div>
    </div>`;
    return;
  }
  if(isLocked&&!myPred){
    wrap.innerHTML=`${closestBanner}<div class="pred-wrap">
      <div class="pred-title">🔒 التوقعات مغلقة</div>
      <div class="pred-sub">${cur.status==='live'?'المباراة بدأت بالفعل — لم يعد بالإمكان التوقع':'انتهت المباراة'}</div>
      ${leaderboardLink}
      ${total>0?`<div style="margin-top:16px">${statsHtml}</div>`:''}
    </div>`;
    return;
  }

  if(myPred){
    wrap.innerHTML=`${closestBanner}<div class="pred-wrap">
      <div class="pred-title">🎯 توقعاتك — ${escapeHtmlPn(myName)}</div>
      <div class="pred-done">توقعت: ${hName} ${myPred.home_score_pred} - ${myPred.away_score_pred} ${aName}</div>
      <div class="pred-sub" style="margin-bottom:12px">هل تريد تغيير توقعك؟</div>
      <div class="pred-row">
        <span class="pred-team">${hName}</span>
        <div class="pred-score-box">
          <input class="pred-inp" id="ph" type="number" min="0" max="20" value="${myPred.home_score_pred}">
          <span class="pred-sep">:</span>
          <input class="pred-inp" id="pa" type="number" min="0" max="20" value="${myPred.away_score_pred}">
        </div>
        <span class="pred-team away">${aName}</span>
      </div>
      <button class="pred-btn" onclick="submitPredict('${MID}')">تحديث التوقع</button>
      ${leaderboardLink}
      <div style="margin-top:16px">${statsHtml}</div>
    </div>`;
  } else {
    wrap.innerHTML=`${closestBanner}<div class="pred-wrap">
      <div class="pred-title">🎯 توقّع النتيجة — ${escapeHtmlPn(myName)}</div>
      <div class="pred-sub">ما هي نتيجة هذه المباراة في رأيك؟<br>يمكنك تغيير توقعك حتى قبل بداية المباراة فقط</div>
      <div class="pred-row">
        <span class="pred-team">${hName}</span>
        <div class="pred-score-box">
          <input class="pred-inp" id="ph" type="number" min="0" max="20" value="0">
          <span class="pred-sep">:</span>
          <input class="pred-inp" id="pa" type="number" min="0" max="20" value="0">
        </div>
        <span class="pred-team away">${aName}</span>
      </div>
      <button class="pred-btn" onclick="submitPredict('${MID}')">إرسال توقعي</button>
      ${leaderboardLink}
      ${total>0?`<div style="margin-top:16px">${statsHtml}</div>`:''}
    </div>`;
  }
}

function escapeHtmlPn(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

// ---------- ردود الفعل الحية ----------
const REACTIONS=[
  {key:'fire', ic:'🔥', label:'ملتهب'},
  {key:'wow',  ic:'😱', label:'رائع'},
  {key:'clap', ic:'👏', label:'تصفيق'},

];
const REACT_COLORS={fire:'#f85149',wow:'#c9a84c',clap:'#3fb950',sad:'#58a6ff'};

let reactLoaded=false;
let reactChannel=null;

async function loadReact(){

async function renderReact(){
  const MID=cur?.id;
  if(!MID)return;
  const {data}=await sb.from('match_reactions').select('reaction').eq('match_id',MID);
  const total=(data||[]).length;
  const counts={fire:0,wow:0,clap:0,sad:0};
  (data||[]).forEach(r=>counts[r.reaction]=(counts[r.reaction]||0)+1);
  const max=Math.max(...Object.values(counts),1);

  document.getElementById('reactWrap').innerHTML=`
    <div class="react-wrap">
      <div class="react-title">⚡ تفاعل مع المباراة</div>

        ${REACTIONS.map(r=>`

      <div class="react-bar-wrap">
        <div class="react-bar-title">توزيع ردود الفعل</div>
        ${REACTIONS.map(r=>`
          <div class="react-bar-row">
            <span class="react-bar-ic">${r.ic}</span>

            </div>
            <span class="react-bar-pct">${Math.round((counts[r.key]||0)/total*100)}%</span>
          </div>`).join('')}
        <div class="react-total">إجمالي التفاعلات: ${total}</div>

async function sendReact(type,btn){
  if(!cur)return;
  btn.classList.add('fired');
  btn.querySelector('.react-ic').style.transform='scale(1.5)';
  setTimeout(()=>{
    btn.querySelector('.react-ic').style.transform='';
  },300);
  await sb.from('match_reactions').insert({
    match_id:cur.id,
    tournament_id:cur.tournament_id,
    reaction:type
  });
  // تحديث العداد فوراً بدون انتظار Realtime
  const cnt=btn.querySelector('.react-cnt');
  cnt.textContent=parseInt(cnt.textContent||0)+1;
}
window.sendReact=sendReact;

function initials(name){return (name||'؟').trim().split(' ').map(w=>w[0]).slice(0,2).join('');}

let clockTimer=null;
function phaseOffsetMinPub(half,HL){
  const ET=15;
  if(half===1)return 0;
  if(half===2)return HL;
  if(half===3)return HL*2;
  if(half===4)return HL*2+ET;
  return HL*2+ET*2;
}
const HALF_LABELS={1:'⏱️ الشوط الأول',2:'⏱️ الشوط الثاني',3:'⏱️ وقت إضافي 1',4:'⏱️ وقت إضافي 2',5:'🎯 ركلات ترجيح'};
function startClock(m){
  stopClock();
  const liveMinEl=document.getElementById('liveMin');
  if(m.current_half===5){liveMinEl.textContent='🎯 ركلات ترجيح'+((m.home_penalties!=null&&m.away_penalties!=null)?(' '+m.home_penalties+'-'+m.away_penalties):'');return;}
  if(m.is_paused){liveMinEl.textContent='⏸️ استراحة';return;}
  if(!m.phase_started_at)return;
  const HL=m.half_length_minutes||20;
  const offset=phaseOffsetMinPub(m.current_half||1,HL);
  const startedMs=new Date(m.phase_started_at).getTime();
  const tick=()=>{
    const elapsedMin=offset+Math.floor((Date.now()-startedMs)/60000)+1;
    liveMinEl.textContent=elapsedMin+"'";
  };
  tick();
  clockTimer=setInterval(tick,1000);
}
function stopClock(){if(clockTimer){clearInterval(clockTimer);clockTimer=null;}}

let mtRaf=null, mtPos=0;
function stopMatchTicker(){
  if(mtRaf){cancelAnimationFrame(mtRaf);mtRaf=null;}
  document.getElementById('matchNewsTicker').innerHTML='';
}
async function loadMatchTicker(m){
  const box=document.getElementById('matchNewsTicker');
  if(m.status!=='live'){stopMatchTicker();return;}
  const {data}=await sb.from('news_items').select('content,created_at').eq('match_id',m.id).order('created_at',{ascending:false}).limit(15);
  if(!data||!data.length){stopMatchTicker();return;}
  box.innerHTML=`<div class="match-ticker">
    <div class="mt-label"><span class="mt-dot"></span>أخبار المباراة</div>
    <div class="mt-viewport"><div class="mt-track" id="mtTrack">${data.map(n=>`<span>${n.content}</span>`).join('<span class="mt-sep">•</span>')}</div></div>
  </div>`;
  const track=document.getElementById('mtTrack');
  mtPos=track.parentElement.offsetWidth;
  if(mtRaf)cancelAnimationFrame(mtRaf);
  const step=()=>{
    mtPos-=1;
    if(mtPos<-track.scrollWidth)mtPos=track.parentElement.offsetWidth;
    track.style.transform='translateX('+mtPos+'px)';
    mtRaf=requestAnimationFrame(step);
  };
  step();
}

async function init(){
  if(!MID){document.body.innerHTML='<div class="empty"><span>⚠️</span><p>لم يتم تحديد المباراة</p></div>';return;}
  const {data:m,error}=await sb.from('matches').select('*,ht:teams!matches_home_team_id_fkey(*),at:teams!matches_away_team_id_fkey(*)').eq('id',MID).single();
  if(error||!m){document.body.innerHTML='<div class="empty"><span>⚠️</span><p>تعذر تحميل بيانات المباراة</p></div>';return;}

  document.getElementById('backLink').href='tournament.html?id='+m.tournament_id;

  const {data:t}=await sb.from('tournaments').select('*').eq('id',m.tournament_id).single();
  if(t){
    document.getElementById('navTName').innerHTML=(t.logo_url?`<img src="${t.logo_url}">`:'🏆')+' '+(t.name_ar||t.name||'');
    document.title=(m.ht?.name_ar||m.ht?.name||'')+' × '+(m.at?.name_ar||m.at?.name||'')+' — '+(t.name_ar||t.name||'');
  }

  const ht=m.ht||{},at=m.at||{};
  const hColor=ht.primary_color||ht.color_primary||'#79786A';
  const aColor=at.primary_color||at.color_primary||'#79786A';
  const hColor2=ht.secondary_color||hColor;
  const aColor2=at.secondary_color||aColor;
  const teamBg=(c1,c2)=>c2&&c2!==c1?`linear-gradient(90deg, ${c1} 50%, ${c2} 50%)`:c1;
  document.getElementById('hName').textContent=ht.name_ar||ht.name||'؟';
  document.getElementById('aName').textContent=at.name_ar||at.name||'؟';
  const hB=document.getElementById('hBadge'),aB=document.getElementById('aBadge');
  hB.style.background=teamBg(hColor,hColor2); aB.style.background=teamBg(aColor,aColor2);
  if(ht.logo_url){hB.innerHTML=`<img src="${ht.logo_url}" style="width:100%;height:100%;object-fit:contain;border-radius:50%">`;}else{hB.textContent=initials(ht.name_ar||ht.name);}
  if(at.logo_url){aB.innerHTML=`<img src="${at.logo_url}" style="width:100%;height:100%;object-fit:contain;border-radius:50%">`;}else{aB.textContent=initials(at.name_ar||at.name);}

  loadMatchTicker(m);

  const rl={group:'دور المجموعات',quarter_final:'ربع النهائي',semi_final:'نصف النهائي',third_place:'مباراة المركز الثالث',final:'النهائي'};
  document.getElementById('roundLbl').textContent=rl[m.round_name]||m.round_name||'';

  const sl=document.getElementById('statusLbl');
  if(m.status==='live'){
    sl.className='sb-status st-live'; sl.innerHTML='<span class="dot"></span> مباشر الآن';
    document.getElementById('hScore').textContent=m.home_score??0;
    document.getElementById('aScore').textContent=m.away_score??0;
    document.getElementById('liveMin').style.display='block';
    startClock(m);
  }else if(m.status==='completed'){
    stopClock();
    sl.className='sb-status st-done'; sl.textContent='انتهت المباراة';
    document.getElementById('hScore').textContent=m.home_score??0;
    document.getElementById('aScore').textContent=m.away_score??0;
  }else{
    stopClock();
    sl.className='sb-status st-sched'; sl.textContent='لم تبدأ بعد';
    document.getElementById('vsLbl').style.display='block';
    document.getElementById('hScore').textContent='';
    document.getElementById('aScore').textContent='';
  }

  if(m.status==='live'&&m.live_status&&m.live_status!=='none'&&{checking:1,goal_confirmed:1,goal_disallowed:1,penalty_review:1,red_card_review:1}[m.live_status]){
    const vl={checking:'⏳ الفار يراجع الحدث الآن...',goal_confirmed:'✅ تم تأكيد الهدف بعد المراجعة',goal_disallowed:'❌ تم إلغاء الهدف بعد مراجعة الفار',penalty_review:'🎯 الفار يراجع ركلة جزاء',red_card_review:'🟥 الفار يراجع بطاقة حمراء'};
    let txt=vl[m.live_status];
    if(m.var_team_id){
      const tn=m.var_team_id===m.home_team_id?(ht.name_ar||ht.name):(at.name_ar||at.name);
      if(tn)txt+=' — '+tn;
    }
    document.getElementById('varBanner').style.display='block';
    document.getElementById('varBanner').textContent=txt;
  }else{
    document.getElementById('varBanner').style.display='none';
  }

  const chips=[];
  if(m.venue_name||m.venue) chips.push(`<div class="info-chip">🏟️ <b>الملعب</b> ${m.venue_name||m.venue}</div>`);
  if(m.match_date) chips.push(`<div class="info-chip">📅 ${new Date(m.match_date).toLocaleDateString('ar-SA-u-nu-latn',{weekday:'long',day:'numeric',month:'long'})} ${m.match_time?'— '+m.match_time:''}</div>`);
  if(m.referee_1) chips.push(`<div class="info-chip">👨‍⚖️ <b>الحكم</b> ${m.referee_1}</div>`);
  if(m.referee_2) chips.push(`<div class="info-chip">🚩 <b>مساعد</b> ${m.referee_2}</div>`);
  if(m.commentator) chips.push(`<div class="info-chip">🎙️ <b>التعليق</b> ${m.commentator}</div>`);
  document.getElementById('infoStrip').innerHTML=chips.join('');

  function youtubeEmbed(url){
    try{
      const u=new URL(url);
      let id='';
      if(u.hostname.includes('youtu.be'))id=u.pathname.replace('/','');
      else if(u.searchParams.get('v'))id=u.searchParams.get('v');
      else if(u.pathname.includes('/embed/'))return url;
      return 'https://www.youtube.com/embed/'+id;
    }catch(e){return url;}
  }

  if(m.stream_url){
    if(document.getElementById('floatBack'))document.getElementById('floatBack').href='tournament.html?id='+(m.tournament_id||'');
  document.getElementById('streamWrap').innerHTML=`<div class="video-embed-wrap">
      <iframe src="${m.stream_url}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>
    </div>`;
  }else if(m.highlight_video_url){
    document.getElementById('streamWrap').innerHTML=`<div class="video-embed-wrap">
      <iframe src="${youtubeEmbed(m.highlight_video_url)}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>
    </div>`;
  }

  let winnerHtml='';
  if(m.status==='completed'&&m.home_score!=null&&m.away_score!=null){
    if(m.home_score>m.away_score)winnerHtml=`<div class="winner-banner"><span class="cup">🏆</span>${ht?.name_ar||ht?.name||''} فاز بالمباراة</div>`;
    else if(m.away_score>m.home_score)winnerHtml=`<div class="winner-banner"><span class="cup">🏆</span>${at?.name_ar||at?.name||''} فاز بالمباراة</div>`;
    else winnerHtml=`<div class="draw-banner">🤝 انتهت المباراة بالتعادل</div>`;
    document.getElementById('winnerWrap').innerHTML=winnerHtml;
  }

  if(m.player_of_match_id){
    const {data:p}=await sb.from('players').select('name,full_name_ar,number,jersey_photo_url,team_id').eq('id',m.player_of_match_id).single();
    if(p){
      const tm=p.team_id===m.home_team_id?ht:at;
      document.getElementById('motmWrap').innerHTML=`<div class="motm"><div class="motm-ic">⭐</div><div><div class="motm-lbl">رجل المباراة</div><div style="margin-top:6px">${pchip(p.full_name_ar||p.name,p.jersey_photo_url,p.number,tm?.name_ar||tm?.name||'','motm',tm?.primary_color)}</div></div></div>`;
    }
  }

  loadEvents(m,ht,at);
  loadVarLog(m,ht,at);
  loadLineups(m,ht,at,hColor,aColor);
}

// ===== مكوّن بطاقة اللاعب الموحّد =====
function relLuminance(hex){
  if(!hex)return 0;
  const c=hex.replace('#','');
  const r=parseInt(c.substring(0,2),16)/255, g=parseInt(c.substring(2,4),16)/255, b=parseInt(c.substring(4,6),16)/255;
  const f=v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);
  return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);
}
function contrastRatio(hex1,hex2){
  const l1=relLuminance(hex1)+0.05, l2=relLuminance(hex2)+0.05;
  return l1>l2?l1/l2:l2/l1;
}
function safeTextColor(candidate,bgHex,fallbackDark,fallbackLight){
  fallbackDark=fallbackDark||'#2C2C2A';fallbackLight=fallbackLight||'#FFFFFF';
  if(candidate&&contrastRatio(candidate,bgHex)>=3)return candidate;
  return relLuminance(bgHex)>0.5?fallbackDark:fallbackLight;
}
window.safeTextColor=safeTextColor;window.contrastRatio=contrastRatio;

function genAvatarSvg(primary,secondary,number){
  const p=primary||'#9C9A8D',s=secondary||'#79786A';
  const numColor=safeTextColor(p,'#ffffff');
  return `<svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block">
    <circle cx="50" cy="50" r="50" fill="${p}"/>
    <circle cx="50" cy="36" r="15" fill="${s}" opacity="0.85"/>
    <path d="M18 92 Q50 58 82 92 Z" fill="${s}" opacity="0.85"/>
    <circle cx="50" cy="67" r="21" fill="#ffffff"/>
    <text x="50" y="76" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" fill="${numColor}" text-anchor="middle">${number??''}</text>
  </svg>`;
}
window.genAvatarSvg=genAvatarSvg;

function pchip(name,photo,number,role,variant='',color){
  const ini=(name||'؟').trim().split(' ').map(w=>w[0]).slice(0,2).join('');
  const sn=(name||'—').split(' ').slice(0,2).join(' ');
  const fallback=color?genAvatarSvg(color,null,number):`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#EDEAE0;color:#9C9A8D;font-weight:800">${number??ini}</div>`;
  return `<span class="pchip ${variant}">
    ${photo?`<img class="pchip-photo" src="${photo}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:''}
    <span class="pchip-av" style="${photo?'display:none':'overflow:hidden'}">${fallback}</span>
    ${number?`<span class="pchip-num">#${number}</span>`:''}
    <span class="pchip-name">${sn}</span>
    ${role?`<span class="pchip-role">${role}</span>`:''}
  </span>`;
}
window.pchip=pchip;

async function loadVarLog(m,ht,at){
  const {data}=await sb.from('match_var_events').select('*').eq('match_id',m.id).order('created_at');
  const wrap=document.getElementById('varLogDisplay');
  if(!data||!data.length){wrap.innerHTML='';return;}
  const typeMap={penalty:'ضربة جزاء',goal:'هدف',red_card:'بطاقة حمراء',other:'أخرى'};
  const resStyle={awarded:['✅ تم احتسابه','rgba(63,185,80,.15)','#2d6a4f'],cancelled:['❌ أُلغي','rgba(248,81,73,.15)','#a3364c'],confirmed:['☑️ تأكيد قرار الحكم','rgba(88,166,255,.15)','#1d4e89']};
  const hCount=data.filter(e=>e.team_id===m.home_team_id).length;
  const aCount=data.filter(e=>e.team_id===m.away_team_id).length;
  wrap.innerHTML=`<div class="var-log-wrap">
    <div class="var-log-title">📺 سجل مراجعات الفار — ${ht?.name_ar||ht?.name||''}: ${hCount}/2 — ${at?.name_ar||at?.name||''}: ${aCount}/2</div>
    ${data.map(e=>{
      const tn=e.team_id===m.home_team_id?(ht?.name_ar||ht?.name):(e.team_id===m.away_team_id?(at?.name_ar||at?.name):'—');
      const [label,bg,color]=resStyle[e.var_result]||['—','#eee','#666'];
      return `<div class="var-log-row">
        <span>${tn} — ${typeMap[e.var_type]}${e.minute?' ('+e.minute+"')":''}</span>
        <span class="var-log-badge" style="background:${bg};color:${color}">${label}</span>
      </div>`;
    }).join('')}
  </div>`;
}

async function loadEvents(m,ht,at){
  const {data}=await sb.from('match_events').select('*,player:players!player_id(name,full_name_ar,number,jersey_photo_url,is_goalkeeper)').eq('match_id',m.id).order('minute');
  const wrap=document.getElementById('eventsWrap');
  if(!data||!data.length){wrap.innerHTML='<div class="empty"><span>⚡</span><p>لا توجد أحداث مسجلة بعد</p></div>';return;}
  const variantMap={goal:'goal',yellow_card:'yellow',red_card:'red'};
  wrap.innerHTML=data.map(e=>{
    const side=e.team_id===m.home_team_id?'home':'away';
    const tColor=side==='home'?ht?.primary_color:at?.primary_color;
    const name=e.manual_player_name||e.player?.full_name_ar||e.player?.name||'';
    const photo=e.player?.jersey_photo_url||null;
    const num=e.player?.number||null;
    const role=e.player?.is_goalkeeper?'حارس':null;
    const v=variantMap[e.event_type]||'';
    return `<div class="evt-row ${side==='away'?'away-side':''}" style="${side==='away'?`border-left-color:${tColor||'transparent'}`:`border-right-color:${tColor||'transparent'}`}">
      <span class="evt-min">${e.minute||0}'</span>
      <span class="evt-ic">${EI[e.event_type]||'📌'}</span>
      <div style="flex:1">${name?pchip(name,photo,num,role,v,tColor):''} <span style="color:#9C9A8D;font-size:12px">${EL[e.event_type]||e.event_type}</span></div>
    </div>`;
  }).join('');
  wrap.innerHTML=`<div class="evt-legend" style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#79786A;padding:0 10px 8px;border-bottom:1px solid #EDEAE0;margin-bottom:4px">
    <span style="color:${safeTextColor(ht?.primary_color,'#F5F3EE')}">${ht?.name_ar||ht?.name||''} ▶</span>
    <span style="color:${safeTextColor(at?.primary_color,'#F5F3EE')}">◀ ${at?.name_ar||at?.name||''}</span>
  </div>`+wrap.innerHTML;
}

async function loadLineups(m,ht,at,hColor,aColor){
  const {data}=await sb.from('match_lineups').select('*,player:players(name,full_name_ar,number,jersey_photo_url,is_injured,injury_note,is_goalkeeper)').eq('match_id',m.id);
  const wrap=document.getElementById('lineupsWrap');

  const fetchStaff=async(tid)=>{const {data:t}=await sb.from('teams').select('submitted_by_name,admin_photo_url,coach_name,coach_photo_url').eq('id',tid).single();return t||{};}
  const [hSt,aSt]=await Promise.all([fetchStaff(m.home_team_id),fetchStaff(m.away_team_id)]);

  const ini=n=>(n||'؟').trim().split(' ').map(w=>w[0]).slice(0,2).join('');
  const staffRow=(st,color)=>{
    const persons=[];
    if(st.submitted_by_name||st.admin_photo_url)persons.push([st.admin_photo_url,st.submitted_by_name,'مدير الفريق']);
    if(st.coach_name||st.coach_photo_url)persons.push([st.coach_photo_url,st.coach_name,'المدرب']);
    if(!persons.length)return '';
    const card=([photo,name,role])=>`<div class="staff-card" style="border-color:${color}44">
      ${photo?`<img class="staff-photo" src="${photo}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:''}
      <div class="staff-initials" style="border-color:${color};color:${safeTextColor(color,'#F5F3EE')}${photo?';display:none':''}">${ini(name||role)}</div>
      <div class="staff-info"><div class="staff-role" style="color:${safeTextColor(color,'#F5F3EE')}">${role}</div><div class="staff-name">${name||'—'}</div></div>
    </div>`;
    return `<div class="staff-row">${persons.map(card).join('')}</div>`;
  };

  const plCard=(p,isSub=false,color)=>{
    const name=p.full_name_ar||p.name||'—';
    const sn=name.split(' ').slice(0,2).join(' ');
    const photo=p.jersey_photo_url;
    return `<div class="pl-card${isSub?' pl-sub':''}">
      <div class="pl-num">${p.number??''}</div>
      <div class="pl-photo-wrap">
        ${photo?`<img class="pl-photo" src="${photo}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:''}
        <div class="pl-initials" style="${photo?'display:none':'display:flex'};overflow:hidden;padding:0;border-width:0">${photo?ini(name):genAvatarSvg(color,null,p.number)}</div>
      </div>
      <div class="pl-name">${sn}</div>
      ${p.is_goalkeeper?'<div class="pl-badge">حارس</div>':''}
      ${isSub?'<div class="pl-badge sub">بديل</div>':''}
      ${p.is_injured?'<div class="pl-badge injury">🩹</div>':''}
    </div>`;
  };

  const teamBlock=(players,team,color,staff,isLineup=false)=>`<div class="team-section">
    <div class="team-hd" style="border-right:4px solid ${color};padding-right:10px;margin-bottom:12px">
      <span class="lu-dot" style="background:${color}"></span>${team}
      <span style="font-size:11px;color:#9C9A8D;margin-right:6px">(${players.length} لاعب)</span>
    </div>
    ${staffRow(staff,color)}
    <div class="pl-grid">${players.map(p=>plCard(isLineup?p.player||p:p,p.is_starting===false,color)).join('')}</div>
  </div>`;

  if(!data||!data.length){
    const fp=async(tid)=>{const {data:p}=await sb.from('players').select('id,name,full_name_ar,number,jersey_photo_url,is_goalkeeper,is_injured').eq('team_id',tid).order('is_goalkeeper',{ascending:false}).order('number');return p||[];};
    const [hp,ap]=await Promise.all([fp(m.home_team_id),fp(m.away_team_id)]);
    if(!hp.length&&!ap.length&&!hSt.submitted_by_name&&!aSt.submitted_by_name){wrap.innerHTML='<div class="empty"><span>👥</span><p>لم تُسجَّل بيانات الفريقين بعد</p></div>';return;}
    wrap.innerHTML=`<div style="font-size:11px;text-align:center;color:#9C9A8D;padding:8px 0 4px">قائمة لاعبي الفريقين</div>
      ${teamBlock(hp,ht?.name_ar||ht?.name||'',hColor,hSt)}
      <div style="height:1px;background:#EDEAE0;margin:16px 0"></div>
      ${teamBlock(ap,at?.name_ar||at?.name||'',aColor,aSt)}`;
    return;
  }
  const hAll=data.filter(x=>x.team_id===m.home_team_id);
  const aAll=data.filter(x=>x.team_id===m.away_team_id);
  wrap.innerHTML=`${teamBlock(hAll,ht?.name_ar||ht?.name||'',hColor,hSt,true)}
    <div style="height:1px;background:#EDEAE0;margin:16px 0"></div>
    ${teamBlock(aAll,at?.name_ar||at?.name||'',aColor,aSt,true)}`;
}
init();
sb.channel('match-live-'+MID)
  .on('postgres_changes',{event:'*',schema:'public',table:'matches',filter:'id=eq.'+MID},()=>init())
  .on('postgres_changes',{event:'*',schema:'public',table:'match_events',filter:'match_id=eq.'+MID},()=>init())
  .subscribe();
// شبكة أمان احتياطية لو تعطّل الاتصال اللحظي لأي سبب
setInterval(()=>{ if(MID) init(); }, 30000);
</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js')
    .then(reg=>{
      // تحقق من تحديثات فورياً
      reg.update();
      // إن وجد service worker جديد، فعّله وأعد التحميل
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            // إعادة تحميل تلقائية لتطبيق التحديث
            window.location.reload();
          }
        });
      });
    });
  // استمع لرسائل التحديث
  navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
}
</script>
