<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1e35"><title>تقرير المباراة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="public-navigation.css?v=20260911-1"><link rel="stylesheet" href="tournament-theme.css?v=20260910-2">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#1f2a3a;font-family:"Tajawal",sans-serif}.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:#0d1e35;display:flex;gap:9px;align-items:center;box-shadow:0 5px 18px rgba(0,0,0,.25)}.top strong{color:#fff;flex:1}.top a,.top button{min-height:42px;border-radius:11px;border:1px solid #52637a;background:linear-gradient(#2a405d,#17283e);color:#fff;font-family:inherit;font-weight:800;padding:8px 13px;text-decoration:none;box-shadow:0 3px 0 #06101c;cursor:pointer}.sheet{max-width:820px;margin:18px auto 50px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 15px 40px rgba(25,42,65,.14)}.hero{background:linear-gradient(145deg,#0d2a49,#071526);color:#fff;padding:24px 16px;text-align:center}.hero small{color:#9eb2c9}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:18px}.team{font-size:17px;font-weight:900}.badge{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;background:#fff;color:#17314d;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;border:4px solid #c9a84c}.score{font-size:38px;font-weight:900;color:#f1d16b;white-space:nowrap}.status{display:inline-flex;margin-top:14px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px}.body{padding:18px}.summary{font-size:15px;font-weight:700;line-height:1.9;background:#f5f7fa;border-right:4px solid #c9a84c;border-radius:12px;padding:13px 15px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{border:1px solid #dfe5ec;border-radius:15px;padding:14px}.panel h2{font-size:15px;margin:0 0 11px;color:#17314d}.event{display:grid;grid-template-columns:44px 26px 1fr;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f4;font-size:13px}.event:last-child{border:0}.minute{font-weight:900;color:#355879}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.meta div{background:#f6f8fa;border-radius:10px;padding:9px}.meta small{display:block;color:#7d8794;font-size:10px}.meta b{font-size:12px}.empty{text-align:center;padding:70px 15px;color:#7d8794}.star{background:linear-gradient(135deg,#fff5ce,#f4e1a0);border-color:#d7bb58}.star-name{font-size:18px;font-weight:900;color:#6f5516}.footer{text-align:center;color:#8a94a1;font-size:10px;padding:16px;border-top:1px solid #edf0f4}
@media(max-width:620px){.top strong{font-size:13px}.top button{display:none}.sheet{margin:9px 7px 34px;border-radius:15px}.hero{padding:18px 9px}.team{font-size:13px}.badge{width:52px;height:52px}.score{font-size:28px}.body{padding:11px}.grid{grid-template-columns:1fr}.summary{font-size:13px}.panel{padding:11px}}@media print{.top{display:none}.sheet{box-shadow:none;margin:0;max-width:none}.body{padding:16px}body{background:#fff}}
</style></head>
<body><nav class="top"><strong>📊 تقرير المباراة الآلي</strong><a id="backLink" href="index.html">← رجوع</a><button onclick="window.print()">تنزيل / طباعة</button></nav><main id="app"><div class="empty">⏳ جاري إنشاء التقرير من بيانات المباراة...</div></main>
<script src="vendor/supabase.min.js?v=20260910-1"></script><script src="supabase-config.js"></script><script src="tournament-scope.js?v=20260910-3"></script><script src="public-navigation.js?v=20260911-1"></script><script src="public-date.js?v=20260910-1"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),qs=new URLSearchParams(location.search),MID=qs.get('id'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const eventLabels={goal:'هدف',own_goal:'هدف عكسي',yellow_card:'بطاقة صفراء',red_card:'بطاقة حمراء',substitution:'تبديل',penalty_missed:'ركلة جزاء ضائعة',var_goal_confirmed:'تأكيد هدف عبر VAR',var_goal_disallowed:'إلغاء هدف عبر VAR',var_penalty_review:'مراجعة ركلة جزاء عبر VAR',var_red_card_review:'مراجعة بطاقة حمراء عبر VAR'},eventIcons={goal:'⚽',own_goal:'↩️',yellow_card:'🟨',red_card:'🟥',substitution:'🔄',penalty_missed:'❌',var_goal_confirmed:'✅',var_goal_disallowed:'📺',var_penalty_review:'📺',var_red_card_review:'📺'};
async function load(){if(!MID){$('app').innerHTML='<div class="empty">لم تُحدَّد مباراة</div>';return;}const {data:m,error}=await sb.from('matches').select('*,ht:teams!matches_home_team_id_fkey(id,name,name_ar,logo_url,primary_color),at:teams!matches_away_team_id_fkey(id,name,name_ar,logo_url,primary_color)').eq('id',MID).single();if(error||!m){$('app').innerHTML='<div class="empty">تعذر تحميل المباراة</div>';return;}const [{data:events},{data:star}]=await Promise.all([sb.from('match_events').select('*,player:players(name,full_name_ar,number)').eq('match_id',MID).order('minute').order('created_at'),m.player_of_match_id?sb.from('players').select('id,name,full_name_ar,number').eq('id',m.player_of_match_id).maybeSingle():Promise.resolve({data:null})]);m.star=star||null;const hn=m.ht?.name_ar||m.ht?.name||'الفريق الأول',an=m.at?.name_ar||m.at?.name||'الفريق الثاني',hs=m.home_score??0,as=m.away_score??0,winner=hs>as?hn:as>hs?an:null,scope=u=>window.TournamentScope?.scopedUrl(u)||u,back=scope('tournament.html?id='+m.tournament_id);$('backLink').href=back;window.PublicNavigation?.configureBack($('backLink'),back,'البطولة');
const logo=(t,n)=>t?.logo_url?`<img src="${esc(t.logo_url)}" alt="" style="width:100%;height:100%;object-fit:contain;border-radius:50%">`:esc(n.trim().slice(0,2)),summary=`انتهت مباراة ${hn} و${an} بنتيجة ${hs}–${as}${winner?`، وفاز ${winner}`:' بالتعادل'}. أُنشئ هذا التقرير تلقائيًا من سجل المباراة المعتمد في المنصة.`;const rows=(events||[]).map(e=>`<div class="event"><span class="minute">${e.minute??0}'</span><span>${eventIcons[e.event_type]||'•'}</span><span><b>${esc(eventLabels[e.event_type]||e.event_type)}</b>${e.player?` — ${esc(e.player.full_name_ar||e.player.name)}`:''}</span></div>`).join('');
$('app').innerHTML=`<article class="sheet"><section class="hero"><small>${m.match_date?window.PublicDate.format(m.match_date,{weekday:true,year:true}):'تقرير المباراة'} ${m.match_no?'— المباراة '+m.match_no:''}</small><div class="teams"><div class="team"><div class="badge">${logo(m.ht,hn)}</div>${esc(hn)}</div><div class="score">${hs} – ${as}</div><div class="team"><div class="badge">${logo(m.at,an)}</div>${esc(an)}</div></div><span class="status">${m.status==='completed'?'انتهت المباراة':m.status==='live'?'مباشر':'مجدولة'}</span></section><section class="body"><div class="summary">${esc(summary)}</div><div class="grid"><section class="panel"><h2>⏱️ التسلسل الزمني</h2>${rows||'<div class="empty" style="padding:18px">لا توجد أحداث مسجلة</div>'}</section><div><section class="panel ${m.star?'star':''}"><h2>⭐ نجم المباراة</h2><div class="star-name">${m.star?esc(m.star.full_name_ar||m.star.name):'لم يُحدَّد بعد'}</div></section><section class="panel" style="margin-top:12px"><h2>ℹ️ معلومات المباراة</h2><div class="meta"><div><small>الدور</small><b>${esc(m.round_name||'—')}</b></div><div><small>الملعب</small><b>${esc(m.venue_name||m.venue||'—')}</b></div><div><small>الحكم</small><b>${esc(m.referee_1||'—')}</b></div><div><small>المعلق</small><b>${esc(m.commentator||'—')}</b></div><div><small>البطاقات</small><b>${(events||[]).filter(e=>e.event_type==='yellow_card').length} صفراء، ${(events||[]).filter(e=>e.event_type==='red_card').length} حمراء</b></div><div><small>مراجعات VAR</small><b>${(events||[]).filter(e=>String(e.event_type).startsWith('var_')).length}</b></div></div></section></div></div></section><footer class="footer">تقرير آلي من منصة البطولات — البيانات مأخوذة من سجل المباراة</footer></article>`;document.title=`تقرير ${hn} × ${an}`;}
load();
</script></body></html>
