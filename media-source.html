const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),q=new URLSearchParams(location.search),ID=q.get('id'),TID=q.get('tid'),$=id=>document.getElementById(id);function safeUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(_){return''}}function backUrl(){return window.TournamentScope?.scopedUrl('tournament.html?id='+TID)||'tournament.html?id='+TID}async function load(){const back=backUrl();$('backLink').href=back;window.PublicNavigation?.configureBack($('backLink'),back,'البطولة');if(!ID||!TID){$('frame').innerHTML='<div class="state error">لم تُحدَّد التغطية المطلوبة</div>';return}const {data,error}=await sb.from('feed_posts').select('title,link_url,source_name,source_type').eq('id',ID).eq('tournament_id',TID).single();const url=safeUrl(data?.link_url);if(error||!url){$('frame').innerHTML='<div class="state error">تعذر فتح رابط التغطية</div>';return}$('headline').textContent=data.title||'التغطية الإعلامية';$('source').textContent=data.source_name||'مصدر خارجي';$('external').href=url;$('frame').innerHTML=`<iframe src="${url.replace(/["<>]/g,'')}" title="التغطية الإعلامية" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`;document.title=data.title||'التغطية الإعلامية'}load();
