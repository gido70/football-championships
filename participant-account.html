<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حساب المشارك</title><link rel="stylesheet" href="public-ui.css">
<style>body{background:#eef5fb;color:#102943;font-family:Tajawal,Arial,sans-serif}.wrap{max-width:540px;margin:auto;padding:28px 16px}.box{background:#fff;border:1px solid #dce6ef;border-radius:24px;padding:24px;box-shadow:0 15px 40px #1232}.brand{text-align:center;font-size:34px}.muted{color:#63788c;line-height:1.8}.field{margin:15px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #cbd8e4;border-radius:13px;font:inherit}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#0b4b82;color:#fff;font:900 16px Tajawal;cursor:pointer}.code{font:900 38px monospace;letter-spacing:7px;color:#9a6d08;text-align:center}.hide{display:none}.status{min-height:24px;margin-top:12px;text-align:center}</style>
</head><body><main class="wrap"><section class="box">
<div class="brand">🏆</div><h1>حساب المشارك</h1>
<p class="muted">تسجيل مجاني للمشاركة في الترشيحات. اكتب الاسم الأول واسم العائلة باللغة العربية. رقم الهاتف محفوظ للإدارة فقط للتواصل مع الفائز، ولا يظهر للجمهور.</p>
<form id="profileForm"><div class="field"><label for="firstName">الاسم الأول بالعربية</label><input id="firstName" maxlength="50" required autocomplete="given-name" lang="ar" inputmode="text" pattern="[ء-يـ\\s'-]{2,50}"></div><div class="field"><label for="familyName">اسم العائلة بالعربية</label><input id="familyName" maxlength="50" required autocomplete="family-name" lang="ar" inputmode="text" pattern="[ء-يـ\\s'-]{2,50}"></div><div class="field"><label for="phone">رقم الهاتف للتواصل مع الفائز</label><input id="phone" type="tel" maxlength="20" required autocomplete="tel" inputmode="tel" placeholder="مثال: 0501234567" pattern="[+0-9٠-٩\\s()-]{7,20}"></div><button class="btn" id="saveBtn">إنشاء الحساب</button></form>
<div id="account" class="hide"><p>مرحبًا <strong id="fullName"></strong></p><p class="muted">رقم المشارك للتعريف في المسابقات:</p><div class="code" id="code"></div><p class="muted">هذا الرقم ليس كلمة مرور. حسابك محفوظ بأمان على هذا الجهاز.</p></div>
<div class="status" id="status"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{storageKey:'tournament-participant-auth'}}),form=document.getElementById('profileForm'),statusEl=document.getElementById('status');let existingProfile=null;
const accountParams=new URLSearchParams(location.search),nextTid=accountParams.get('tid');
const nextPage=accountParams.get('next')==='predictions'?'predictions.html'+(nextTid?'?tid='+encodeURIComponent(nextTid):''):'';
function show(p){form.classList.add('hide');document.getElementById('account').classList.remove('hide');document.getElementById('fullName').textContent=p.first_name+' '+p.family_name;document.getElementById('code').textContent=p.participant_code;if(nextPage){statusEl.innerHTML='<a class="btn" style="display:block;text-decoration:none" href="'+nextPage+'">متابعة إلى الترشيحات</a>'}}
async function init(){let {data:{session}}=await sb.auth.getSession();if(!session){const r=await sb.auth.signInAnonymously();if(r.error){statusEl.textContent='التسجيل غير متاح حاليًا.';return}session=r.data.session}const {data}=await sb.from('participant_profiles').select('first_name,family_name,participant_code,phone').eq('user_id',session.user.id).maybeSingle();if(data?.phone){show(data);return}if(data){existingProfile=data;document.getElementById('firstName').value=data.first_name;document.getElementById('familyName').value=data.family_name;document.getElementById('saveBtn').textContent='حفظ رقم الهاتف ومتابعة';statusEl.textContent='أكمل رقم الهاتف للتواصل إذا فزت.'}}
form.addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('saveBtn'),first=document.getElementById('firstName').value.trim(),family=document.getElementById('familyName').value.trim(),phone=document.getElementById('phone').value.trim();if(!/[ء-ي]/.test(first)||!/[ء-ي]/.test(family)){statusEl.textContent='اكتب الاسم الأول واسم العائلة باللغة العربية.';return}btn.disabled=true;statusEl.textContent='جارٍ حفظ الحساب…';let {data:{session}}=await sb.auth.getSession();if(!session){const r=await sb.auth.signInAnonymously();if(r.error){statusEl.textContent='تعذر بدء الحساب.';btn.disabled=false;return}session=r.data.session}const fields={first_name:first,family_name:family,phone};const request=existingProfile?sb.from('participant_profiles').update(fields).eq('user_id',session.user.id).select('first_name,family_name,participant_code').single():sb.from('participant_profiles').insert({user_id:session.user.id,participant_code:'000000',...fields}).select('first_name,family_name,participant_code').single();const {data,error}=await request;if(error){statusEl.textContent='تعذر حفظ الحساب. تحقق من الاسم ورقم الهاتف وحاول مرة أخرى.';btn.disabled=false;return}statusEl.textContent='تم حفظ الحساب.';show(data)});
init();
</script></body></html>
