<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071d38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مشغّل البلايستيشن">
  <title>مشغّل بطولة البلايستيشن</title>
  <link rel="manifest" href="manifest-playstation-operator.webmanifest">
  <link rel="apple-touch-icon" href="playstation-icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <script src="vendor/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="emergency-excel.js?v=20260916-1"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#06172d,#0c3763 58%,#542387);color:#fff;font-family:Tajawal,sans-serif;min-height:100vh}.hidden{display:none!important}
    .login{max-width:410px;margin:6vh auto;background:#0b2747;border:1px solid #48dfff;border-radius:24px;padding:22px;box-shadow:0 12px 35px #0008}.login-logo{display:block;width:132px;height:132px;object-fit:contain;margin:0 auto 8px}.login p{color:#c6d9e9;line-height:1.7}.login label{display:block;color:#b9d2e8;font-size:12px;margin:10px 0 5px}
    input{width:100%;min-height:48px;border-radius:13px;border:1px solid #416987;background:#071d35;color:#fff;padding:10px;font:700 16px Tajawal}.btn{border:0;border-radius:13px;padding:12px 15px;min-height:46px;color:#fff;background:linear-gradient(135deg,#764ff2,#248df4);font:900 14px Tajawal;cursor:pointer}.btn.start{background:linear-gradient(135deg,#147eb8,#26b8c8)}.btn.approve{background:linear-gradient(135deg,#0d9c62,#27c98c)}
    .top{position:sticky;top:0;z-index:4;background:#071b33f4;border-bottom:2px solid #3edfff;padding:9px 12px}.topin,.wrap{max-width:900px;margin:auto}.topin{display:flex;align-items:center;justify-content:space-between;gap:9px}.brand{display:flex;align-items:center;gap:9px}.brand img{width:48px;height:48px;object-fit:contain}.top h1{font-size:16px;margin:0}.top small{color:#9ec4df}.top-actions{display:flex;gap:6px}.logout,.install,.export{background:#ffffff17;border:1px solid #ffffff32;color:#fff;border-radius:10px;padding:8px;font:700 12px Tajawal}.install{background:#235eae}.export{background:#147d64}
    .wrap{padding:12px}.guide{background:linear-gradient(135deg,#143f69,#1f276c);border:1px solid #4fdfff;border-radius:18px;padding:13px;margin-bottom:12px}.guide b{display:block;margin-bottom:7px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.guide span{background:#071e39aa;border-radius:11px;padding:9px;text-align:center;font-size:12px;line-height:1.5}.guide em{display:block;color:#ffd75a;font-size:17px;font-style:normal}
    .state-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.state-tab{border:1px solid #4a718f;border-radius:13px;background:#0b2949;color:#c7ddeb;padding:10px 5px;font:800 13px Tajawal}.state-tab.active{color:#071d38;background:linear-gradient(135deg,#ffd75a,#ff9f43);border-color:#ffd75a}.state-tab strong{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;margin-inline-start:5px;border-radius:50%;background:#ffffff25}
    .games{display:grid;gap:11px}.day-group{border:1px solid #3987ad;border-radius:18px;background:#081f3a;overflow:hidden;box-shadow:0 8px 20px #0003}.day-group>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;padding:14px 16px;background:linear-gradient(135deg,#174d76,#373180);font-weight:900;color:#fff}.day-group>summary::-webkit-details-marker,.slot-group>summary::-webkit-details-marker{display:none}.day-group>summary:after,.slot-group>summary:after{content:'＋';display:grid;place-items:center;min-width:28px;height:28px;border-radius:50%;background:#ffffff1c;color:#64e7ed;font-size:20px}.day-group[open]>summary:after,.slot-group[open]>summary:after{content:'−'}.day-title{display:flex;align-items:center;gap:8px}.day-title small{display:block;color:#b8d8ec;font-size:11px;font-weight:700;margin-top:2px}.day-count{display:inline-flex;align-items:center;justify-content:center;min-width:31px;height:26px;border-radius:13px;background:#ffd75a;color:#17283c;font-size:12px}.day-slots{display:grid;gap:8px;padding:9px}.slot-group{border:1px solid #2c6e91;border-radius:14px;background:#071c35;overflow:hidden}.slot-group>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;list-style:none;padding:11px 13px;background:linear-gradient(135deg,#0d385c,#145d78);font-weight:900;color:#dff8ff}.slot-label{display:flex;align-items:center;gap:8px}.slot-label small{color:#9ed3e8}.slot-games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:9px}.game{background:#0a2949;border:1px solid #3b6786;border-radius:17px;padding:12px;box-shadow:0 6px 16px #0003}.game.live-now{border-color:#4adce4;box-shadow:0 0 0 1px #4adce455,0 7px 18px #0004}.game.done{border-color:#2d9d79}.meta{display:flex;justify-content:space-between;gap:8px;color:#91cff0;font-size:12px;font-weight:800;margin-bottom:9px}.time-badge{color:#2d1d00;background:#ffd75a;border-radius:9px;padding:6px 9px;white-space:nowrap;font-size:13px}.match-info{text-align:left}
    .players{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);gap:7px;align-items:stretch}.player-side{display:grid;grid-template-rows:1fr auto;gap:8px;min-width:0;background:#102f54;border-radius:14px;padding:9px 7px;direction:rtl}.player{display:flex;align-items:flex-start;justify-content:center;gap:6px;text-align:center;min-width:0}.participant-number{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:9px;background:#ffd75a;color:#17283c;font-weight:900;font-size:13px}.player b{display:block;overflow-wrap:anywhere;font-size:14px;line-height:1.45;min-height:41px}.side-score{display:grid;grid-template-columns:34px minmax(42px,54px) 34px;justify-content:center;align-items:center;gap:4px;direction:ltr}.side-score input{width:100%;min-height:44px;text-align:center;font-size:22px;padding:4px}.step{width:34px;height:34px;border:0;border-radius:50%;background:#315e88;color:#fff;font-size:21px}.versus{display:grid;place-items:center;color:#8edfed;font-weight:900;font-size:20px}.actions{display:flex;gap:8px;justify-content:center;margin-top:10px}.actions .btn{flex:1}
    .sync{min-height:20px;margin-top:7px;text-align:center;color:#91cff0;font-size:12px;font-weight:700}.sync.saving{color:#ffd75a}.sync.ok{color:#56e5a5}.sync.error{color:#ff8499}.msg{min-height:22px;margin-top:8px;font-size:13px}.empty{text-align:center;padding:30px;color:#bdd3e7;background:#0a2443;border-radius:17px;grid-column:1/-1}
    @media(max-width:680px){.slot-games{grid-template-columns:1fr;padding:7px}.day-group>summary{padding:13px 12px}.steps{grid-template-columns:1fr 1fr}.top h1{font-size:14px}.brand img{width:42px;height:42px}.player b{font-size:13px}.install{font-size:0}.install:after{content:'تثبيت';font-size:12px}}@media(max-width:390px){.wrap{padding:7px}.day-slots{padding:6px}.slot-games{padding:6px}.game{padding:8px}.players{grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr);gap:4px}.player-side{padding:8px 4px}.player{gap:4px}.participant-number{flex-basis:27px;height:27px}.side-score{grid-template-columns:31px minmax(39px,48px) 31px;gap:3px}.step{width:31px;height:31px}.side-score input{min-height:41px}}
  </style>
</head>
<body>
  <section id="login" class="login hidden">
    <img class="login-logo" src="playstation-icon-192.png" alt="شعار بطولة البلايستيشن">
    <h1>دخول مشغّل الصالة</h1>
    <p>صفحة مستقلة لتسجيل النتائج فقط. خلال التجربة يعمل حسابك نفسه على الهاتف والتطبيق والكمبيوتر.</p>
    <label>اسم المستخدم</label><input id="username" autocomplete="username">
    <label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn" class="btn" style="width:100%;margin-top:14px">دخول إلى المباريات</button>
    <div id="loginMsg" class="msg"></div>
  </section>
  <div id="app" class="hidden">
    <header class="top"><div class="topin">
      <div class="brand"><img src="playstation-icon-192.png" alt=""><div><h1>مشغّل بطولة البلايستيشن</h1><small id="who"></small></div></div>
      <div class="top-actions"><button id="emergencyDownload" class="export">⬇️ Excel</button><button id="install" class="install">📲 تثبيت كتطبيق</button><button id="logout" class="logout">خروج</button></div>
    </div></header>
    <main class="wrap">
      <section class="guide"><b>الجدول والأسماء جاهزة — سجّل النتيجة فقط</b><div class="steps"><span><em>1</em>اختر المباراة حسب وقتها</span><span><em>2</em>اضغط «ابدأ المباراة»</span><span><em>3</em>سجّل كل هدف بـ + و −</span><span><em>4</em>اضغط «إنهاء واعتماد»</span></div></section>
      <nav id="stateTabs" class="state-tabs"></nav>
      <div id="games" class="games"></div>
    </main>
  </div>
  <script>
    const TID='c983ee0c-4434-470d-b0a2-6e6efe1ad650',key='ps-device-'+TID;
    let token=localStorage.getItem(key);if(!token){token=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem(key,token)}
    const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{global:{headers:{'x-ps-device':token}},auth:{storageKey:'playstation-operator-auth'}});
    const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let comp,people=[],matches=[],activeState='live',installPrompt=null;const syncTimers=new Map();
    function message(t,ok=false){$('loginMsg').textContent=t;$('loginMsg').style.color=ok?'#57dda0':'#ff8499'}
    function person(id){return people.find(p=>p.id===id)}
    function showLogin(t=''){$('login').classList.remove('hidden');$('app').classList.add('hidden');if(t)message(t)}
    function setSync(id,text,state=''){const el=$('sync_'+id);if(el){el.textContent=text;el.className='sync '+state}}
    function displayTime(value){if(!value)return 'لم ينشئ النظام الموعد بعد';return new Intl.DateTimeFormat('ar-AE',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}).format(new Date(value))}
    function dateKey(value){if(!value)return 'unscheduled';const d=new Date(value);if(Number.isNaN(d.getTime()))return 'unscheduled';return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
    function todayKey(){return dateKey(new Date())}
    function dateLabel(value){if(!value)return 'موعد غير محدد';return new Intl.DateTimeFormat('ar-AE',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(value))}
    function slotKey(value){if(!value)return 'unscheduled';const d=new Date(value);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
    function slotLabel(value){if(!value)return 'دون توقيت';return new Intl.DateTimeFormat('ar-AE',{hour:'numeric',minute:'2-digit'}).format(new Date(value))}
    async function authorize(){
      const {data:{session}}=await sb.auth.getSession();if(!session)return showLogin();
      const {data:a}=await sb.from('playstation_admins').select('display_name,role,allow_multiple_devices').eq('tournament_id',TID).eq('user_id',session.user.id).eq('role','operator').eq('is_active',true).maybeSingle();
      if(!a){await sb.auth.signOut();return showLogin('هذا الحساب ليس حساب مشغّل الصالة')}
      const {data:claimed,error}=await sb.rpc('claim_playstation_operator_device',{p_tournament_id:TID,p_device_token:token});
      if(error||!claimed){await sb.auth.signOut();return showLogin('هذا الحساب مرتبط بجهاز آخر. استخدم حساب التجربة متعدد الأجهزة أو اطلب إعادة التهيئة.')}
      $('who').textContent=a.display_name+(a.allow_multiple_devices?' · يعمل على أجهزتك التجريبية':' · جهاز دخول معتمد');
      $('login').classList.add('hidden');$('app').classList.remove('hidden');await load();
    }
    $('loginBtn').onclick=async()=>{message('جاري التحقق...',true);const u=$('username').value.trim().toLowerCase(),email=u.includes('@')?u:u+'@ps.mansour.app';const {error}=await sb.auth.signInWithPassword({email,password:$('password').value});if(error)return message('اسم المستخدم أو كلمة المرور غير صحيحة');authorize()};
    $('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
    $('emergencyDownload').onclick=async()=>{const b=$('emergencyDownload'),old=b.textContent;b.disabled=true;b.textContent='⏳';try{const file=await window.EmergencyExcel.exportPlaystation(sb,TID);alert('تم تنزيل نسخة الطوارئ:\n'+file.filename)}catch(error){alert('لم تتغير أي نتيجة. تعذر إنشاء الملف:\n'+error.message)}finally{b.disabled=false;b.textContent=old}};
    async function load(){
      const {data:c,error}=await sb.from('playstation_competitions').select('*').eq('tournament_id',TID).single();if(error)return $('games').innerHTML='<div class="empty">تعذر تحميل البطولة</div>';comp=c;
      const [{data:p},{data:m}]=await Promise.all([
        sb.from('playstation_participants').select('id,name,participant_no,group_code').eq('competition_id',c.id),
        sb.from('playstation_matches').select('*').eq('competition_id',c.id).order('scheduled_at',{nullsFirst:false}).order('match_order')
      ]);
      people=p||[];matches=m||[];
      if(!matches.some(m=>m.status===activeState))activeState=matches.some(m=>m.status==='live')?'live':matches.some(m=>m.status==='scheduled')?'scheduled':'completed';
      render();
    }
    function renderTabs(){const states=[['live','🟢 مباشر الآن'],['scheduled','⏳ لم تبدأ'],['completed','✅ منتهية']];$('stateTabs').innerHTML=states.map(([state,label])=>`<button class="state-tab ${activeState===state?'active':''}" onclick="chooseState('${state}')">${label}<strong>${matches.filter(m=>m.status===state).length}</strong></button>`).join('')}
    function playerSide(p,m,side){return `<div class="player-side"><div class="player"><span class="participant-number">${p?.participant_no||'—'}</span><b>${esc(p?.name||'بانتظار المشارك')}</b></div><div class="side-score"><button class="step" aria-label="إنقاص نتيجة ${esc(p?.name||'المشارك')}" onclick="step('${m.id}',${side},-1)">−</button><input id="s${side}_${m.id}" aria-label="نتيجة ${esc(p?.name||'المشارك')}" type="number" min="0" value="${side===1?(m.score1??0):(m.score2??0)}" onchange="scoreChanged('${m.id}')"><button class="step" aria-label="زيادة نتيجة ${esc(p?.name||'المشارك')}" onclick="step('${m.id}',${side},1)">+</button></div></div>`}
    function matchCard(m){const a=person(m.player1_id),b=person(m.player2_id),done=m.status==='completed',live=m.status==='live';return `<article class="game ${done?'done':''} ${live?'live-now':''}"><div class="meta"><span class="time-badge">⏰ ${slotLabel(m.scheduled_at)}</span><span class="match-info">${m.group_code?'المجموعة '+esc(m.group_code):'الأدوار النهائية'}${m.round_no?' · الجولة '+m.round_no:''}<br>${done?'✅ منتهية ومعتمدة':live?'🟢 تظهر الآن للجمهور':'⏳ جاهزة للبدء'}</span></div><div class="players">${playerSide(a,m,1)}<div class="versus">—</div>${playerSide(b,m,2)}</div><div id="sync_${m.id}" class="sync">${live?'🟢 بدأ النظام التوقيت الفعلي وينشر كل هدف للأهالي':done?'يمكن تصحيح النتيجة ثم حفظها':'أنشأ النظام الأسماء والموعد من الجدول'}</div><div class="actions">${m.status==='scheduled'?`<button class="btn start" onclick="save('${m.id}','live')">▶️ ابدأ المباراة الآن</button>`:live?`<button class="btn approve" onclick="save('${m.id}','completed')">✅ إنهاء واعتماد</button>`:`<button class="btn approve" onclick="save('${m.id}','completed')">✏️ حفظ التصحيح</button>`}</div></article>`}
    function render(){
      renderTabs();const list=matches.filter(m=>m.status===activeState);
      if(!list.length){$('games').innerHTML='<div class="empty">لا توجد مباريات في هذا القسم.</div>';return}
      const groups=new Map();list.forEach(m=>{const key=dateKey(m.scheduled_at);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(m)});
      $('games').innerHTML=[...groups].map(([key,dayMatches])=>{const first=dayMatches.find(m=>m.scheduled_at),isToday=key===todayKey(),open=isToday||key==='unscheduled'||dayMatches.some(m=>m.status==='live'),slots=new Map();dayMatches.forEach(m=>{const slot=slotKey(m.scheduled_at);if(!slots.has(slot))slots.set(slot,[]);slots.get(slot).push(m)});const title=key==='unscheduled'?'مباريات بلا موعد':isToday?'مباريات اليوم':'مباريات '+dateLabel(first?.scheduled_at),subtitle=key==='unscheduled'?'بانتظار أن ينشئ النظام مواعيدها':isToday?dateLabel(first?.scheduled_at):'اضغط لعرض مباريات هذا اليوم',slotHtml=[...slots].map(([_slot,slotMatches])=>{const slotOpen=slotMatches.some(m=>m.status==='live'),slotTime=slotMatches.find(m=>m.scheduled_at)?.scheduled_at;return `<details class="slot-group" ${slotOpen?'open':''}><summary><span class="slot-label">⏰ ${slotLabel(slotTime)} <small>${slotMatches.length} مباريات</small></span><strong class="day-count">${slotMatches.length}</strong></summary><div class="slot-games">${slotMatches.map(matchCard).join('')}</div></details>`}).join('');return `<details class="day-group" ${open?'open':''}><summary><span class="day-title"><span>📅</span><span>${title}<small>${subtitle}</small></span></span><strong class="day-count">${dayMatches.length}</strong></summary><div class="day-slots">${slotHtml}</div></details>`}).join('');
    }
    window.chooseState=state=>{activeState=state;render()};
    window.step=(id,side,delta)=>{const x=$('s'+side+'_'+id);x.value=Math.max(0,(+x.value||0)+delta);window.scoreChanged(id)};
    window.scoreChanged=id=>{const match=matches.find(m=>m.id===id);if(match?.status!=='live')return;setSync(id,'جارٍ نشر النتيجة...','saving');clearTimeout(syncTimers.get(id));syncTimers.set(id,setTimeout(()=>persistLiveScore(id),220))};
    async function persistLiveScore(id){
      syncTimers.delete(id);const score1=Math.max(0,+$('s1_'+id).value||0),score2=Math.max(0,+$('s2_'+id).value||0);
      const {data,error}=await sb.from('playstation_matches').update({score1,score2,updated_at:new Date().toISOString()}).eq('id',id).eq('status','live').select('id').maybeSingle();
      if(error||!data){setSync(id,error?.message||'تعذر النشر — حاول مرة أخرى','error');return}
      const match=matches.find(m=>m.id===id);if(match){match.score1=score1;match.score2=score2}setSync(id,'✅ تم نشر النتيجة مباشرة للأهالي','ok');
    }
    window.save=async(id,status)=>{
      clearTimeout(syncTimers.get(id));syncTimers.delete(id);setSync(id,status==='live'?'جارٍ بدء المباراة...':'جارٍ اعتماد النتيجة...','saving');
      const old=matches.find(m=>m.id===id),patch={status,score1:Math.max(0,+$('s1_'+id).value||0),score2:Math.max(0,+$('s2_'+id).value||0),updated_at:new Date().toISOString()};
      if(status==='live'&&!old?.started_at)patch.started_at=new Date().toISOString();if(status==='completed')patch.completed_at=new Date().toISOString();
      const {error}=await sb.from('playstation_matches').update(patch).eq('id',id);if(error){setSync(id,error.message.includes('row-level')?'هذا الحساب غير مخوّل بالحفظ':error.message,'error');return}
      activeState=status==='live'?'live':'completed';await load();
    };
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
    $('install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);alert(ios?'في Safari اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».':'من قائمة المتصفح اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».')};
    if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('install').classList.add('hidden');
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
    authorize();
  </script>
</body>
</html>
