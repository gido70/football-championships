<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d38"><title>تشغيل مباريات البلايستيشن</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet"><script src="vendor/supabase.min.js"></script><script src="supabase-config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#06172d,#0c3763 60%,#542387);color:#fff;font-family:Tajawal,sans-serif;min-height:100vh}.hidden{display:none!important}.login{max-width:400px;margin:8vh auto;background:#0b2747;border:1px solid #48dfff;border-radius:24px;padding:22px;box-shadow:0 12px 35px #0008}.logo{text-align:center;font-size:54px}input,select{width:100%;min-height:48px;border-radius:13px;border:1px solid #416987;background:#071d35;color:#fff;padding:10px;font:700 16px Tajawal}.login label,.filter label{display:block;color:#b9d2e8;font-size:12px;margin:10px 0 5px}.btn{border:0;border-radius:13px;padding:12px 15px;min-height:46px;color:#fff;background:linear-gradient(135deg,#764ff2,#248df4);font:900 14px Tajawal;cursor:pointer}.btn.live{background:linear-gradient(135deg,#d3194b,#ff694d)}.btn.approve{background:linear-gradient(135deg,#0d9c62,#27c98c)}.top{position:sticky;top:0;z-index:4;background:#071b33ee;border-bottom:2px solid #3edfff;padding:12px}.topin,.wrap{max-width:850px;margin:auto}.topin{display:flex;align-items:center;justify-content:space-between;gap:10px}.top h1{font-size:17px;margin:0}.top small{color:#9ec4df}.logout{background:#ffffff17;border:1px solid #ffffff32;color:#fff;border-radius:10px;padding:8px}.wrap{padding:12px}.notice{background:#123c62;border:1px solid #3edfff;border-radius:15px;padding:11px;margin-bottom:12px;font-size:13px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.games{display:grid;gap:12px}.game{background:#0a2443;border:2px solid #315a7c;border-radius:20px;padding:13px;box-shadow:0 8px 22px #0005}.game.live-now{border-color:#ff526d}.game.done{border-color:#2dcb8c}.meta{color:#91cff0;font-size:12px;font-weight:800;margin-bottom:10px}.players{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.player{background:#102f54;border-radius:14px;padding:10px;text-align:center;min-width:0}.player b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{display:flex;align-items:center;gap:5px}.score input{width:58px;text-align:center;font-size:23px}.step{width:38px;height:38px;border:0;border-radius:50%;background:#315e88;color:#fff;font-size:22px}.actions{display:flex;gap:8px;justify-content:center;margin-top:12px}.msg{min-height:22px;margin-top:8px;font-size:13px}.empty{text-align:center;padding:30px;color:#bdd3e7}@media(max-width:600px){.filters{grid-template-columns:1fr}.players{grid-template-columns:1fr}.score{justify-content:center}.topin{align-items:flex-start}.top h1{font-size:15px}}
</style></head><body>
<section id="login" class="login hidden"><div class="logo">🎮</div><h1>دخول مشغّل الصالة</h1><p>هذه الصفحة لتسجيل نتائج البلايستيشن فقط. أول جهاز يسجل الدخول يصبح الجهاز المعتمد للحساب.</p><label>اسم المستخدم</label><input id="username" autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn" style="width:100%;margin-top:14px">دخول</button><div id="loginMsg" class="msg"></div></section>
<div id="app" class="hidden"><header class="top"><div class="topin"><div><h1>🎮 تشغيل مباريات البلايستيشن</h1><small id="who"></small></div><button id="logout" class="logout">خروج</button></div></header><main class="wrap"><div class="notice">اختر المباراة، اجعلها «مباشر»، أدخل النتيجة ثم اضغط «اعتماد النتيجة». يمكن فتح المباراة المنتهية وتصحيحها ثم اعتمادها من جديد.</div><div class="filters"><div class="filter"><label>الجهاز</label><select id="station"><option value="">كل الأجهزة</option></select></div><div class="filter"><label>الحالة</label><select id="status"><option value="">كل الحالات</option><option value="scheduled">لم تبدأ</option><option value="live">مباشرة</option><option value="completed">منتهية</option></select></div><div class="filter"><label>المجموعة</label><select id="group"><option value="">كل المجموعات</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select></div></div><div id="games" class="games"></div></main></div>
<script>
const TID='c983ee0c-4434-470d-b0a2-6e6efe1ad650',key='ps-device-'+TID;let token=localStorage.getItem(key);if(!token){token=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem(key,token)}
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{global:{headers:{'x-ps-device':token}},auth:{storageKey:'playstation-operator-auth'}}),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let comp,people=[],matches=[];
function message(t,ok=false){$('loginMsg').textContent=t;$('loginMsg').style.color=ok?'#57dda0':'#ff8499'}function person(id){return people.find(p=>p.id===id)}function showLogin(t=''){$('login').classList.remove('hidden');$('app').classList.add('hidden');if(t)message(t)}
async function authorize(){const {data:{session}}=await sb.auth.getSession();if(!session)return showLogin();const {data:a}=await sb.from('playstation_admins').select('display_name,role').eq('tournament_id',TID).eq('user_id',session.user.id).eq('role','operator').eq('is_active',true).maybeSingle();if(!a){await sb.auth.signOut();return showLogin('هذا الحساب ليس حساب مشغّل الصالة')};const {data:claimed,error}=await sb.rpc('claim_playstation_operator_device',{p_tournament_id:TID,p_device_token:token});if(error||!claimed){await sb.auth.signOut();return showLogin('الحساب مرتبط بجهاز آخر. اطلب من المدير إعادة تهيئة الجهاز.')}$('who').textContent=a.display_name+' · جهاز معتمد';$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}
$('loginBtn').onclick=async()=>{message('جاري التحقق...',true);const u=$('username').value.trim().toLowerCase(),email=u.includes('@')?u:u+'@ps.mansour.app';const {error}=await sb.auth.signInWithPassword({email,password:$('password').value});if(error)return message('اسم المستخدم أو كلمة المرور غير صحيحة');authorize()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function load(){const {data:c,error}=await sb.from('playstation_competitions').select('*').eq('tournament_id',TID).single();if(error)return $('games').innerHTML='<div class="empty">تعذر تحميل البطولة</div>';comp=c;const [{data:p},{data:m}]=await Promise.all([sb.from('playstation_participants').select('id,name,participant_no,group_code').eq('competition_id',c.id),sb.from('playstation_matches').select('*').eq('competition_id',c.id).order('match_order')]);people=p||[];matches=m||[];$('station').innerHTML='<option value="">كل الأجهزة</option>'+Array.from({length:c.stations_count||8},(_,i)=>`<option value="${i+1}">الجهاز ${i+1}</option>`).join('');render()}
function render(){const station=$('station').value,status=$('status').value,group=$('group').value,list=matches.filter(m=>(!station||m.station_no==station)&&(!status||m.status===status)&&(!group||m.group_code===group));$('games').innerHTML=list.length?list.map(m=>{const a=person(m.player1_id),b=person(m.player2_id),done=m.status==='completed';return `<article class="game ${done?'done':''} ${m.status==='live'?'live-now':''}"><div class="meta">${m.station_no?'🎮 الجهاز '+m.station_no+' · ':''}${m.wave_no?'الدفعة '+m.wave_no+' · ':''}${m.group_code?'المجموعة '+esc(m.group_code)+' · ':''}${m.round_no?'الجولة '+m.round_no+' · ':''}${done?'✅ معتمدة':m.status==='live'?'🔴 مباشرة':'⏳ لم تبدأ'}</div><div class="players"><div class="player"><b>#${a?.participant_no||'—'} ${esc(a?.name||'بانتظار المشارك')}</b></div><div class="score"><button class="step" onclick="step('${m.id}',1,-1)">−</button><input id="s1_${m.id}" type="number" min="0" value="${m.score1??0}"><button class="step" onclick="step('${m.id}',1,1)">+</button><b>:</b><button class="step" onclick="step('${m.id}',2,-1)">−</button><input id="s2_${m.id}" type="number" min="0" value="${m.score2??0}"><button class="step" onclick="step('${m.id}',2,1)">+</button></div><div class="player"><b>#${b?.participant_no||'—'} ${esc(b?.name||'بانتظار المشارك')}</b></div></div><div class="actions"><button class="btn live" onclick="save('${m.id}','live')">🔴 مباشر</button><button class="btn approve" onclick="save('${m.id}','completed')">${done?'✏️ حفظ التصحيح واعتماده':'✅ اعتماد النتيجة'}</button></div></article>`}).join(''):'<div class="empty">لا توجد مباريات مطابقة.</div>'}
window.step=(id,side,delta)=>{const x=$('s'+side+'_'+id);x.value=Math.max(0,(+x.value||0)+delta)};window.save=async(id,status)=>{const patch={status,score1:+$('s1_'+id).value,score2:+$('s2_'+id).value,updated_at:new Date().toISOString()};if(status==='live')patch.started_at=new Date().toISOString();if(status==='completed')patch.completed_at=new Date().toISOString();const {error}=await sb.from('playstation_matches').update(patch).eq('id',id);if(error)return alert(error.message.includes('row-level')?'هذا الجهاز غير مخوّل بالحفظ':error.message);await load()};['station','status','group'].forEach(id=>$(id).onchange=render);authorize();
</script></body></html>
