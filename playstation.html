<header class="hero"><div class="top"><a class="back" id="back" href="tournament.html?id=c983ee0c-4434-470d-b0a2-6e6efe1ad650&amp;standalone=1">← كأس منصور</a><img class="brand" id="psLogo" alt="بطولة البلايستيشن للناشئين 2027"></div><div class="intro"><h1 id="title">بطولة البلايستيشن للصغار</h1><p id="subtitle">الفعالية المصاحبة لكأس منصور 2027</p></div></header>
<main class="wrap"><section class="live" id="live"></section><nav class="tabs"><button class="tab on" data-pane="groups">المجموعات</button><button class="tab" data-pane="finals">الأدوار النهائية</button><button class="tab" data-pane="champion">البطل</button></nav><section class="pane on" id="groups"><div class="title">ترتيب المجموعات <span>يتحدث مباشرة</span></div><div class="format" id="formatInfo">30 مشاركًا · 6 مجموعات × 5 · يتأهل الأول والثاني وأفضل أربعة من المركز الثالث</div><div class="groups" id="groupGrid"></div></section><section class="pane" id="finals"><div class="title">دور الـ16 حتى النهائي <span>حسب النتائج المعتمدة</span></div><div class="matches" id="finalMatches"></div></section><section class="pane" id="champion"><div id="championBox"></div></section></main>
<script>
const MANSOUR_TID='c983ee0c-4434-470d-b0a2-6e6efe1ad650',params=new URLSearchParams(location.search),requestedTid=params.get('tid')||params.get('scope_tid'),TID=requestedTid||MANSOUR_TID;
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
document.getElementById('psLogo').src=window.PLAYSTATION_LOGO_2027||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let comp,people=[],matches=[];const person=id=>people.find(p=>p.id===id);const pic=p=>p?.photo_url?`<img class="avatar" src="${esc(p.photo_url)}" alt="">`:'<span class="avatar">🎮</span>';
function standings(group){const rows=people.filter(p=>p.group_code===group).map(p=>({p,pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})),map=Object.fromEntries(rows.map(r=>[r.p.id,r]));matches.filter(m=>m.stage==='group'&&m.group_code===group&&m.status==='completed').forEach(m=>{const a=map[m.player1_id],b=map[m.player2_id];if(!a||!b)return;a.pl++;b.pl++;a.gf+=m.score1||0;a.ga+=m.score2||0;b.gf+=m.score2||0;b.ga+=m.score1||0;if(m.score1>m.score2){a.w++;b.l++;a.pts+=comp.win_points;b.pts+=comp.loss_points}else if(m.score2>m.score1){b.w++;a.l++;b.pts+=comp.win_points;a.pts+=comp.loss_points}else{a.d++;b.d++;a.pts+=comp.draw_points;b.pts+=comp.draw_points}});return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function render(){document.getElementById('title').textContent=comp.title;document.getElementById('subtitle').textContent=comp.subtitle||'';document.getElementById('back').href='tournament.html?id='+MANSOUR_TID+'&standalone=1';const live=matches.find(m=>m.status==='live');if(live){const a=person(live.player1_id),b=person(live.player2_id),box=document.getElementById('live');box.classList.add('show');box.innerHTML=`<div class="live-head"><b class="dot">مباشر الآن</b><span>${live.group_code?'المجموعة '+esc(live.group_code):'الأدوار النهائية'}</span></div><div class="score"><span>${esc(a?.name||'—')}<small>${esc(a?.nickname||'')}</small></span><b>${live.score1??0} — ${live.score2??0}</b><span>${esc(b?.name||'—')}<small>${esc(b?.nickname||'')}</small></span></div>`}const groups=[...new Set(people.map(p=>p.group_code).filter(Boolean))].sort();document.getElementById('groupGrid').innerHTML=groups.length?groups.map(g=>`<article class="card"><div class="group-head">المجموعة ${esc(g)}<span class="badge">يتأهل ${comp.qualifiers_per_group}</span></div><table><thead><tr><th>المشارك</th><th>لعب</th><th>فارق</th><th>نقاط</th></tr></thead><tbody>${standings(g).map(r=>`<tr><td>${pic(r.p)}${esc(r.p.name)}</td><td>${r.pl}</td><td>${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</td><td class="pts">${r.pts}</td></tr>`).join('')}</tbody></table></article>`).join(''):'<div class="empty">ستظهر المجموعات بعد إضافة المشاركين</div>';const finals=matches.filter(m=>m.stage!=='group').sort((a,b)=>a.match_order-b.match_order),labels={round_of_16:'دور الـ16',quarter_final:'ربع النهائي',semi_final:'نصف النهائي',third_place:'المركز الثالث',final:'النهائي'};document.getElementById('finalMatches').innerHTML=finals.length?finals.map(m=>`<article class="match"><div class="stage">${labels[m.stage]||m.stage}</div><div class="line"><span>${esc(person(m.player1_id)?.name||'بانتظار المتأهل')}</span><b>${m.score1??'—'}</b></div><div class="line"><span>${esc(person(m.player2_id)?.name||'بانتظار المتأهل')}</span><b>${m.score2??'—'}</b></div></article>`).join(''):'<div class="empty">تظهر الأدوار النهائية بعد اعتماد آلية التأهل</div>';const final=finals.find(m=>m.stage==='final'&&m.status==='completed'),winner=final?person(final.score1>final.score2?final.player1_id:final.player2_id):null;document.getElementById('championBox').innerHTML=winner?`<div class="champ">🏆<strong>${esc(winner.name)}</strong><span>بطل البلايستيشن 2027</span></div>`:'<div class="champ">🏆<strong>بطل البلايستيشن 2027</strong><span>يظهر بعد اعتماد المباراة النهائية</span></div>'}
async function load(){const {data:c}=await sb.from('playstation_competitions').select('*').eq('tournament_id',TID).maybeSingle();if(!c){document.querySelector('main').innerHTML='<div class="empty">لم تُفتح البطولة بعد</div>';return}comp=c;const [{data:p},{data:m}]=await Promise.all([sb.from('playstation_participants').select('*').eq('competition_id',c.id).order('sort_order'),sb.from('playstation_matches').select('*').eq('competition_id',c.id).order('match_order')]);people=p||[];matches=m||[];render();document.getElementById('formatInfo').textContent=`${c.participant_target} مشاركًا · ${c.groups_count} مجموعات × ${c.group_size} · يتأهل الأول والثاني وأفضل ${c.best_thirds_count} من المركز الثالث`;document.querySelectorAll('.stage').forEach(x=>{if(x.textContent==='round_of_16')x.textContent='دور الـ16'});sb.channel('ps-'+c.id).on('postgres_changes',{event:'*',schema:'public',table:'playstation_matches',filter:'competition_id=eq.'+c.id},load).subscribe()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===b.dataset.pane))});
if(TID!==MANSOUR_TID){document.querySelector('main').innerHTML='<div class="empty">هذه الفعالية مخصصة لكأس منصور 2027 فقط</div>'}else load();
