<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092856">
<title>ترشيحات دوري أبطال أوروبا</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#edf4fb;--surface:#fff;--ink:#10213b;--muted:#65758a;--blue:#092856;--blue2:#174b8f;--gold:#d7ab45;--line:#d7e2ef;--green:#e7f7ef;--greenInk:#17613f;--danger:#a12b35}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Alexandria,Tahoma,sans-serif}.shell{max-width:560px;margin:auto;min-height:100vh;padding-bottom:28px}.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;padding:calc(17px + env(safe-area-inset-top)) 17px 24px;border-radius:0 0 28px 28px;box-shadow:0 14px 32px #09285635}.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff26;border-radius:50%;width:210px;height:210px;left:-70px;top:-105px}.hero:after{width:125px;height:125px;left:35px;top:-70px}.top,.title{position:relative}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:8px;font-weight:700}.ball{width:38px;height:38px;display:grid;place-items:center;background:#ffffff16;border-radius:13px;box-shadow:inset 0 0 0 1px #ffffff26}.return{color:#fff;text-decoration:none;padding:10px 12px;border-radius:13px;background:#ffffff14;box-shadow:inset 0 0 0 1px #ffffff2b;font-size:12px}.title{margin-top:23px}.title h1{font-size:22px;margin:0 0 7px}.title p{font-size:12px;opacity:.82;margin:0}.body{padding:14px}.account,.points,.match,.waiting,.rank{background:var(--surface);border-radius:18px;box-shadow:0 10px 24px #09285616}.account{display:flex;justify-content:space-between;gap:10px;padding:12px;color:var(--greenInk);background:var(--green);font-size:12px}.points{margin:12px 0;padding:12px 7px;display:grid;grid-template-columns:1fr 20px 1fr 20px 1fr;align-items:center;text-align:center;background:linear-gradient(135deg,#fff7df,var(--surface))}.points strong{display:block;color:#9b6a00;font-size:18px}.points small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.tab{border:0;background:transparent;color:var(--muted);padding:12px 5px;border-radius:13px;font:600 12px Alexandria;cursor:pointer}.tab.active{background:var(--surface);color:var(--ink);box-shadow:0 7px 18px #0928561b}.heading{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:7px 2px 10px}.heading h2{font-size:17px;margin:0}.heading span{font-size:11px;color:var(--muted)}.match{position:relative;overflow:hidden;padding:14px;margin-bottom:11px}.match:before{content:"";position:absolute;inset-inline-start:-32px;top:-42px;width:115px;height:115px;border-radius:50%;background:#dce9f7;opacity:.42}.meta,.teams,.save,.notice{position:relative}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:14px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.team{text-align:center;min-width:0}.crest{width:54px;height:54px;margin:0 auto 7px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#e8f0fa,#fff);box-shadow:0 7px 15px #0928561c;overflow:hidden}.crest img{width:76%;height:76%;object-fit:contain}.team strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{display:flex;align-items:center;gap:5px}.score input{width:48px;height:50px;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--page);color:var(--ink);font:600 18px Alexandria}.save{width:100%;border:0;border-radius:14px;margin-top:14px;padding:13px;background:linear-gradient(110deg,var(--gold),#f1d483);color:var(--blue);box-shadow:0 8px 18px #d7ab4545;font:700 13px Alexandria;cursor:pointer}.save:disabled{opacity:.55;cursor:not-allowed}.notice{margin-top:10px;padding:10px;border-radius:12px;background:var(--green);color:var(--greenInk);font-size:11px;text-align:center}.notice.error{background:#fbe8ea;color:var(--danger)}.waiting{display:flex;gap:10px;align-items:center;padding:13px;color:var(--muted);font-size:11px;margin-bottom:9px}.panel[hidden]{display:none}.rank{display:flex;gap:10px;align-items:center;padding:12px;margin-bottom:7px;font-size:12px}.rank b{margin-inline-start:auto;color:#9b6a00}.empty{text-align:center;color:var(--muted);padding:30px 12px}.foot{text-align:center;color:var(--muted);font-size:10px;margin:12px 3px}.loader{text-align:center;padding:60px 15px;color:var(--muted)}@media(max-width:370px){.points{grid-template-columns:1fr 14px 1fr 14px 1fr}.score input{width:42px}.body{padding:11px}}
</style></head><body><main class="shell"><header class="hero"><div class="top"><span class="brand"><span class="ball">⚽</span> منصة البطولات</span><a class="return" id="backLink" href="tournament.html?id=eee33333-5d2a-4f3b-a981-d4b8f5f86143">العودة للبطولة ←</a></div><div class="title"><h1>تحدي دوري أبطال أوروبا</h1><p>توقّع النتيجة، اجمع النقاط، ونافس حتى النهائي</p></div></header><section class="body"><div id="app" class="loader">جارٍ تجهيز حسابك والترشيحات…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script>
const TOURNAMENT_ID='eee33333-5d2a-4f3b-a981-d4b8f5f86143',sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{storageKey:'tournament-participant-auth'}}),app=document.getElementById('app');let user,profile,rounds=[],fixtures=[],teams={},predictions={};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const scoreWinner=(f,h,a)=>h===a?null:(h>a?f.home_team_id:f.away_team_id);const locked=(r,f)=>Date.now()>=Math.min(new Date(r.closes_at).getTime(),new Date(f.kickoff_at).getTime()-r.lock_minutes*60000)||r.status!=='open';
function teamBlock(id){const t=teams[id]||{};return `<div class="team"><div class="crest">${t.logo_url?`<img src="${esc(t.logo_url)}" alt="">`:'⚽'}</div><strong>${esc(t.name_ar||t.name||'فريق متأهل')}</strong></div>`}
function render(){const r=rounds[0];if(!r){app.innerHTML='<div class="empty">لا توجد جولة ترشيحات متاحة حاليًا.</div>';return}const list=fixtures.filter(f=>f.round_id===r.id);app.innerHTML=`<div class="account"><span>✓ مرحبًا ${esc(profile.first_name)}</span><span>رمزك: ${esc(profile.participant_code)}</span></div><div class="points"><div><strong>+${r.winner_points}</strong><small>اختيار الفائز</small></div><span>+</span><div><strong>+${r.exact_bonus}</strong><small>نتيجة دقيقة</small></div><span>=</span><div><strong>${r.winner_points+r.exact_bonus}</strong><small>الحد الأقصى</small></div></div><div class="tabs"><button class="tab active" data-tab="picks">الترشيحات</button><button class="tab" data-tab="journey">مساري</button><button class="tab" data-tab="ranking">الترتيب</button></div><section class="panel" id="picks"><div class="heading"><h2>${esc(r.name)}</h2><span>الإغلاق قبل البداية بـ${r.lock_minutes} دقائق</span></div>${list.map(f=>matchHtml(r,f)).join('')||'<div class="empty">بانتظار المباريات.</div>'}<div class="waiting"><span>🔗</span><span>الفرق المتأهلة ستنتقل تلقائيًا عند اعتمادها من إدارة البطولة.</span></div></section><section class="panel" id="journey" hidden><div class="heading"><h2>مساري</h2><span>${Object.keys(predictions).length} ترشيح محفوظ</span></div>${list.map(f=>journeyHtml(f)).join('')}</section><section class="panel" id="ranking" hidden><div class="empty">سيظهر ترتيب المشاركين بعد اعتماد النتائج الرسمية.</div></section><p class="foot">الترشيحات محفوظة في حسابك، ولا يمكن تعديلها بعد وقت الإغلاق.</p>`;bind(r)}
function matchHtml(r,f){const p=predictions[f.id],isLocked=locked(r,f),date=new Intl.DateTimeFormat('ar-AE',{weekday:'short',hour:'numeric',minute:'2-digit'}).format(new Date(f.kickoff_at));return `<article class="match"><div class="meta"><span>${esc(r.stage_code==='internal_test'?'مباراة تجريبية':'مباراة')}</span><span>${date}</span></div><div class="teams">${teamBlock(f.home_team_id)}<div class="score"><input inputmode="numeric" min="0" max="50" type="number" data-home="${f.id}" value="${p?.predicted_home??''}" ${isLocked?'disabled':''} aria-label="أهداف الفريق الأول"><span>–</span><input inputmode="numeric" min="0" max="50" type="number" data-away="${f.id}" value="${p?.predicted_away??''}" ${isLocked?'disabled':''} aria-label="أهداف الفريق الثاني"></div>${teamBlock(f.away_team_id)}</div><button class="save" data-save="${f.id}" ${isLocked?'disabled':''}>${isLocked?'أُغلق الترشيح':p?'تحديث الترشيح':'حفظ الترشيح'}</button><div class="notice" data-note="${f.id}" style="display:${p?'block':'none'}">${p?'ترشيحك محفوظ: '+p.predicted_home+'–'+p.predicted_away:''}</div></article>`}
function journeyHtml(f){const p=predictions[f.id];return `<div class="rank"><span>${p?'✓':'—'}</span><span>${esc(teams[f.home_team_id]?.name_ar)} × ${esc(teams[f.away_team_id]?.name_ar)}</span><b>${p?p.predicted_home+'–'+p.predicted_away:'لم تشارك'}</b></div>`}
function bind(r){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.hidden=x.id!==b.dataset.tab)});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>savePrediction(r,fixtures.find(f=>f.id===b.dataset.save),b))}
async function savePrediction(r,f,button){const h=Number(document.querySelector(`[data-home="${f.id}"]`).value),a=Number(document.querySelector(`[data-away="${f.id}"]`).value),note=document.querySelector(`[data-note="${f.id}"]`);if(!Number.isInteger(h)||!Number.isInteger(a)||h<0||a<0||h>50||a>50){note.className='notice error';note.style.display='block';note.textContent='أدخل نتيجة صحيحة.';return}if(h===a){note.className='notice error';note.style.display='block';note.textContent='في النسخة التالية سيظهر اختيار المتأهل عند التعادل. اختر الآن نتيجة غير متعادلة للاختبار.';return}button.disabled=true;const payload={participant_id:user.id,fixture_id:f.id,predicted_home:h,predicted_away:a,predicted_winner_team_id:scoreWinner(f,h,a),updated_at:new Date().toISOString()};const old=predictions[f.id];const q=old?sb.from('participant_predictions').update(payload).eq('id',old.id):sb.from('participant_predictions').insert(payload).select().single();const {data,error}=await q;if(error){note.className='notice error';note.style.display='block';note.textContent='تعذر الحفظ؛ ربما انتهى وقت الترشيح.';button.disabled=false;return}predictions[f.id]=old?{...old,...payload}:data;note.className='notice';note.style.display='block';note.textContent=`تم الحفظ ✓ ${h>a?teams[f.home_team_id].name_ar:teams[f.away_team_id].name_ar} فائز ${Math.max(h,a)}–${Math.min(h,a)}`;button.textContent='تحديث الترشيح';button.disabled=false}
async function init(){let {data:{session}}=await sb.auth.getSession();if(!session){const r=await sb.auth.signInAnonymously();if(r.error){app.textContent='تعذر بدء الحساب.';return}session=r.data.session}user=session.user;let res=await sb.from('participant_profiles').select('first_name,family_name,participant_code').eq('user_id',user.id).maybeSingle();if(!res.data){location.replace('participant-account.html?next=predictions');return}profile=res.data;await sb.from('participant_tournament_memberships').upsert({participant_id:user.id,tournament_id:TOURNAMENT_ID},{onConflict:'participant_id,tournament_id',ignoreDuplicates:true});const rr=await sb.from('prediction_rounds').select('*').eq('tournament_id',TOURNAMENT_ID).eq('is_test',true).neq('status','draft').order('created_at',{ascending:false}).limit(1);if(rr.error){app.textContent='تعذر تحميل الجولة.';return}rounds=rr.data||[];if(!rounds.length){render();return}const ff=await sb.from('prediction_fixtures').select('*').eq('round_id',rounds[0].id).order('kickoff_at');fixtures=ff.data||[];const ids=[...new Set(fixtures.flatMap(f=>[f.home_team_id,f.away_team_id]).filter(Boolean))];if(ids.length){const tt=await sb.from('teams').select('id,name_ar,name,logo_url').in('id',ids);(tt.data||[]).forEach(t=>teams[t.id]=t)}const pp=await sb.from('participant_predictions').select('*').eq('participant_id',user.id).in('fixture_id',fixtures.map(f=>f.id));(pp.data||[]).forEach(p=>predictions[p.fixture_id]=p);render()}
init();
</script></body></html>
