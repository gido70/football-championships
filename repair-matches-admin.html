<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تصحيح مباريات 8 سبتمبر</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth-guard.js"></script>
<style>body{margin:0;background:#071426;color:#eef5ff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#102846;border:1px solid #294866;border-radius:18px;padding:24px}h1{font-size:24px}.warn{background:#40222b;border:1px solid #a64c5d;border-radius:12px;padding:14px;line-height:1.7}.btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:#c9a84c;color:#071426;font-size:17px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.log{white-space:pre-wrap;background:#06101e;border-radius:10px;padding:14px;margin-top:16px;min-height:70px;line-height:1.8}.ok{color:#45d483}.err{color:#ff7b7b}</style></head><body><main class="wrap"><div class="card"><h1>تصحيح مباريات 8 سبتمبر 2026</h1><div class="warn">هذه العملية تحذف أهداف المباريات الست القديمة فقط، ثم تضيف 21 هدفًا صحيحًا بأسماء اللاعبين والدقائق، وتصحح النتائج ونجم كل مباراة. البطاقات الموجودة لا تُحذف.</div><button class="btn" id="run">تنفيذ التصحيح والتحقق</button><div class="log" id="log">لم يبدأ التنفيذ.</div></div></main>
<script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const tid='eee33333-5d2a-4f3b-a981-d4b8f5f86143';
const mid=n=>`0cc20001-0000-0000-0000-${String(n).padStart(12,'0')}`,team=n=>`0cc10001-0000-0000-0000-${String(n).padStart(12,'0')}`;
const goals=[[1,31,'69a58dba-f264-4ed3-80ad-e7fe406a9b6d',21,null],[2,13,'11be0d61-f076-4516-b6c5-e8e94a75bb0d',11,null],[2,16,'fe9e7dfe-abca-4930-9692-e5a679d6d04f',19,null],[2,13,'9e8d7ded-deae-43f6-b96e-e54677bf10c5',22,null],[2,13,'9da95752-0c1e-437d-b737-a7a4efd7928d',43,null],[2,16,'88eb9398-ab66-4837-85c5-ffa817dd0356',61,'penalty'],[3,10,'50034f7c-06eb-4297-a541-5404b2af0b2f',53,'own_goal'],[3,24,'fe76f093-3053-4506-a6c3-a42b97465002',66,null],[3,10,'4a8d6a1e-5b3a-4864-8c11-3aeb2af195f8',80,null],[3,10,'4a8d6a1e-5b3a-4864-8c11-3aeb2af195f8',85,'penalty'],[3,24,'4a8d6a1e-5b3a-4864-8c11-3aeb2af195f8',93,'own_goal'],[4,6,'12f6992c-5eca-4472-93f8-331283c6fc42',46,null],[4,6,'12f6992c-5eca-4472-93f8-331283c6fc42',91,null],[5,20,'4c1ffbd2-c2a3-4a96-8100-b8095fd9ea53',12,null],[5,17,'599d5dc1-e071-43c6-97e0-04e4b1bd4464',33,null],[5,20,'affee3ba-fd67-4bdc-9425-ed0f5c11b893',36,null],[5,17,'599d5dc1-e071-43c6-97e0-04e4b1bd4464',49,null],[5,17,'0cd74226-6424-475c-98e1-3441c8ef6a6b',53,null],[6,3,'0cc30001-0000-0000-0000-000000000022',14,null],[6,3,'0cc30001-0000-0000-0000-000000000015',23,null],[6,5,'0cc30002-0000-0000-0000-000000000007',77,null]].map(([m,t,p,minute,event_subtype])=>({tournament_id:tid,match_id:mid(m),team_id:team(t),player_id:p,event_type:'goal',minute,event_subtype}));
const scores=[[1,1,0,'69a58dba-f264-4ed3-80ad-e7fe406a9b6d'],[2,2,3,'11be0d61-f076-4516-b6c5-e8e94a75bb0d'],[3,3,2,'4a8d6a1e-5b3a-4864-8c11-3aeb2af195f8'],[4,0,2,'12f6992c-5eca-4472-93f8-331283c6fc42'],[5,2,3,'599d5dc1-e071-43c6-97e0-04e4b1bd4464'],[6,2,1,'0cc30001-0000-0000-0000-000000000015']];
const log=document.getElementById('log'),btn=document.getElementById('run');function say(s,c=''){log.className='log '+c;log.textContent=s}
btn.onclick=async()=>{btn.disabled=true;say('جاري فحص جلسة الأدمن...');try{const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('جلسة الأدمن غير موجودة. افتح صفحة دخول الأدمن أولًا.');
const ids=Array.from({length:6},(_,i)=>mid(i+1));say('حذف الأهداف القديمة الخاطئة...');let r=await sb.from('match_events').delete().in('match_id',ids).eq('event_type','goal');if(r.error)throw r.error;
say('إضافة الأهداف الصحيحة...');r=await sb.from('match_events').insert(goals);if(r.error)throw r.error;
say('تصحيح النتائج ونجوم المباريات...');for(const [m,home_score,away_score,player_of_match_id] of scores){r=await sb.from('matches').update({home_score,away_score,player_of_match_id}).eq('id',mid(m));if(r.error)throw r.error;}
const {data:check,error}=await sb.from('match_events').select('id,player_id,event_subtype').in('match_id',ids).eq('event_type','goal');if(error)throw error;if(check.length!==21||check.some(x=>!x.player_id))throw new Error('فشل التحقق النهائي: عدد الأهداف أو أسماء اللاعبين غير مكتمل.');
say('اكتمل التصحيح بنجاح.\n21 هدفًا بأسماء اللاعبين.\n6 نتائج صحيحة.\n6 نجوم مباريات محددين.','ok');}catch(e){say('لم يكتمل التصحيح: '+e.message,'err');btn.disabled=false;}};
</script></body></html>
