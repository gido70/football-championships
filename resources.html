</style></head><body><nav class="nav"><strong>🗂️ معلومات البطولة</strong><a id="backLink" href="tournament.html">← البطولة</a></nav><main class="wrap"><h1 class="title" id="tourName">لوائح وتعليمات البطولة</h1><p class="sub">المراجع الرسمية والفيديوهات التعليمية</p><div id="app"><div class="empty">⏳ جاري تحميل المواد...</div></div></main>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.worker.min.mjs';
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),q=new URLSearchParams(location.search),TID=q.get('id')||q.get('tid'),filter=q.get('category'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let RES=[],pdfTask=null,currentPdf=null,pdfZoom=1,renderToken=0;
const META={intro:['فيديو مقدمة البطولة','🎬'],regulations:['اللوائح التنظيمية','📘'],decisions:['قرارات اللجنة','⚖️'],instructions:['التعليمات والإرشادات','📋'],tutorials:['الفيديوهات التعليمية والشارحة','🎓']};
async function load(){if(!TID){$('app').innerHTML='<div class="empty">لم تُحدَّد بطولة</div>';return}const back=window.TournamentScope?.scopedUrl('tournament.html?id='+TID)||'tournament.html?id='+TID;$('backLink').href=back;window.PublicNavigation?.configureBack($('backLink'),back,'البطولة');const [{data:t},{data:settings},{data:rows,error}]=await Promise.all([sb.from('tournaments').select('*').eq('id',TID).single(),sb.from('tournament_content_sections').select('section_key,is_visible').eq('tournament_id',TID),sb.from('tournament_resources').select('*').eq('tournament_id',TID).eq('is_visible',true).order('sort_order').order('created_at')]);window.TournamentScope?.applyTournamentTheme(t);$('tourName').textContent=(t?.name||'البطولة')+' — المعلومات والتعليمات';if(error){$('app').innerHTML='<div class="empty error">تعذر تحميل المواد الآن</div>';return}const visible=Object.fromEntries((settings||[]).map(x=>[x.section_key,x.is_visible]));RES=(rows||[]).filter(r=>visible[r.category]!==false&&(!filter||r.category===filter));if(!RES.length){$('app').innerHTML='<div class="empty">لا توجد مواد ظاهرة في هذا القسم</div>';return}const cats=[...new Set(RES.map(r=>r.category))];$('app').innerHTML=cats.map(cat=>{const list=RES.filter(r=>r.category===cat),m=META[cat]||[cat,'📄'];return `<section class="group"><h2>${m[1]} ${m[0]}</h2><div class="cards">${list.map(r=>`<button class="card" data-id="${r.id}"><div class="thumb">${r.thumbnail_url?`<img src="${esc(r.thumbnail_url)}" alt="">`:r.media_type==='pdf'?'📄':'▶️'}</div><div class="body"><div class="card-title">${esc(r.title)}</div>${r.description?`<div class="desc">${esc(r.description)}</div>`:''}<span class="open">${r.media_type==='pdf'?'قراءة الملف':'مشاهدة الفيديو'}</span></div></button>`).join('')}</div></section>`}).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>openItem(RES.find(r=>r.id===b.dataset.id),true));}
async function renderPdf(token){if(!currentPdf||token!==renderToken)return;const body=$('viewerBody'),shell=document.createElement('div');shell.className='pdf-shell';shell.innerHTML=`<div class="pdf-tools"><button id="zoomOut" aria-label="تصغير">−</button><span>${Math.round(pdfZoom*100)}%</span><button id="zoomIn" aria-label="تكبير">＋</button></div><div class="pdf-pages"></div>`;body.innerHTML='';body.appendChild(shell);const wrap=shell.querySelector('.pdf-pages');for(let n=1;n<=currentPdf.numPages;n++){if(token!==renderToken)return;const page=await currentPdf.getPage(n),base=page.getViewport({scale:1}),available=Math.max(280,body.clientWidth-8),cssScale=(available/base.width)*pdfZoom,dpr=Math.min(window.devicePixelRatio||1,2),viewport=page.getViewport({scale:cssScale*dpr}),canvas=document.createElement('canvas');canvas.className='pdf-page';canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);canvas.style.width=Math.floor(viewport.width/dpr)+'px';canvas.style.height=Math.floor(viewport.height/dpr)+'px';wrap.appendChild(canvas);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise}shell.querySelector('#zoomOut').onclick=()=>changePdfZoom(-.2);shell.querySelector('#zoomIn').onclick=()=>changePdfZoom(.2);}
async function changePdfZoom(delta){pdfZoom=Math.max(.8,Math.min(2,pdfZoom+delta));const token=++renderToken;await renderPdf(token);$('viewerBody').scrollTop=0;}
async function openItem(r,push=false){if(!r)return;const token=++renderToken;currentPdf=null;pdfZoom=1;$('viewer').classList.add('open');$('viewer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('viewerName').textContent=r.title;if(push)history.pushState({resourceViewer:true},'',location.href.split('#')[0]+'#viewer');if(r.media_type==='video'){$('viewerBody').style.direction='rtl';$('viewerBody').style.padding='18px 14px calc(22px + env(safe-area-inset-bottom,0px))';$('viewerBody').style.background='linear-gradient(160deg,#eefbff,#cbeaf5)';$('viewerBody').innerHTML=`<div class="media-stage"><video src="${esc(r.file_url)}" controls autoplay playsinline></video></div>`;return}if(r.media_type==='link'){$('viewerBody').innerHTML=`<div class="media-stage"><div class="state"><a href="${esc(r.file_url)}" target="_blank" rel="noopener">فتح الرابط</a></div></div>`;return}$('viewerBody').style.direction='ltr';$('viewerBody').style.padding='10px 0 calc(18px + env(safe-area-inset-bottom,0px))';$('viewerBody').style.background='#eef1f4';$('viewerBody').innerHTML='<div class="state">⏳ جاري تجهيز الملف بنفس عارض النشرات...</div>';try{if(pdfTask)await pdfTask.destroy().catch(()=>{});pdfTask=pdfjsLib.getDocument({url:r.file_url});currentPdf=await pdfTask.promise;if(token!==renderToken)return;await renderPdf(token)}catch(e){if(token===renderToken)$('viewerBody').innerHTML='<div class="state error">تعذر تجهيز عرض الملف الآن.</div>'}}
function close(fromPop=false){renderToken++;currentPdf=null;$('viewer').classList.remove('open');$('viewer').setAttribute('aria-hidden','true');$('viewerBody').innerHTML='';document.body.style.overflow='';if(!fromPop&&history.state?.resourceViewer)history.back()}$('closeBtn').onclick=()=>close();addEventListener('popstate',()=>{if($('viewer').classList.contains('open'))close(true)});addEventListener('keydown',e=>{if(e.key==='Escape')close()});load();
</script></body></html>
