<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426"><title>لوائح وتعليمات البطولة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="public-ui.css"><link rel="stylesheet" href="public-navigation.css"><link rel="stylesheet" href="tournament-theme.css">
<style>
body{margin:0;background:linear-gradient(180deg,#071426,#0c2742);color:#eef5ff;font-family:Tajawal,Arial,sans-serif;min-height:100vh}.nav{max-width:1000px;margin:auto;padding:14px;display:flex;justify-content:space-between;align-items:center}.nav a{color:#eef5ff;text-decoration:none;background:#14385d;border:1px solid #2d5880;border-radius:10px;padding:8px 13px;font-weight:800}.wrap{max-width:1000px;margin:auto;padding:8px 14px 50px}.title{text-align:center;color:#f1c75b;margin:8px 0 2px}.sub{text-align:center;color:#9bb0c8;margin:0 0 18px}.group{margin:14px 0;border:1px solid #284b70;border-radius:16px;background:rgba(11,36,61,.75);overflow:hidden}.group h2{font-size:16px;margin:0;padding:13px 15px;background:linear-gradient(135deg,#123c64,#176a8b);color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:12px}.card{border:1px solid #315a7e;border-radius:13px;background:#0d2037;color:#eef5ff;padding:0;overflow:hidden;text-align:right;font-family:inherit;cursor:pointer}.thumb{height:130px;background:#071426;display:flex;align-items:center;justify-content:center;font-size:44px}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:12px}.card-title{font-size:14px;font-weight:900}.desc{font-size:11.5px;color:#9bb0c8;line-height:1.6;margin-top:5px}.open{display:inline-flex;margin-top:10px;background:#c9a84c;color:#111;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:900}.empty{text-align:center;padding:35px;color:#9bb0c8}.viewer{position:fixed;inset:0;background:#06111f;z-index:1000;display:none;flex-direction:column}.viewer.open{display:flex}.viewer-top{padding:9px;display:flex;align-items:center;gap:10px;background:#0b2745}.viewer-top button,.viewer-top a{border:1px solid #4c6f91;background:#173e62;color:#fff;border-radius:8px;padding:8px 11px;font-family:inherit;text-decoration:none}.viewer-name{flex:1;font-weight:900;text-align:center}.viewer-body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:8px}.viewer-body video{width:min(100%,1000px);max-height:82vh;background:#000}.pdf-pages{width:100%;max-width:900px}.pdf-page{display:block;margin:0 auto 10px;max-width:100%;background:#fff;box-shadow:0 4px 18px #0008}.state{padding:40px;text-align:center}.error{color:#ff8d85}@media(max-width:540px){.cards{grid-template-columns:1fr}.viewer-name{font-size:12px}.viewer-top{flex-wrap:wrap}.viewer-name{order:3;flex-basis:100%}}
</style></head><body><nav class="nav"><strong>🗂️ معلومات البطولة</strong><a id="backLink" href="tournament.html">← البطولة</a></nav><main class="wrap"><h1 class="title" id="tourName">لوائح وتعليمات البطولة</h1><p class="sub">المراجع الرسمية والفيديوهات التعليمية</p><div id="app"><div class="empty">⏳ جاري تحميل المواد...</div></div></main>
<section id="viewer" class="viewer" aria-hidden="true"><div class="viewer-top"><button id="closeBtn">✕ إغلاق</button><div id="viewerName" class="viewer-name"></div><a id="directLink" target="_blank" rel="noopener">فتح الملف ↗</a></div><div id="viewerBody" class="viewer-body"></div></section>
<script src="vendor/supabase.min.js"></script><script src="supabase-config.js"></script><script src="tournament-scope.js"></script><script src="public-navigation.js"></script>
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.worker.min.mjs';
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),q=new URLSearchParams(location.search),TID=q.get('id')||q.get('tid'),filter=q.get('category'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let RES=[],pdfTask=null,renderToken=0;
const META={intro:['فيديو مقدمة البطولة','🎬'],regulations:['اللوائح التنظيمية','📘'],decisions:['قرارات اللجنة','⚖️'],instructions:['التعليمات والإرشادات','📋'],tutorials:['الفيديوهات التعليمية والشارحة','🎓']};
async function load(){if(!TID){$('app').innerHTML='<div class="empty">لم تُحدَّد بطولة</div>';return}const back=window.TournamentScope?.scopedUrl('tournament.html?id='+TID)||'tournament.html?id='+TID;$('backLink').href=back;window.PublicNavigation?.configureBack($('backLink'),back,'البطولة');const [{data:t},{data:settings},{data:rows,error}]=await Promise.all([sb.from('tournaments').select('*').eq('id',TID).single(),sb.from('tournament_content_sections').select('section_key,is_visible').eq('tournament_id',TID),sb.from('tournament_resources').select('*').eq('tournament_id',TID).eq('is_visible',true).order('sort_order').order('created_at')]);window.TournamentScope?.applyTournamentTheme(t);$('tourName').textContent=(t?.name||'البطولة')+' — المعلومات والتعليمات';if(error){$('app').innerHTML='<div class="empty error">تعذر تحميل المواد الآن</div>';return}const visible=Object.fromEntries((settings||[]).map(x=>[x.section_key,x.is_visible]));RES=(rows||[]).filter(r=>visible[r.category]!==false&&(!filter||r.category===filter));if(!RES.length){$('app').innerHTML='<div class="empty">لا توجد مواد ظاهرة في هذا القسم</div>';return}const cats=[...new Set(RES.map(r=>r.category))];$('app').innerHTML=cats.map(cat=>{const list=RES.filter(r=>r.category===cat),m=META[cat]||[cat,'📄'];return `<section class="group"><h2>${m[1]} ${m[0]}</h2><div class="cards">${list.map(r=>`<button class="card" data-id="${r.id}"><div class="thumb">${r.thumbnail_url?`<img src="${esc(r.thumbnail_url)}" alt="">`:r.media_type==='pdf'?'📄':'▶️'}</div><div class="body"><div class="card-title">${esc(r.title)}</div>${r.description?`<div class="desc">${esc(r.description)}</div>`:''}<span class="open">${r.media_type==='pdf'?'قراءة الملف':'مشاهدة الفيديو'}</span></div></button>`).join('')}</div></section>`}).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>openItem(RES.find(r=>r.id===b.dataset.id)));}
async function openItem(r){if(!r)return;renderToken++;$('viewer').classList.add('open');$('viewer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('viewerName').textContent=r.title;$('directLink').href=r.file_url;if(r.media_type==='video'){$('viewerBody').innerHTML=`<video src="${esc(r.file_url)}" controls autoplay playsinline></video>`;return}if(r.media_type==='link'){$('viewerBody').innerHTML=`<div class="state"><a href="${esc(r.file_url)}" target="_blank" rel="noopener">فتح الرابط</a></div>`;return}const token=renderToken;$('viewerBody').innerHTML='<div class="state">⏳ جاري تجهيز الملف...</div>';try{if(pdfTask)await pdfTask.destroy().catch(()=>{});pdfTask=pdfjsLib.getDocument({url:r.file_url});const pdf=await pdfTask.promise;if(token!==renderToken)return;const wrap=document.createElement('div');wrap.className='pdf-pages';$('viewerBody').innerHTML='';$('viewerBody').appendChild(wrap);for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),base=page.getViewport({scale:1}),width=Math.min(880,Math.max(280,$('viewerBody').clientWidth-16)),dpr=Math.min(devicePixelRatio||1,2),vp=page.getViewport({scale:width/base.width*dpr}),canvas=document.createElement('canvas');canvas.className='pdf-page';canvas.width=vp.width;canvas.height=vp.height;canvas.style.width=vp.width/dpr+'px';canvas.style.height=vp.height/dpr+'px';wrap.appendChild(canvas);await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;}}catch(e){if(token===renderToken)$('viewerBody').innerHTML='<div class="state error">تعذر عرض الملف داخل الصفحة. استخدم زر فتح الملف.</div>'}}
function close(){renderToken++;$('viewer').classList.remove('open');$('viewer').setAttribute('aria-hidden','true');$('viewerBody').innerHTML='';document.body.style.overflow=''}$('closeBtn').onclick=close;addEventListener('keydown',e=>{if(e.key==='Escape')close()});load();
</script></body></html>
