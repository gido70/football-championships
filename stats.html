<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-app.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>الإحصائيات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Tajawal",sans-serif;background:#0d1117;color:#e6edf3;direction:rtl;min-height:100vh}
a{text-decoration:none;color:inherit}
.nav{background:#161b22;border-bottom:1px solid #21262d;padding:0 18px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-back{color:#8b949e;font-size:14px;font-weight:700;padding:7px 14px;border-radius:8px;border:1px solid #30363d}
.nav-title{font-size:15px;font-weight:800;color:#c9a84c;display:flex;align-items:center;gap:8px}

.hero{text-align:center;padding:26px 16px 16px;background:radial-gradient(circle at 50% 0%,rgba(201,168,76,.15),transparent 65%)}
.hero h1{font-size:24px;font-weight:900;margin-bottom:4px}
.hero p{font-size:13px;color:#8b949e}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;position:sticky;top:56px;background:#0d1117;z-index:90;border-bottom:1px solid #21262d}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 18px;border-radius:30px;background:#161b22;border:1px solid #30363d;color:#8b949e;font-size:13px;font-weight:800;white-space:nowrap;cursor:pointer;transition:.15s}
.chip.active{background:linear-gradient(135deg,#c9a84c,#a8842e);color:#0d1117;border-color:transparent}

.wrap{max-width:760px;margin:0 auto;padding:18px 16px 50px}
.sec{display:none;animation:fadeIn .25s ease}
.sec.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.lead-row{display:flex;align-items:center;gap:9px;background:#161b22;border:1px solid #30363d;border-radius:10px;padding:9px 12px;margin-bottom:7px}
.lead-rank{font-size:13px;font-weight:900;color:#3a4150;width:20px;text-align:center;flex-shrink:0}
.lead-row.r1 .lead-rank{color:#ffd700}
.lead-row.r2 .lead-rank{color:#c0c0c0}
.lead-row.r3 .lead-rank{color:#cd7f32}
.lead-row.r1{border-color:rgba(255,215,0,.25);background:rgba(255,215,0,.03)}
.lead-av{position:relative;flex-shrink:0}
.lead-photo{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid #30363d;display:block}
.lead-ph{width:32px;height:32px;border-radius:50%;background:#21262d;border:1.5px solid #30363d;font-size:11px;font-weight:800;color:#6e7b8f;align-items:center;justify-content:center}
.lead-num{font-size:10px;font-weight:900;color:#c9a84c;flex-shrink:0}
.lead-info{flex:1;min-width:0}
.lead-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-team{font-size:11px;color:#8b949e;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-val{font-size:14px;font-weight:900;color:#c9a84c;flex-shrink:0;display:flex;align-items:center;gap:4px}
.lead-val .u{font-size:10px;color:#8b949e;font-weight:600}

.lead-val.yellow{color:#ffd54f}
.lead-val.red{color:#f85149}

.info-card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.info-ic{font-size:24px;width:40px;text-align:center;flex-shrink:0}
.info-body b{display:block;font-size:14px;font-weight:800}
.info-body span{font-size:12px;color:#8b949e}
.info-count{margin-right:auto;background:rgba(201,168,76,.12);color:#c9a84c;font-size:12px;font-weight:800;padding:4px 10px;border-radius:10px}

.empty{text-align:center;padding:50px 0;color:#8b949e}
.empty span{font-size:34px;display:block;margin-bottom:8px}
.mstrip{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px;max-width:760px;margin:0 auto}
.mcard{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;text-align:center}
.mcard b{display:block;font-size:24px;font-weight:900;color:#fff}
.mcard span{font-size:12px;color:#8b949e}
/* pchip مشترك — أحجام صغيرة مناسبة للإحصائيات */
.pchip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);border:1px solid #21262d;border-radius:30px;padding:4px 10px 4px 5px;max-width:100%}
.pchip-photo{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid #30363d}
.pchip-av{width:26px;height:26px;border-radius:50%;background:#21262d;border:1.5px solid #30363d;font-size:10px;font-weight:800;color:#8b949e;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pchip-num{font-size:10px;font-weight:900;color:#c9a84c;flex-shrink:0}
.pchip-name{font-size:12px;font-weight:700}
.pchip-role{font-size:10px;color:#6e7b8f;margin-right:2px}
.pchip.goal{border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.06)}
.pchip.yellow{border-color:rgba(255,213,79,.35);background:rgba(255,213,79,.06)}
.pchip.red{border-color:rgba(248,81,73,.35);background:rgba(248,81,73,.06)}
.pchip.motm{border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.1)}


.award-ic{font-size:30px;margin-bottom:6px}
.award-title{font-size:11px;color:#c9a84c;font-weight:800;margin-bottom:6px}
.award-name{font-size:14px;font-weight:900}
.award-team{font-size:11px;color:#8b949e;margin-top:2px}

.match-star-row{display:flex;align-items:center;gap:10px;background:#161b22;border:1px solid #21262d;border-radius:10px;padding:9px 12px;margin-bottom:7px;font-size:13px}
.match-star-no{background:#21262d;color:#8b949e;font-weight:800;font-size:11px;padding:3px 9px;border-radius:8px;flex-shrink:0}
.match-star-vs{color:#8b949e;flex:1}
.match-star-name{color:#ffd700;font-weight:800;display:flex;align-items:center;gap:5px}

.var-team-card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:14px 16px;margin-bottom:10px}
.var-team-card .vt-name{font-size:14px;font-weight:800;margin-bottom:10px}
.var-stats-row{display:flex;flex-wrap:wrap;gap:8px}
.var-pill{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);color:#c9a84c;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px}
.sec-title{font-size:13px;color:#8b949e;font-weight:700;margin:18px 0 10px}
.sec-title:first-child{margin-top:0}

/* زر الرجوع العائم في الموبايل */
.float-back{display:none;position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:16px;z-index:199;background:rgba(6,14,26,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(201,168,76,.3);border-radius:30px;padding:10px 18px;font-size:13px;font-weight:800;color:#c9a84c;text-decoration:none;box-shadow:0 4px 18px rgba(0,0,0,.4)}
@media(max-width:760px){.float-back{display:flex;align-items:center;gap:6px}}
</style>
</head>
<body>

<div class="nav">
  <a class="nav-back" id="backLink" href="index.html">← رجوع</a>
  <div class="nav-title" id="navTitle">📊 الإحصائيات</div>
</div>

<div class="hero">
  <h1 id="tName">إحصائيات البطولة</h1>
  <p>كل الأرقام، الهدافون، البطاقات، والنجوم — في مكان واحد</p>
</div>

<div id="awardsHero"></div>
<div id="totalsStrip" class="mstrip"></div>

<div class="chips" id="chips">
  <button class="chip active" data-s="scorers" onclick="showSec('scorers')">⚽ الهدافون</button>
  <button class="chip" data-s="cards" onclick="showSec('cards')">🟨🟥 البطاقات</button>
  <button class="chip" data-s="motm" onclick="showSec('motm')">⭐ نجوم المباريات</button>
  <button class="chip" data-s="var" onclick="showSec('var')">🎯 الفار</button>
  <button class="chip" data-s="officials" onclick="showSec('officials')">👨‍⚖️ الحكام والمعلقون</button>
  <button class="chip" data-s="injuries" onclick="showSec('injuries')">🩹 الإصابات</button>
</div>

<div class="wrap">
  <div class="sec active" id="sec-scorers"><div id="scorersWrap" class="empty">⏳ جاري التحميل...</div></div>
  <div class="sec" id="sec-cards"><div id="cardsWrap"></div></div>
  <div class="sec" id="sec-motm"><div id="motmWrap"></div></div>
  <div class="sec" id="sec-var"><div id="varWrap"></div></div>
  <div class="sec" id="sec-officials"><div id="officialsWrap"></div></div>
  <div class="sec" id="sec-injuries"><div id="injuriesWrap"></div></div>
</div>

<script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const qs=new URLSearchParams(location.search);
const TID=qs.get('id');

function showSec(s){
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.s===s));
  document.querySelectorAll('.sec').forEach(el=>el.classList.toggle('active',el.id==='sec-'+s));
}
window.showSec=showSec;

function initials(name){return (name||'؟').trim().split(' ').map(w=>w[0]).slice(0,2).join('');}

function pchip(name,photo,number,role,variant=''){
  const ini=(name||'؟').trim().split(' ').map(w=>w[0]).slice(0,2).join('');
  const sn=(name||'—').split(' ').slice(0,2).join(' ');
  return `<span class="pchip ${variant}">
    ${photo?`<img class="pchip-photo" src="${photo}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:''}
    <span class="pchip-av" style="${photo?'display:none':''}">${ini}</span>
    ${number?`<span class="pchip-num">#${number}</span>`:''}
    <span class="pchip-name">${sn}</span>
    ${role?`<span class="pchip-role">${role}</span>`:''}
  </span>`;
}

function leadRow(rank,name,sub,val,unit,photo,extraClass,number){
  const rClass=rank===1?'r1':rank===2?'r2':rank===3?'r3':'';
  const rc=rank===1?'#ffd700':rank===2?'#c0c0c0':rank===3?'#cd7f32':'#3a4150';
  const vClass=extraClass||'';
  const sn=(name||'').split(' ').slice(0,2).join(' ');
  const ini=(name||'؟').trim().split(' ').map(w=>w[0]).slice(0,2).join('');
  return `<div class="lead-row ${rClass}">
    <div class="lead-rank" style="color:${rc}">${rank}</div>
    <div class="lead-av">
      ${photo?`<img class="lead-photo" src="${photo}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:''}
      <div class="lead-ph" style="${photo?'display:none':'display:flex'}">${ini}</div>
    </div>
    ${number?`<span class="lead-num">#${number}</span>`:''}
    <div class="lead-info">
      <div class="lead-name">${sn}</div>
      ${sub?`<div class="lead-team">${sub}</div>`:''}
    </div>
    <div class="lead-val ${vClass}">${val}<span class="u">${unit||''}</span></div>
  </div>`;
}

async function init(){
  if(!TID){document.body.innerHTML='<div class="empty"><span>⚠️</span><p>لم يتم تحديد البطولة</p></div>';return;}
  document.getElementById('backLink').href='tournament.html?id='+TID;
  const fb=document.getElementById('floatBack');if(fb)fb.href='tournament.html?id='+TID;

  const {data:t}=await sb.from('tournaments').select('*').eq('id',TID).single();
  if(t){
    document.getElementById('tName').textContent=t.name_ar||t.name||'';
    document.getElementById('navTitle').innerHTML='📊 إحصائيات '+(t.name_ar||t.name||'');
    document.title='إحصائيات '+(t.name_ar||t.name||'');
  }

  const {data:teams}=await sb.from('teams').select('id,name,name_ar').eq('tournament_id',TID);
  const teamName={}; (teams||[]).forEach(tm=>teamName[tm.id]=tm.name_ar||tm.name||'');

  const {data:matches}=await sb.from('matches').select('id,match_no,referee_1,referee_2,commentator,player_of_match_id,home_team_id,away_team_id').eq('tournament_id',TID).order('match_no');
  const mids=(matches||[]).map(m=>m.id);

  if(!mids.length){
    ['scorersWrap','cardsWrap','motmWrap','officialsWrap','injuriesWrap'].forEach(id=>{
      document.getElementById(id).innerHTML='<div class="empty"><span>📭</span><p>لا توجد بيانات بعد لهذه البطولة</p></div>';
    });
    return;
  }

  // جلب مباشر بـ tournament_id — أسرع وأكثر موثوقية
  const {data:events}=await sb.from('match_events')
    .select('event_type,player_id,team_id,manual_player_name,var_result,player:players!player_id(name,full_name_ar,number,jersey_photo_url)')
    .eq('tournament_id',TID);

  buildScorers(events,teamName);
  buildCards(events,teamName);
  buildMotm(matches,teamName);
  buildVar(events,teamName);
  buildOfficials(matches);
  buildInjuries(teamName);
  buildAwards();
  buildTotals(events,matches,teams);
}

function buildTotals(events,matches,teams){
  const goals=(events||[]).filter(e=>e.event_type==='goal').length;
  const cards=(events||[]).filter(e=>e.event_type==='yellow_card'||e.event_type==='red_card').length;
  const items=[
    {v:goals,l:'هدف'},
    {v:(matches||[]).length,l:'مباراة'},
    {v:cards,l:'بطاقة'},
    {v:(teams||[]).length,l:'فريق'}
  ];
  document.getElementById('totalsStrip').innerHTML=items.map(i=>`<div class="mcard"><b>${i.v}</b><span>${i.l}</span></div>`).join('');
}

function buildAwards(){
  const wrap=document.getElementById('awardsHero');
  wrap.innerHTML=`<div style="text-align:center;padding:14px 0 6px">
    <a href="awards.html?id=${TID}" style="display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));border:1px solid rgba(201,168,76,.4);color:#c9a84c;font-size:14px;font-weight:800;padding:12px 24px;border-radius:25px;text-decoration:none">
      🏆 صفحة الجوائز الرسمية ←
    </a>
  </div>`;
}

function tally(events,type,teamName={}){
  const map={};
  (events||[]).filter(e=>e.event_type===type&&(e.player_id||e.manual_player_name)).forEach(e=>{
    // مفتاح موحّد بالاسم فقط — يمنع تكرار نفس اللاعب من فرق مختلفة
    const key=e.player_id||('m:'+e.manual_player_name);
    const tm=teamName[e.team_id]||'';
    if(!map[key])map[key]={name:e.manual_player_name||e.player?.full_name_ar||e.player?.name||'—',photo:e.player?.jersey_photo_url,number:e.player?.number,team:tm,count:0};
    if(!map[key].team&&tm)map[key].team=tm;
    map[key].count++;
  });
  return Object.values(map).sort((a,b)=>b.count-a.count);
}

function buildScorers(events,teamName){
  const list=tally(events,'goal',teamName);
  const wrap=document.getElementById('scorersWrap');
  if(!list.length){wrap.innerHTML='<div class="empty"><span>⚽</span><p>لا توجد أهداف مسجلة بعد</p></div>';return;}
  wrap.innerHTML=list.slice(0,20).map((p,i)=>leadRow(i+1,p.name,teamName[p.team]||'',p.count,'هدف',p.photo,'goal',p.number)).join('');
}

function buildCards(events,teamName){
  const yellow=tally(events,'yellow_card',teamName);
  const red=tally(events,'red_card',teamName);
  let html='';
  html+='<div class="sec-title">🟨 الأكثر حصولاً على بطاقات صفراء</div>';
  html+=yellow.length?yellow.slice(0,15).map((p,i)=>leadRow(i+1,p.name,teamName[p.team]||'',p.count,'بطاقة',p.photo,'yellow',p.number)).join(''):'<div class="empty" style="padding:20px 0"><span>🟨</span><p>لا توجد بطاقات صفراء بعد</p></div>';
  html+='<div class="sec-title">🟥 البطاقات الحمراء</div>';
  html+=red.length?red.slice(0,15).map((p,i)=>leadRow(i+1,p.name,teamName[p.team]||'',p.count,'بطاقة',p.photo,'red',p.number)).join(''):'<div class="empty" style="padding:20px 0"><span>🟥</span><p>لا توجد بطاقات حمراء — انضباط ممتاز</p></div>';
  document.getElementById('cardsWrap').innerHTML=html;
}

async function buildMotm(matches,teamName){
  const withStar=(matches||[]).filter(m=>m.player_of_match_id);
  const wrap=document.getElementById('motmWrap');
  if(!withStar.length){wrap.innerHTML='<div class="empty"><span>⭐</span><p>لم يُختر نجم مباراة بعد</p></div>';return;}

  const ids=withStar.map(m=>m.player_of_match_id);
  const {data:players}=await sb.from('players').select('id,name,full_name_ar,jersey_photo_url,team_id').in('id',[...new Set(ids)]);
  const pMap={}; (players||[]).forEach(p=>pMap[p.id]=p);

  const count={};
  ids.forEach(id=>count[id]=(count[id]||0)+1);
  const leaderboard=Object.entries(count).map(([id,c])=>({id,count:c,...pMap[id]})).sort((a,b)=>b.count-a.count);

  let html='<div class="sec-title">🏆 الأكثر اختيارًا كنجم مباراة</div>';
  html+=leaderboard.map((p,i)=>leadRow(i+1,p.full_name_ar||p.name||'—',teamName[p.team_id]||'',p.count,'مرة',p.jersey_photo_url,'motm',p.number)).join('');

  html+='<div class="sec-title">📅 نجم كل مباراة</div>';
  html+=withStar.map(m=>{
    const p=pMap[m.player_of_match_id];
    return `<div class="match-star-row">
      <span class="match-star-no">${m.match_no?'م'+m.match_no:''}</span>
      <span class="match-star-vs">${teamName[m.home_team_id]||''} × ${teamName[m.away_team_id]||''}</span>
      <span class="match-star-name">⭐ ${p?.full_name_ar||p?.name||'—'}</span>
    </div>`;
  }).join('');

  wrap.innerHTML=html;
}

function buildVar(events,teamName){
  const wrap=document.getElementById('varWrap');
  const varEvents=(events||[]).filter(e=>e.event_type&&e.event_type.startsWith('var_'));
  if(!varEvents.length){wrap.innerHTML='<div class="empty"><span>🎯</span><p>لم تُستخدم تقنية الفار بعد في هذه البطولة</p></div>';return;}

  const labels={var_goal_confirmed:'✅ أهداف مؤكدة',var_goal_disallowed:'❌ أهداف ملغاة',var_penalty_review:'🎯 ركلات جزاء',var_red_card_review:'🟥 بطاقات حمراء مراجَعة'};
  const byTeam={};
  varEvents.forEach(e=>{
    const t=e.team_id?(teamName[e.team_id]||'—'):'بدون تحديد فريق';
    if(!byTeam[t])byTeam[t]={};
    byTeam[t][e.event_type]=(byTeam[t][e.event_type]||0)+1;
  });

  const totalByType={};
  varEvents.forEach(e=>{totalByType[e.event_type]=(totalByType[e.event_type]||0)+1;});

  let html='<div class="sec-title">📊 الإجمالي العام</div>';
  html+=`<div class="var-stats-row" style="padding:0 0 16px">${Object.entries(totalByType).map(([k,v])=>`<span class="var-pill">${labels[k]||k}: ${v}</span>`).join('')}</div>`;

  html+='<div class="sec-title">🏟️ حسب الفريق</div>';
  html+=Object.entries(byTeam).map(([t,stats])=>`
    <div class="var-team-card">
      <div class="vt-name">${t}</div>
      <div class="var-stats-row">${Object.entries(stats).map(([k,v])=>`<span class="var-pill">${labels[k]||k}: ${v}</span>`).join('')}</div>
    </div>
  `).join('');

  wrap.innerHTML=html;
}

function buildOfficials(matches){
  const refCount={},comCount={};
  (matches||[]).forEach(m=>{
    [m.referee_1,m.referee_2].forEach(r=>{if(r&&r.trim())refCount[r.trim()]=(refCount[r.trim()]||0)+1;});
    if(m.commentator&&m.commentator.trim())comCount[m.commentator.trim()]=(comCount[m.commentator.trim()]||0)+1;
  });
  const refs=Object.entries(refCount).sort((a,b)=>b[1]-a[1]);
  const coms=Object.entries(comCount).sort((a,b)=>b[1]-a[1]);
  let html='<div class="sec-title">👨‍⚖️ الحكام (عدد المباريات)</div>';
  html+=refs.length?refs.map(([n,c])=>`<div class="info-card"><div class="info-ic">👨‍⚖️</div><div class="info-body"><b>${n}</b><span>حكم مباراة</span></div><div class="info-count">${c} مباراة</div></div>`).join(''):'<div class="empty" style="padding:20px 0"><span>👨‍⚖️</span><p>لا توجد بيانات حكام بعد</p></div>';
  html+='<div class="sec-title">🎙️ المعلقون</div>';
  html+=coms.length?coms.map(([n,c])=>`<div class="info-card"><div class="info-ic">🎙️</div><div class="info-body"><b>${n}</b><span>تعليق</span></div><div class="info-count">${c} مباراة</div></div>`).join(''):'<div class="empty" style="padding:20px 0"><span>🎙️</span><p>لا توجد بيانات معلقين بعد</p></div>';
  document.getElementById('officialsWrap').innerHTML=html;
}

async function buildInjuries(teamName){
  const {data:players}=await sb.from('players').select('id,name,full_name_ar,jersey_photo_url,team_id,injury_note').eq('tournament_id',TID).eq('is_injured',true);
  const wrap=document.getElementById('injuriesWrap');
  if(!players||!players.length){wrap.innerHTML='<div class="empty"><span>💪</span><p>لا توجد إصابات مسجلة — الجميع بصحة جيدة</p></div>';return;}
  wrap.innerHTML=players.map(p=>`<div class="info-card">
    ${p.jersey_photo_url?`<img class="lead-photo" src="${p.jersey_photo_url}">`:`<div class="info-ic">🩹</div>`}
    <div class="info-body"><b>${p.full_name_ar||p.name}</b><span>${teamName[p.team_id]||''}${p.injury_note?' — '+p.injury_note:''}</span></div>
  </div>`).join('');
}

init().catch(err=>{
  console.error('Stats init error:', err);
  document.getElementById('scorersWrap').innerHTML='<div class="empty"><span>⚠️</span><p>خطأ في التحميل: '+err.message+'</p></div>';
});
</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js')
    .then(reg=>{
      // تحقق من تحديثات فورياً
      reg.update();
      // إن وجد service worker جديد، فعّله وأعد التحميل
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            // إعادة تحميل تلقائية لتطبيق التحديث
            window.location.reload();
          }
        });
      });
    });
  // استمع لرسائل التحديث
  navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
}
</script>
