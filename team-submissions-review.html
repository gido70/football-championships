<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مراجعة بيانات الفرق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Tajawal",sans-serif}
body{background:#0d1117;color:#e6edf3;direction:rtl;min-height:100vh;padding:20px}
.wrap{max-width:920px;margin:0 auto}
h1{font-size:20px;color:#c9a84c;margin-bottom:18px}
.team-sel{margin-bottom:20px}
select{width:100%;padding:10px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:14px;font-family:inherit}
.link-box{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;margin-bottom:20px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.link-box code{background:#0d1117;padding:4px 10px;border-radius:6px;color:#3fb950;direction:ltr;display:inline-block}
.copy-btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.sec{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:18px;margin-bottom:16px}
.sec h2{font-size:15px;color:#c9a84c;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:800}
.b-pending{background:rgba(255,193,7,.15);color:#ffc107}
.b-approved{background:rgba(63,185,80,.15);color:#3fb950}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;margin-bottom:12px}
.kv div{color:#b7c6dc}
.kv b{color:#e6edf3}
.docs{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.doc-link{background:#21262d;border:1px solid #30363d;padding:8px 14px;border-radius:8px;font-size:12px;color:#58a6ff;cursor:pointer}
.actions{display:flex;gap:10px}
.btn-app{background:#3fb950;color:#0d1117;font-weight:800;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px}
.btn-rej{background:#f85149;color:#fff;font-weight:800;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px}
.player-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #21262d}
.player-row img.jersey{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#21262d}
.empty{text-align:center;padding:30px;color:#8b949e;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>✅ مراجعة بيانات الفرق المُدخلة</h1>
  <div class="team-sel">
    <select id="teamSel" onchange="loadTeam()"><option>اختر بطولة وفريق...</option></select>
  </div>
  <div id="content"></div>
</div>

<script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
let CUR=null;

async function initTeams(){
  const {data:teams,error:e1}=await sb.from('teams').select('id,name_ar,name,tournament_id,coach_status').order('name_ar');
  if(e1){document.getElementById('teamSel').outerHTML='<div class="empty">⚠️ فشل تحميل الفرق: '+e1.message+'</div>';return;}
  const {data:tours}=await sb.from('tournaments').select('id,name_ar,name');
  const tMap={};(tours||[]).forEach(t=>tMap[t.id]=t.name_ar||t.name||'');
  const sel=document.getElementById('teamSel');
  sel.innerHTML='<option value="">اختر فريقًا...</option>'+(teams||[]).map(t=>
    `<option value="${t.id}">${tMap[t.tournament_id]||''} — ${t.name_ar||t.name} ${t.coach_status==='pending'?'🟡':''}</option>`
  ).join('');
}

async function loadTeam(){
  const id=document.getElementById('teamSel').value;
  if(!id){document.getElementById('content').innerHTML='';return;}
  const {data:team}=await sb.from('teams').select('*').eq('id',id).single();
  CUR=team;
  const {data:players}=await sb.from('players').select('*').eq('team_id',id).order('is_goalkeeper',{ascending:false});

  const link=location.origin+location.pathname.replace('team-submissions-review.html','team-submit.html')+'?token='+team.submit_token;

  let adminDocUrl='',adminPhotoUrl='';
  if(team.admin_doc_url){const{data}=await sb.storage.from('team-docs').createSignedUrl(team.admin_doc_url,3600);adminDocUrl=data?.signedUrl;}
  if(team.admin_photo_url){const{data}=await sb.storage.from('team-docs').createSignedUrl(team.admin_photo_url,3600);adminPhotoUrl=data?.signedUrl;}

  let coachIdUrl='',coachPassUrl='';
  if(team.coach_id_url){const{data}=await sb.storage.from('team-docs').createSignedUrl(team.coach_id_url,3600);coachIdUrl=data?.signedUrl;}
  if(team.coach_passport_url){const{data}=await sb.storage.from('team-docs').createSignedUrl(team.coach_passport_url,3600);coachPassUrl=data?.signedUrl;}

  let html=`
    <div class="link-box">
      🔗 رابط الإدخال لهذا الفريق:
      <code id="linkTxt">${link}</code>
      <button class="copy-btn" onclick="navigator.clipboard.writeText('${link}');this.textContent='✅ نُسخ'">نسخ</button>
    </div>

    <div class="sec">
      <h2>🧑‍💼 الإداري</h2>
      ${team.submitted_by_name?`
      <div class="kv">
        <div>الاسم: <b>${team.submitted_by_name}</b></div>
        <div>الجنسية: <b>${team.admin_nationality||'—'}</b></div>
      </div>
      <div class="docs">
        ${adminDocUrl?`<a class="doc-link" href="${adminDocUrl}" target="_blank">🪪 الهوية/الجواز</a>`:''}
        ${adminPhotoUrl?`<a class="doc-link" href="${adminPhotoUrl}" target="_blank">📷 الصورة الفوتوغرافية</a>`:''}
      </div>
      `:'<div class="empty">لم تُدخل بيانات إداري بعد</div>'}
    </div>

    <div class="sec">
      <h2>🧑‍🏫 المدرب <span class="badge ${team.coach_status==='approved'?'b-approved':'b-pending'}">${team.coach_status==='approved'?'معتمد':'بانتظار المراجعة'}</span></h2>
      ${team.coach_name?`
      <div class="kv">
        <div>الاسم: <b>${team.coach_name||'—'}</b></div>
        <div>الجنسية: <b>${team.coach_nationality||'—'}</b></div>
        <div>أُدخلت بواسطة: <b>${team.submitted_by_name||'—'}</b></div>
      </div>
      <div class="docs">
        ${coachIdUrl?`<a class="doc-link" href="${coachIdUrl}" target="_blank">🪪 عرض الهوية</a>`:''}
        ${coachPassUrl?`<a class="doc-link" href="${coachPassUrl}" target="_blank">📘 عرض الجواز</a>`:''}
      </div>
      ${team.coach_status!=='approved'?`<div class="actions"><button class="btn-app" onclick="approveCoach()">✓ اعتماد المدرب</button></div>`:''}
      `:`<div class="empty">لم تُدخل بيانات مدرب بعد</div>`}
    </div>

    <div class="sec">
      <h2>⚽ اللاعبون (${(players||[]).length})</h2>
      ${!players||!players.length?'<div class="empty">لا يوجد لاعبون مُدخلون بعد</div>':players.map(p=>`
        <div class="player-row">
          ${p.jersey_photo_url?`<img class="jersey" src="${p.jersey_photo_url}">`:'<div class="jersey"></div>'}
          <div style="flex:1">
            <b>${p.is_goalkeeper?'🧤 ':''}#${p.number??'—'} ${p.full_name_ar||p.name}</b>
            <div style="font-size:12px;color:#8b949e">${p.nationality||'—'}</div>
          </div>
          <span class="badge ${p.submission_status==='approved'?'b-approved':'b-pending'}">${p.submission_status==='approved'?'معتمد':'بانتظار'}</span>
          <button class="doc-link" onclick="viewDocs('${p.id}','${p.id_photo_url||''}','${p.passport_photo_url||''}')">🪪 الوثائق</button>
          ${p.submission_status!=='approved'?`<button class="btn-app" onclick="approvePlayer('${p.id}')">✓ اعتماد</button>`:''}
          <button class="btn-rej" onclick="rejectPlayer('${p.id}')">✕ حذف</button>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('content').innerHTML=html;
}

async function approveCoach(){
  await sb.from('teams').update({coach_status:'approved'}).eq('id',CUR.id);
  loadTeam();
}
async function approvePlayer(id){
  await sb.from('players').update({submission_status:'approved'}).eq('id',id);
  loadTeam();
}
async function rejectPlayer(id){
  if(!confirm('حذف هذا اللاعب نهائيًا؟'))return;
  await sb.from('players').delete().eq('id',id);
  loadTeam();
}
async function viewDocs(pid,idPath,passPath){
  if(idPath){const{data}=await sb.storage.from('team-docs').createSignedUrl(idPath,3600);if(data?.signedUrl)window.open(data.signedUrl,'_blank');}
  if(passPath){const{data}=await sb.storage.from('team-docs').createSignedUrl(passPath,3600);if(data?.signedUrl)setTimeout(()=>window.open(data.signedUrl,'_blank'),300);}
  if(!idPath&&!passPath)alert('لم تُرفع وثائق لهذا اللاعب');
}

window.loadTeam=loadTeam;window.approveCoach=approveCoach;window.approvePlayer=approvePlayer;window.rejectPlayer=rejectPlayer;window.viewDocs=viewDocs;
initTeams();
</script>
</body>
</html>
