<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="admin-icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<meta charset="UTF-8">

<title>مراجعة بيانات الفرق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Tajawal",sans-serif}
body{background:#0d1117;color:#e6edf3;direction:rtl;min-height:100vh;padding:20px}
.wrap{max-width:920px;margin:0 auto}
h1{font-size:20px;color:#c9a84c;margin-bottom:18px}
.team-sel{margin-bottom:20px}
select{width:100%;padding:10px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:14px;font-family:inherit}
.link-box{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;margin-bottom:20px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.link-box code{background:#0d1117;padding:4px 10px;border-radius:6px;color:#3fb950;direction:ltr;display:inline-block}
.copy-btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.sec{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:18px;margin-bottom:16px}
.sec h2{font-size:15px;color:#c9a84c;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:800}
.b-pending{background:rgba(255,193,7,.15);color:#ffc107}
.b-approved{background:rgba(63,185,80,.15);color:#3fb950}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;margin-bottom:12px}
.kv div{color:#b7c6dc}
.kv b{color:#e6edf3}
.docs{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.doc-link{background:#21262d;border:1px solid #30363d;padding:8px 14px;border-radius:8px;font-size:12px;color:#58a6ff;cursor:pointer}
.actions{display:flex;gap:10px}
.btn-app{background:#3fb950;color:#0d1117;font-weight:800;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px}
.btn-rej{background:#f85149;color:#fff;font-weight:800;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px}
.player-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #21262d}
.player-row img.jersey{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#21262d}
.empty{text-align:center;padding:30px;color:#8b949e;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>✅ مراجعة وتعديل بيانات الفرق</h1>
  <div class="team-sel">
    <select id="teamSel" onchange="loadTeam()"><option>اختر بطولة وفريق...</option></select>
  </div>
  <div id="content"></div>
</div>

<script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
let CUR=null;

async function initTeams(){
  const {data:teams,error:e1}=await sb.from('teams').select('id,name_ar,name,tournament_id,coach_status').order('name_ar');
  if(e1){document.getElementById('teamSel').outerHTML='<div class="empty">⚠️ فشل تحميل الفرق: '+e1.message+'</div>';return;}
  const {data:tours}=await sb.from('tournaments').select('id,name_ar,name');
  const tMap={};(tours||[]).forEach(t=>tMap[t.id]=t.name_ar||t.name||'');
  const sel=document.getElementById('teamSel');
  sel.innerHTML='<option value="">اختر فريقًا...</option>'+(teams||[]).map(t=>
    `<option value="${t.id}">${tMap[t.tournament_id]||''} — ${t.name_ar||t.name} ${t.coach_status==='pending'?'🟡':''}</option>`
  ).join('');
}

async function loadTeam(){
  const id=document.getElementById('teamSel').value;
  if(!id){document.getElementById('content').innerHTML='';return;}
  const {data:team}=await sb.from('teams').select('*').eq('id',id).single();
  CUR=team;
  const {data:players}=await sb.from('players').select('*').eq('team_id',id).order('is_goalkeeper',{ascending:false});

  const link=location.origin+location.pathname.replace('team-submissions-review.html','team-submit.html')+'?token='+team.submit_token;

  let adminDocUrl='',adminPhotoUrl=team.admin_photo_url||'';
  if(team.admin_doc_url){const{data}=await sb.storage.from('team-docs').createSignedUrl(team.admin_doc_url,3600);adminDocUrl=data?.signedUrl;}

  let coachIdUrl='',coachPhotoUrl=team.coach_photo_url||'';
  if(team.coach_id_url){const{data}=await sb.storage.from('team-docs').createSignedUrl(team.coach_id_url,3600);coachIdUrl=data?.signedUrl;}
  if(team.coach_passport_url){const{data}=await sb.storage.from('team-docs').createSignedUrl(team.coach_passport_url,3600);coachPassUrl=data?.signedUrl;}

  let html=`
    <div class="link-box">
      🔗 رابط الإدخال لهذا الفريق:
      <code id="linkTxt">${link}</code>
      <button class="copy-btn" onclick="navigator.clipboard.writeText('${link}');this.textContent='✅ نُسخ'">نسخ</button>
    </div>
    <div class="link-box">
      🔑 كود التحقق الخماسي (أرسله مع الرابط):
      <code style="font-size:18px;letter-spacing:4px">${team.access_code||'— لم يُحدَّد —'}</code>
      ${team.access_code?`<button class="copy-btn" onclick="navigator.clipboard.writeText('${team.access_code}');this.textContent='✅ نُسخ'">نسخ</button>`:''}
    </div>

    <div class="sec">
      <h2>🧑‍💼 الإداري</h2>
      ${(team.submitted_by_name||adminPhotoUrl||adminDocUrl)?`
      <div class="kv">
        <div>الاسم: <input id="adminNameEdit" value="${(team.submitted_by_name||'').replace(/"/g,'&quot;')}" style="width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:6px 8px;font-family:inherit"></div>
        <div>الجنسية: <input id="adminNatEdit" value="${(team.admin_nationality||'').replace(/"/g,'&quot;')}" style="width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:6px 8px;font-family:inherit"></div>
      </div>
      <div class="docs">
        ${adminDocUrl?`<a class="doc-link" href="${adminDocUrl}" target="_blank">🪪 الهوية/الجواز</a>`:''}
        ${adminPhotoUrl?`<a class="doc-link" href="${adminPhotoUrl}" target="_blank">📷 الصورة الفوتوغرافية</a><button class="btn-rej" onclick="clearAdminPhoto()">🗑️ حذف الصورة</button>`:''}
        <button class="btn-app" onclick="saveAdmin()">💾 حفظ التعديل</button>
      </div>
      `:'<div class="empty">لم تُدخل بيانات إداري بعد</div>'}
    </div>

    <div class="sec">
      <h2>🧑‍🏫 المدرب <span class="badge ${team.coach_status==='approved'?'b-approved':'b-pending'}">${team.coach_status==='approved'?'معتمد':'بانتظار المراجعة'}</span></h2>
      ${team.coach_name?`
      <div class="kv">
        <div>الاسم: <input id="coachNameEdit" value="${(team.coach_name||'').replace(/"/g,'&quot;')}" style="width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:6px 8px;font-family:inherit"></div>
        <div>الجنسية: <input id="coachNatEdit" value="${(team.coach_nationality||'').replace(/"/g,'&quot;')}" style="width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:6px 8px;font-family:inherit"></div>
        <div>أُدخلت بواسطة: <b>${team.submitted_by_name||'—'}</b></div>
      </div>
      <div class="docs">
        ${coachIdUrl?`<a class="doc-link" href="${coachIdUrl}" target="_blank">🪪 عرض الهوية/الجواز</a>`:''}
        ${coachPhotoUrl?`<a class="doc-link" href="${coachPhotoUrl}" target="_blank">📷 الصورة الفوتوغرافية</a>`:''}
        <button class="btn-app" onclick="saveCoach()">💾 حفظ التعديل</button>
      </div>
      ${team.coach_status!=='approved'?`<div class="actions"><button class="btn-app" onclick="approveCoach()">✓ اعتماد المدرب</button></div>`:''}
      `:`<div class="empty">لم تُدخل بيانات مدرب بعد</div>`}
    </div>

    <div class="sec">
      <h2>⚽ اللاعبون (${(players||[]).length})</h2>
      ${!players||!players.length?'<div class="empty">لا يوجد لاعبون مُدخلون بعد</div>':players.map(p=>`
        <div class="player-row" style="flex-wrap:wrap">
          <label style="cursor:pointer" title="اضغط لاستبدال الصورة">
            ${p.jersey_photo_url?`<img class="jersey" id="jimg-${p.id}" src="${p.jersey_photo_url}">`:`<div class="jersey" id="jimg-${p.id}" style="display:flex;align-items:center;justify-content:center">👤</div>`}
            <input type="file" accept="image/*" style="display:none" onchange="replacePhoto('${p.id}',this)">
          </label>
          <div style="flex:1;min-width:220px;display:flex;gap:8px;flex-wrap:wrap">
            <input id="pname-${p.id}" value="${(p.full_name_ar||p.name||'').replace(/"/g,'&quot;')}" placeholder="الاسم" style="flex:2;min-width:120px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:6px 8px;font-family:inherit">
            <input id="pnum-${p.id}" value="${p.number??''}" placeholder="#" style="width:50px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:6px 8px;font-family:inherit;text-align:center">
            <input id="pnat-${p.id}" value="${(p.nationality||'').replace(/"/g,'&quot;')}" placeholder="الجنسية" style="flex:1;min-width:90px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:6px 8px;font-family:inherit">
            <label style="font-size:12px;color:#ffd700;display:flex;align-items:center;gap:4px"><input type="checkbox" id="pgk-${p.id}" ${p.is_goalkeeper?'checked':''}> 🧤</label>
          </div>
          <span class="badge ${p.submission_status==='approved'?'b-approved':'b-pending'}">${p.submission_status==='approved'?'معتمد':'بانتظار'}</span>
          <button class="doc-link" onclick="viewDocs('${p.id_photo_url||''}')">🪪 الهوية/الجواز</button>
          <button class="btn-app" onclick="savePlayer('${p.id}')">💾 حفظ</button>
          ${p.submission_status!=='approved'?`<button class="btn-app" onclick="approvePlayer('${p.id}')">✓ اعتماد</button>`:''}
          <button class="btn-rej" onclick="rejectPlayer('${p.id}')">✕ حذف</button>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('content').innerHTML=html;
}

async function clearAdminPhoto(){
  if(!confirm('حذف الصورة الفوتوغرافية للإداري؟'))return;
  const {error}=await sb.from('teams').update({admin_photo_url:null}).eq('id',CUR.id);
  if(error){alert('فشل: '+error.message);return;}
  loadTeam();
}
async function saveAdmin(){
  const name=document.getElementById('adminNameEdit').value.trim();
  const nat=document.getElementById('adminNatEdit').value.trim();
  const {error}=await sb.from('teams').update({submitted_by_name:name||null,admin_nationality:nat||null}).eq('id',CUR.id);
  if(error){alert('فشل الحفظ: '+error.message);return;}
  loadTeam();
}
async function saveCoach(){
  const name=document.getElementById('coachNameEdit').value.trim();
  const nat=document.getElementById('coachNatEdit').value.trim();
  const {error}=await sb.from('teams').update({coach_name:name||null,coach_nationality:nat||null}).eq('id',CUR.id);
  if(error){alert('فشل الحفظ: '+error.message);return;}
  loadTeam();
}
async function savePlayer(id){
  const name=document.getElementById('pname-'+id).value.trim();
  const num=document.getElementById('pnum-'+id).value.trim();
  const nat=document.getElementById('pnat-'+id).value.trim();
  const gk=document.getElementById('pgk-'+id).checked;
  if(!name){alert('أدخل اسم اللاعب');return;}
  const {error}=await sb.from('players').update({
    name,full_name_ar:name,
    number:num?parseInt(num):null,
    nationality:nat||null,
    is_goalkeeper:gk
  }).eq('id',id);
  if(error){alert('فشل الحفظ: '+error.message);return;}
  loadTeam();
}
function resizeImageToDataUrl(file,maxSize){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=e=>{img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h){if(w>maxSize){h=Math.round(h*maxSize/w);w=maxSize}}else{if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize}}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/png',0.85));
    };img.onerror=reject;img.src=e.target.result};
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function replacePhoto(id,input){
  const f=input.files[0];
  if(!f)return;
  const el=document.getElementById('jimg-'+id);
  try{
    const dataUrl=await resizeImageToDataUrl(f,200);
    const {error}=await sb.from('players').update({jersey_photo_url:dataUrl}).eq('id',id);
    if(error){alert('فشل حفظ الصورة: '+error.message);return;}
    if(el.tagName==='IMG')el.src=dataUrl;else el.outerHTML=`<img class="jersey" id="jimg-${id}" src="${dataUrl}">`;
  }catch(err){alert('تعذرت قراءة الصورة');}
  input.value='';
}
async function approveCoach(){
  await sb.from('teams').update({coach_status:'approved'}).eq('id',CUR.id);
  loadTeam();
}
async function approvePlayer(id){
  await sb.from('players').update({submission_status:'approved'}).eq('id',id);
  loadTeam();
}
async function rejectPlayer(id){
  if(!confirm('حذف هذا اللاعب نهائيًا؟'))return;
  await sb.from('players').delete().eq('id',id);
  loadTeam();
}
async function viewDocs(docPath){
  if(!docPath){alert('لم تُرفع وثيقة هوية/جواز لهذا اللاعب');return;}
  const{data}=await sb.storage.from('team-docs').createSignedUrl(docPath,3600);
  if(data?.signedUrl)window.open(data.signedUrl,'_blank');
}

window.loadTeam=loadTeam;window.approveCoach=approveCoach;window.approvePlayer=approvePlayer;window.rejectPlayer=rejectPlayer;window.viewDocs=viewDocs;
window.saveAdmin=saveAdmin;window.clearAdminPhoto=clearAdminPhoto;window.saveCoach=saveCoach;window.savePlayer=savePlayer;window.replacePhoto=replacePhoto;
initTeams();
</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.update();
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller)
          window.location.reload();
      });
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
}
</script>
</body>
</html>
