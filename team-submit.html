<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدخال بيانات الفريق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Tajawal",sans-serif}
body{background:#0d1117;color:#e6edf3;direction:rtl;min-height:100vh;padding:20px}
.wrap{max-width:680px;margin:0 auto}
.hd{text-align:center;padding:20px 0 30px}
.hd h1{font-size:22px;color:#c9a84c;margin-bottom:6px}
.hd p{font-size:13px;color:#8b949e}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:20px;margin-bottom:18px}
.card h2{font-size:15px;color:#c9a84c;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:#b7c6dc;margin-bottom:5px}
.field input[type=text],.field select{width:100%;padding:10px 12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:14px;font-family:inherit}
.upload-box{border:2px dashed #30363d;border-radius:10px;padding:14px;text-align:center;cursor:pointer;font-size:13px;color:#8b949e;position:relative}
.upload-box.has-file{border-color:#3fb950;color:#3fb950}
.upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gk-check{display:flex;align-items:center;gap:8px;font-size:13px;color:#ffd700;margin-bottom:12px;cursor:pointer}
.player-card{background:#0d1117;border:1px solid #21262d;border-radius:12px;padding:16px;margin-bottom:14px;position:relative}
.player-card .pnum{position:absolute;top:-10px;right:14px;background:#c9a84c;color:#0d1117;font-size:11px;font-weight:800;padding:3px 10px;border-radius:10px}
.rm-player{position:absolute;top:10px;left:10px;background:none;border:none;color:#ff6b6b;font-size:13px;cursor:pointer}
.add-player-btn{width:100%;padding:12px;background:#21262d;border:1px dashed #3a4150;border-radius:10px;color:#c9a84c;font-weight:700;font-size:14px;cursor:pointer}
.submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,#c9a84c,#a8842e);border:none;border-radius:12px;color:#0d1117;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.msg{text-align:center;padding:12px;border-radius:10px;font-size:14px;font-weight:700;margin-top:14px}
.msg.ok{background:rgba(63,185,80,.12);color:#3fb950;border:1px solid rgba(63,185,80,.3)}
.msg.err{background:rgba(248,81,73,.12);color:#f85149;border:1px solid rgba(248,81,73,.3)}
.loader{text-align:center;padding:60px 0;color:#8b949e}
.progress{font-size:12px;color:#8b949e;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loader" id="loading">⏳ جاري التحقق من الرابط...</div>
</div>

<script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const qs=new URLSearchParams(location.search);
const TOKEN=qs.get('token');
let TEAM=null;
let playerCount=0;
const files={}; // key -> File

async function init(){
  if(!TOKEN){showErr('الرابط غير صحيح — تأكد من نسخ الرابط كاملًا.');return;}
  const {data,error}=await sb.from('teams').select('*').eq('submit_token',TOKEN).single();
  if(error||!data){showErr('لم يتم العثور على فريق مرتبط بهذا الرابط.');return;}
  TEAM=data;
  showCodeGate();
}

function showCodeGate(){
  document.getElementById('app').innerHTML=`
    <div class="hd">
      <h1>🔐 تأكيد الهوية</h1>
      <p>أدخل الكود المكوّن من 5 أرقام الذي أرسلته لك إدارة البطولة لفريق "${TEAM.name_ar||TEAM.name}"</p>
    </div>
    <div class="card">
      <div class="field">
        <label>كود الفريق (5 أرقام)</label>
        <input type="text" id="codeInput" maxlength="5" inputmode="numeric" style="font-size:24px;text-align:center;letter-spacing:8px" placeholder="00000">
      </div>
      <button type="button" class="submit-btn" onclick="checkCode()">دخول</button>
      <div id="codeMsg"></div>
    </div>
  `;
}

function checkCode(){
  const v=document.getElementById('codeInput').value.trim();
  const msg=document.getElementById('codeMsg');
  if(!TEAM.access_code){msg.innerHTML='<div class="msg err">⚠️ لم يُحدَّد كود لهذا الفريق بعد — تواصل مع إدارة البطولة</div>';return;}
  if(v===String(TEAM.access_code)){buildForm();}
  else{msg.innerHTML='<div class="msg err">❌ الكود غير صحيح — تأكد منه مرة أخرى</div>';}
}

function showErr(msg){
  document.getElementById('app').innerHTML=`<div class="loader">⚠️ ${msg}</div>`;
}

function esc(s){return (s??'').toString().replace(/"/g,'&quot;');}

let EXISTING_PLAYERS=[];

async function buildForm(){
  document.getElementById('app').innerHTML='<div class="loader">⏳ جاري تحميل بيانات الفريق الحالية...</div>';
  const {data:players}=await sb.from('players').select('*').eq('team_id',TEAM.id).order('created_at',{ascending:true});
  EXISTING_PLAYERS=players||[];

  document.getElementById('app').innerHTML=`
    <div class="hd">
      <h1>📋 إدخال بيانات ${TEAM.name_ar||TEAM.name}</h1>
      <p>يمكنك التعديل أو إضافة لاعبين في أي وقت قبل بداية البطولة</p>
    </div>

    <div class="card">
      <h2>🧑‍💼 بيانات الإداري</h2>
      <div class="row2">
        <div class="field"><label>اسم الإداري</label><input type="text" id="adminName" value="${esc(TEAM.submitted_by_name)}" placeholder="مثال: محمد أحمد"></div>
        <div class="field"><label>الجنسية</label><input type="text" id="adminNat" value="${esc(TEAM.admin_nationality)}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>صورة فوتوغرافية حديثة — تظهر للجمهور</label>${uploadBox('adminPhoto',TEAM.admin_photo_url)}</div>
        <div class="field"><label>صورة الهوية أو الجواز (خاصة، لا تظهر للجمهور)</label>${uploadBox('adminDoc',null,!!TEAM.admin_doc_url)}</div>
      </div>
    </div>

    <div class="card">
      <h2>🧑‍🏫 بيانات المدرب</h2>
      <div class="row2">
        <div class="field"><label>اسم المدرب</label><input type="text" id="coachName" value="${esc(TEAM.coach_name)}"></div>
        <div class="field"><label>الجنسية</label><input type="text" id="coachNat" value="${esc(TEAM.coach_nationality)}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>صورة فوتوغرافية حديثة — تظهر للجمهور</label>${uploadBox('coachPhoto',TEAM.coach_photo_url)}</div>
        <div class="field"><label>صورة الهوية أو الجواز (خاصة، لا تظهر للجمهور)</label>${uploadBox('coachDoc',null,!!TEAM.coach_id_url)}</div>
      </div>
    </div>

    <div id="playersWrap"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button type="button" class="add-player-btn" onclick="addPlayer()">➕ إضافة لاعب يدويًا</button>
      <button type="button" class="add-player-btn" style="border-color:#3fb950;color:#3fb950" onclick="document.getElementById('xlsxInput').click()">📊 استيراد من إكسل</button>
    </div>
    <div style="text-align:center;margin-top:8px">
      <a href="#" onclick="downloadTemplate();return false" style="font-size:12px;color:#58a6ff">⬇️ تحميل نموذج الإكسل الفارغ أولاً</a>
    </div>
    <input type="file" id="xlsxInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExcel(this)">
    <div id="xlsxMsg" style="font-size:12px;color:#8b949e;margin-top:8px;text-align:center"></div>

    <button type="button" class="submit-btn" id="submitBtn" onclick="submitAll()">💾 حفظ البيانات</button>
    <div id="msg"></div>
  `;
  playerCount=0;
  if(EXISTING_PLAYERS.length){
    EXISTING_PLAYERS.forEach(p=>addPlayer(false,p));
  }else{
    addPlayer(true);
  }
}

const clearedFields=new Set();

function uploadBox(key,previewUrl,uploadedFlag){
  const inner=previewUrl
    ? `<img src="${previewUrl}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;display:block;margin:0 auto 6px">📎 استبدال الصورة`
    : (uploadedFlag ? '✅ تم الرفع سابقاً — اضغط للاستبدال' : '📎 اضغط لرفع صورة');
  const cls=(previewUrl||uploadedFlag)?'upload-box has-file':'upload-box';
  const delBtn=(previewUrl||uploadedFlag)?`<button type="button" onclick="clearField('${key}')" style="display:block;width:100%;margin-top:6px;background:none;border:1px solid #ff6b6b;border-radius:8px;padding:6px;color:#ff6b6b;font-size:12px;cursor:pointer">🗑️ حذف الصورة</button>`:'';
  return `<div class="${cls}" id="${key}_box">
    <div id="${key}_inner">${inner}</div>
    <input type="file" accept="image/*" onchange="onFile('${key}',this)">
  </div>
  <div id="${key}_delwrap">${delBtn}</div>`;
}

function clearField(key){
  if(!confirm('حذف هذه الصورة نهائياً؟'))return;
  clearedFields.add(key);
  delete files[key];
  const box=document.getElementById(key+'_box');
  box.classList.remove('has-file');
  document.getElementById(key+'_inner').textContent='📎 اضغط لرفع صورة';
  document.getElementById(key+'_delwrap').innerHTML='';
}

function onFile(key,input){
  const f=input.files[0];
  if(!f)return;
  files[key]=f;
  clearedFields.delete(key);
  document.getElementById(key+'_box').classList.add('has-file');
  document.getElementById(key+'_inner').textContent='✅ '+f.name;
  document.getElementById(key+'_delwrap').innerHTML=`<button type="button" onclick="clearField('${key}')" style="display:block;width:100%;margin-top:6px;background:none;border:1px solid #ff6b6b;border-radius:8px;padding:6px;color:#ff6b6b;font-size:12px;cursor:pointer">🗑️ حذف الصورة</button>`;
}

function addPlayer(isFirst,existing){
  playerCount++;
  const n=playerCount;
  const div=document.createElement('div');
  div.className='player-card';
  div.id='player_'+n;
  if(existing&&existing.id)div.setAttribute('data-id',existing.id);
  const gkChecked=existing?existing.is_goalkeeper:isFirst;
  const removeBtn=existing&&existing.id
    ? `<button type="button" class="rm-player" onclick="deleteExistingPlayer(${n},'${existing.id}')">🗑️ حذف نهائي</button>`
    : (n>1?`<button type="button" class="rm-player" onclick="removePlayer(${n})">✕ إزالة</button>`:'');
  div.innerHTML=`
    <span class="pnum">لاعب ${n}</span>
    ${removeBtn}
    <label class="gk-check"><input type="checkbox" id="p${n}_gk" ${gkChecked?'checked':''}> 🧤 حارس مرمى</label>
    <div class="row2">
      <div class="field"><label>الاسم الكامل</label><input type="text" id="p${n}_name" value="${esc(existing?.name)}"></div>
      <div class="field"><label>الرقم</label><input type="text" id="p${n}_num" value="${esc(existing?.number)}"></div>
    </div>
    <div class="field"><label>الجنسية</label><input type="text" id="p${n}_nat" value="${esc(existing?.nationality)}"></div>
    <div class="row2">
      <div class="field"><label>صورة فوتوغرافية حديثة — تظهر للجمهور</label>${uploadBox('p'+n+'_jersey',existing?.jersey_photo_url)}</div>
      <div class="field"><label>صورة الهوية أو الجواز (خاصة، لا تظهر للجمهور)</label>${uploadBox('p'+n+'_doc',null,!!existing?.id_photo_url)}</div>
    </div>
  `;
  document.getElementById('playersWrap').appendChild(div);
}

async function deleteExistingPlayer(n,id){
  if(!confirm('حذف هذا اللاعب نهائيًا من قاعدة البيانات؟'))return;
  const {error}=await sb.from('players').delete().eq('id',id);
  if(error){alert('فشل الحذف: '+error.message);return;}
  document.getElementById('player_'+n)?.remove();
}
function downloadTemplate(){
  const data=[
    ['الاسم','الرقم','الجنسية','حارس مرمى'],
    ['أحمد عبدالله سالم',10,'إماراتي','لا'],
    ['محمد علي حسن',1,'مصري','نعم']
  ];
  const ws=XLSX.utils.aoa_to_sheet(data);
  ws['!cols']=[{wch:28},{wch:10},{wch:16},{wch:14}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'اللاعبون');
  XLSX.writeFile(wb,'نموذج-اللاعبين.xlsx');
}

function removePlayer(n){document.getElementById('player_'+n)?.remove();}

function importExcel(input){
  const f=input.files[0];
  if(!f)return;
  const xMsg=document.getElementById('xlsxMsg');
  xMsg.textContent='⏳ جاري القراءة...';
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});
      if(!rows.length){xMsg.textContent='⚠️ الملف فارغ';return;}

      const headers=Object.keys(rows[0]);
      const findCol=(...keys)=>headers.find(h=>keys.some(k=>h.toString().trim().toLowerCase().includes(k)));
      const colName=findCol('اسم','name');
      const colNum=findCol('رقم','number','no');
      const colNat=findCol('جنسي','nationality');
      const colGK=findCol('حارس','goalkeeper','gk');

      if(!colName){xMsg.textContent='⚠️ لم يتم العثور على عمود "الاسم" في الملف';return;}

      let added=0;
      rows.forEach(r=>{
        const name=(r[colName]||'').toString().trim();
        if(!name)return;
        addPlayer(false);
        const n=playerCount;
        document.getElementById('p'+n+'_name').value=name;
        if(colNum)document.getElementById('p'+n+'_num').value=(r[colNum]||'').toString().trim();
        if(colNat)document.getElementById('p'+n+'_nat').value=(r[colNat]||'').toString().trim();
        if(colGK){
          const v=(r[colGK]||'').toString().trim().toLowerCase();
          document.getElementById('p'+n+'_gk').checked=['نعم','yes','1','true','حارس'].includes(v);
        }
        added++;
      });
      xMsg.textContent=`✅ تم استيراد ${added} لاعبًا من الملف — راجع البيانات أدناه وأكمل الصور لكل لاعب`;
      document.getElementById('playersWrap').scrollIntoView({behavior:'smooth'});
    }catch(err){
      console.error(err);
      xMsg.textContent='❌ تعذرت قراءة الملف — تأكد أنه إكسل صحيح';
    }
  };
  reader.readAsArrayBuffer(f);
  input.value='';
}

async function uploadFile(key,bucket,pathPrefix){
  const f=files[key];
  if(!f)return null;
  const ext=f.name.split('.').pop();
  const path=`${pathPrefix}/${key}-${Date.now()}.${ext}`;
  const {error}=await sb.storage.from(bucket).upload(path,f);
  if(error){console.error(error);return null;}
  return path;
}

async function submitAll(){
  const btn=document.getElementById('submitBtn');
  const msg=document.getElementById('msg');
  const adminName=document.getElementById('adminName').value.trim();
  if(!adminName){msg.innerHTML='<div class="msg err">⚠️ يرجى كتابة اسم الإداري أولاً</div>';return;}

  const playerCards=[...document.querySelectorAll('.player-card')];
  if(!playerCards.length){msg.innerHTML='<div class="msg err">⚠️ أضف لاعبًا واحدًا على الأقل</div>';return;}

  btn.disabled=true;
  const prefix='team-'+TEAM.id;
  msg.innerHTML='<div class="progress">⏳ جاري رفع الملفات وحفظ البيانات...</div>';

  const teamUpdate={
    submitted_by_name:adminName,
    admin_nationality:document.getElementById('adminNat').value.trim()||null,
    coach_name:document.getElementById('coachName').value.trim()||null,
    coach_nationality:document.getElementById('coachNat').value.trim()||null,
    coach_status:'pending'
  };
  if(files['adminDoc']){
    const p=await uploadFile('adminDoc','team-docs',prefix);
    if(p)teamUpdate.admin_doc_url=p;
  }else if(clearedFields.has('adminDoc')){teamUpdate.admin_doc_url=null;}
  if(files['adminPhoto']){
    const p=await uploadFile('adminPhoto','team-public',prefix);
    if(p){const {data}=sb.storage.from('team-public').getPublicUrl(p);teamUpdate.admin_photo_url=data?.publicUrl;}
  }else if(clearedFields.has('adminPhoto')){teamUpdate.admin_photo_url=null;}
  if(files['coachDoc']){
    const p=await uploadFile('coachDoc','team-docs',prefix);
    if(p)teamUpdate.coach_id_url=p;
  }else if(clearedFields.has('coachDoc')){teamUpdate.coach_id_url=null;}
  if(files['coachPhoto']){
    const p=await uploadFile('coachPhoto','team-public',prefix);
    if(p){const {data}=sb.storage.from('team-public').getPublicUrl(p);teamUpdate.coach_photo_url=data?.publicUrl;}
  }else if(clearedFields.has('coachPhoto')){teamUpdate.coach_photo_url=null;}

  const {error:teamErr}=await sb.from('teams').update(teamUpdate).eq('id',TEAM.id);
  if(teamErr){msg.innerHTML='<div class="msg err">❌ فشل حفظ بيانات المدرب: '+teamErr.message+'</div>';btn.disabled=false;return;}

  let ok=0,fail=0;
  for(const card of playerCards){
    const n=card.id.split('_')[1];
    const existingId=card.getAttribute('data-id');
    const name=document.getElementById('p'+n+'_name').value.trim();
    if(!name)continue;

    const payload={
      name,
      full_name_ar:name,
      number:parseInt(document.getElementById('p'+n+'_num').value)||null,
      nationality:document.getElementById('p'+n+'_nat').value.trim()||null,
      is_goalkeeper:document.getElementById('p'+n+'_gk').checked
    };
    if(files['p'+n+'_jersey']){
      const jp=await uploadFile('p'+n+'_jersey','team-public',prefix);
      if(jp){const {data}=sb.storage.from('team-public').getPublicUrl(jp);payload.jersey_photo_url=data?.publicUrl;}
    }else if(clearedFields.has('p'+n+'_jersey')){payload.jersey_photo_url=null;}
    if(files['p'+n+'_doc']){
      const dp=await uploadFile('p'+n+'_doc','team-docs',prefix);
      if(dp)payload.id_photo_url=dp;
    }else if(clearedFields.has('p'+n+'_doc')){payload.id_photo_url=null;}

    let error;
    if(existingId){
      payload.submission_status='pending';
      ({error}=await sb.from('players').update(payload).eq('id',existingId));
    }else{
      payload.tournament_id=TEAM.tournament_id;
      payload.team_id=TEAM.id;
      payload.submission_status='pending';
      ({error}=await sb.from('players').insert(payload));
    }
    if(error){fail++;console.error(error);}else ok++;
  }

  if(fail===0){
    msg.innerHTML=`<div class="msg ok">✅ تم حفظ بيانات ${ok} لاعبًا والإداري/المدرب بنجاح — يمكنك العودة والتعديل في أي وقت بنفس الرابط</div>`;
  }else{
    msg.innerHTML=`<div class="msg err">⚠️ تم حفظ ${ok} لاعبًا، وفشل ${fail} — أعد المحاولة لمن فشل</div>`;
  }
  btn.disabled=false;
}

init();
</script>
</body>
</html>
