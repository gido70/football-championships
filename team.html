<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة الفريق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Tajawal",sans-serif;background:#F5F3EE;color:#2C2C2A;direction:rtl;min-height:100vh}
.nav{background:#FFFFFF;border-bottom:1px solid #EDEAE0;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-team{font-size:17px;font-weight:800;color:#2C2C2A;display:flex;align-items:center;gap:10px}
.nav-back{color:#79786A;text-decoration:none;font-size:14px;font-weight:600;padding:7px 16px;border-radius:8px;border:1px solid #E0DCCF;transition:.2s}
.nav-back:hover{background:#EDEAE0;color:#2C2C2A}

/* HERO */
.hero{padding:48px 24px 36px;text-align:center;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(13,17,23,.1),rgba(13,17,23,.95))}
.hero-content{position:relative;z-index:1}
.team-initial{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:white;margin:0 auto 16px;border:3px solid rgba(255,255,255,.2);box-shadow:0 8px 32px rgba(0,0,0,.5)}
.team-name{font-size:clamp(22px,4vw,40px);font-weight:900;color:white;margin-bottom:8px;text-shadow:0 2px 16px rgba(0,0,0,.5)}
.team-group{font-size:14px;color:rgba(255,255,255,.55);margin-bottom:24px}
.team-stats{display:flex;justify-content:center;gap:0;flex-wrap:wrap}
.ts{text-align:center;padding:0 24px;border-left:1px solid rgba(255,255,255,.12)}
.ts:last-child{border-left:none}
.ts-num{font-size:32px;font-weight:900;line-height:1}
.ts-lbl{font-size:12px;color:rgba(255,255,255,.45);margin-top:4px}

/* TABS */
.tabs-bar{background:#FFFFFF;border-bottom:1px solid #EDEAE0;overflow-x:auto}
.tabs{max-width:1000px;margin:0 auto;display:flex;padding:0 20px}
.tab{padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;border:none;background:transparent;color:#79786A;transition:.2s;border-bottom:3px solid transparent;white-space:nowrap;font-family:"Tajawal",sans-serif}
.tab.active{color:var(--tc,#c9a84c);border-bottom-color:var(--tc,#c9a84c)}
.tab:hover:not(.active){color:#2C2C2A}

/* MAIN */
.main{max-width:1000px;margin:0 auto;padding:28px 20px}
.sec-hd{font-size:16px;font-weight:800;color:#2C2C2A;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #EDEAE0;display:flex;align-items:center;gap:8px}

/* بطاقات اللاعبين */
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px}
@media(max-width:480px){.players-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.player-card{background:#FFFFFF;border:1px solid #E0DCCF;border-radius:14px;padding:18px 14px;text-align:center;transition:.15s;position:relative;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.05)}
.player-card::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:var(--tc,#c9a84c)}
.player-card:hover{border-color:var(--tc,#c9a84c);background:#EDEAE0;transform:translateY(-3px);box-shadow:0 6px 0 rgba(0,0,0,.08),0 10px 22px rgba(0,0,0,.08)}
.player-card:active{transform:translateY(0);box-shadow:0 1px 0 rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05)}
.player-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #FFFFFF;box-shadow:0 0 0 2px var(--tc,#c9a84c),0 4px 10px rgba(0,0,0,.12);margin:0 auto 10px;display:block}
.player-ph{width:72px;height:72px;border-radius:50%;background:#EDEAE0;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px;border:3px solid #FFFFFF;box-shadow:0 0 0 2px var(--tc,#c9a84c),0 4px 10px rgba(0,0,0,.12)}
.player-number{position:absolute;top:10px;left:10px;background:var(--tc,#c9a84c);color:#2C2C2A;font-size:12px;font-weight:900;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.player-name{font-size:14px;font-weight:700;color:#2C2C2A;margin-bottom:4px;line-height:1.3}
.player-nat{font-size:12px;color:#79786A;margin-top:2px}

/* إحصائيات اللاعبين */
.stats-table{background:#FFFFFF;border:1px solid #E0DCCF;border-radius:14px;overflow:hidden}
.stats-table table{width:100%;border-collapse:collapse}
.stats-table th{padding:11px 14px;text-align:right;font-size:12px;font-weight:700;color:#79786A;background:#F5F3EE;border-bottom:1px solid #EDEAE0}
.stats-table td{padding:11px 14px;border-bottom:1px solid #EDEAE0;font-size:14px;vertical-align:middle}
.stats-table tr:last-child td{border-bottom:none}
.stats-table tr:hover td{background:rgba(0,0,0,.025)}
.player-cell{display:flex;align-items:center;gap:10px}
.player-mini-photo{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid #E0DCCF}
.player-mini-ph{width:34px;height:34px;border-radius:50%;background:#EDEAE0;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid #E0DCCF;flex-shrink:0}
.stat-num{font-weight:800;font-size:16px}
.stat-goals{color:#f85149}
.stat-yellow{color:#f0e68c}
.stat-red{color:#f85149}

.empty{text-align:center;padding:48px 20px;color:#79786A}
.empty span{font-size:48px;display:block;margin-bottom:12px;opacity:.35}
.tc{display:none}.tc.active{display:block}

/* مباريات الفريق */
.match-item{background:#FFFFFF;border:1px solid #E0DCCF;border-radius:12px;padding:14px 16px;margin-bottom:8px;transition:.2s}
.match-item:hover{border-color:#E0DCCF;background:#EDEAE0}
.match-top{display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px;color:#79786A}
.match-score-row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.mt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#2C2C2A}
.mt.current{color:var(--tc,#c9a84c)}
.mt.away{flex-direction:row-reverse}
.mt-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ms-center{text-align:center}
.ms-nums{font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:center}
.ms-sep{color:#E0DCCF;font-size:18px}
.m-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700}
.b-done{background:rgba(63,185,80,.15);color:#3fb950;border:1px solid rgba(63,185,80,.2)}
.b-sched{background:#EDEAE0;color:#79786A}
.b-live{background:#f85149;color:white}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-team" id="navTeam">الفريق</div>
  <a href="javascript:history.back()" class="nav-back" id="backBtn">← رجوع للبطولة</a>
</nav>

<div class="hero" id="hero">
  <div class="hero-bg" id="heroBg" style="background:linear-gradient(135deg,#1a1a2e,#0f3460)"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="team-initial" id="teamInitial" style="background:rgba(255,255,255,.1)">؟</div>
    <div class="team-name" id="teamName">جاري التحميل...</div>
    <div class="team-group" id="teamGroup"></div>
    <div class="team-stats">
      <div class="ts"><div class="ts-num" id="tsP" style="color:#c9a84c">—</div><div class="ts-lbl">لاعب</div></div>
      <div class="ts"><div class="ts-num" id="tsM" style="color:#3fb950">—</div><div class="ts-lbl">مباراة</div></div>
      <div class="ts"><div class="ts-num" id="tsG" style="color:#f85149">—</div><div class="ts-lbl">هدف سجله</div></div>
      <div class="ts"><div class="ts-num" id="tsGA" style="color:#79786A">—</div><div class="ts-lbl">هدف استقبله</div></div>
    </div>
  </div>
</div>

<div class="tabs-bar">
  <div class="tabs" id="tabsRow">
    <button class="tab active" onclick="showTab(this,'squad')">👥 القائمة</button>
    <button class="tab" onclick="showTab(this,'stats')">📊 الإحصائيات</button>
    <button class="tab" onclick="showTab(this,'matches')">📅 المباريات</button>
  </div>
</div>

<div class="main">
  <div class="tc active" id="tc-squad">
    <div class="sec-hd">👥 قائمة الفريق</div>
    <div class="players-grid" id="squadGrid">
      <div style="background:#FFFFFF;border-radius:14px;height:160px;animation:sh 1.5s infinite" class="skeleton"></div>
    </div>
  </div>
  <div class="tc" id="tc-stats">
    <div class="sec-hd">📊 إحصائيات اللاعبين</div>
    <div class="stats-table" id="statsTable"></div>
  </div>
  <div class="tc" id="tc-matches">
    <div class="sec-hd">📅 مباريات الفريق</div>
    <div id="matchesList"></div>
  </div>
</div>

<style>
.skeleton{background:linear-gradient(90deg,#FFFFFF 25%,#EDEAE0 50%,#FFFFFF 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:14px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>

<script>
const sb=supabase.createClient("https://npoowwdjpbvhyjrmeqkv.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wb293d2RqcGJ2aHlqcm1lcWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NDM4MzYsImV4cCI6MjA4OTMxOTgzNn0.8Ii2TUvDDRr_L61WVTEQkgOl9VhAyO6ywoLmUUAadgY");
const TID=new URLSearchParams(location.search).get('id');
let teamColor='#c9a84c';
let teamData=null;

function showTab(btn,name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tc').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tc-'+name).classList.add('active');
}

async function loadTeam(){
  if(!TID)return;
  const {data:t}=await sb.from('teams').select('*').eq('id',TID).single();
  if(!t)return;
  teamData=t;
  const name=t.name_ar||t.name||'الفريق';
  const color=t.primary_color||t.color_primary||'#c9a84c';
  teamColor=color;

  document.title=name;
  document.getElementById('navTeam').textContent=name;
  document.getElementById('teamName').textContent=name;
  document.getElementById('teamGroup').textContent=t.group_code?'المجموعة '+t.group_code:'';
  document.getElementById('heroBg').style.background=`linear-gradient(135deg,${color},${t.secondary_color||'#1a1a2e'})`;
  document.getElementById('teamInitial').style.background=`rgba(255,255,255,.15)`;
  document.getElementById('teamInitial').textContent=name.charAt(0);

  // تطبيق لون الفريق على التبويبات
  document.getElementById('tabsRow').style.setProperty('--tc',color);
  document.querySelectorAll('.player-card,.match-item').forEach(el=>el.style.setProperty('--tc',color));
}

async function loadSquad(){
  const {data:players}=await sb.from('players')
    .select('*')
    .eq('team_id',TID)
    .order('number');

  document.getElementById('tsP').textContent=players?.length||0;
  if(!players||!players.length){
    document.getElementById('squadGrid').innerHTML='<div class="empty"><span>👥</span><p>لا يوجد لاعبون</p></div>';
    return;
  }

  const roleLabel={admin:'إداري',coach:'مدرب'};

  document.getElementById('squadGrid').innerHTML=players.map(p=>{
    const name=p.full_name_ar||p.name||'—';
    const num=p.number||p.shirt_number||'';
    const role=p.role||'player_resident';
    const photo=p.jersey_photo_url||null;
    const subtitle=roleLabel[role]||p.nationality||'';
    return `<div class="player-card" style="--tc:${teamColor}">
      ${num?`<div class="player-number">${num}</div>`:''}
      ${photo
        ? `<img class="player-photo" src="${photo}" alt="${name}" onerror="this.outerHTML='<div class=player-ph>👤</div>'">`
        : '<div class="player-ph">👤</div>'}
      <div class="player-name">${name}</div>
      <div class="player-nat">${subtitle}</div>
    </div>`;
  }).join('');
}

async function loadStats(){
  // نحمل أحداث المباريات لهذا الفريق
  const {data:evts}=await sb.from('match_events')
    .select('player_id,event_type')
    .eq('team_id',TID);

  const {data:players}=await sb.from('players').select('*').eq('team_id',TID).order('number');
  if(!players||!players.length){
    document.getElementById('statsTable').innerHTML='<div class="empty"><span>📊</span><p>لا توجد إحصائيات بعد</p></div>';
    return;
  }

  const stats={};
  players.forEach(p=>{stats[p.id]={...p,goals:0,yellow:0,red:0};});
  (evts||[]).forEach(e=>{
    if(!stats[e.player_id])return;
    if(e.event_type==='goal')stats[e.player_id].goals++;
    if(e.event_type==='yellow_card')stats[e.player_id].yellow++;
    if(e.event_type==='red_card')stats[e.player_id].red++;
  });

  document.getElementById('tsG').textContent=Object.values(stats).reduce((a,p)=>a+p.goals,0);

  const sorted=Object.values(stats).sort((a,b)=>b.goals-a.goals||(a.number||99)-(b.number||99));
  document.getElementById('statsTable').innerHTML=`<table>
    <thead><tr><th>#</th><th>اللاعب</th><th>⚽ أهداف</th><th>🟨 صفراء</th><th>🟥 حمراء</th></tr></thead>
    <tbody>${sorted.map(p=>{
      const name=p.full_name_ar||p.name||'—';
      const photo=p.jersey_photo_url||null;
      return `<tr>
        <td style="color:#79786A">${p.number||p.shirt_number||'—'}</td>
        <td><div class="player-cell">
          ${photo?`<img class="player-mini-photo" src="${photo}" onerror="this.outerHTML='<div class=player-mini-ph>👤</div>'">`:'<div class="player-mini-ph">👤</div>'}
          <span>${name}</span>
        </div></td>
        <td><span class="stat-num stat-goals">${p.goals||0}</span></td>
        <td><span class="stat-num stat-yellow">${p.yellow||0}</span></td>
        <td><span class="stat-num stat-red">${p.red||0}</span></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

async function loadMatches(){
  const {data:matches}=await sb.from('matches')
    .select('*')
    .or(`home_team_id.eq.${TID},away_team_id.eq.${TID}`)
    .order('match_no');

  const {data:teams}=await sb.from('teams').select('id,name,name_ar,primary_color,color_primary')
    .eq('tournament_id',teamData?.tournament_id||'');

  const tm={};(teams||[]).forEach(t=>{tm[t.id]=t;});

  // إحصائيات الفريق
  let gf=0,ga=0,mp=0;
  (matches||[]).forEach(m=>{
    if(m.status!=='completed')return;
    mp++;
    if(m.home_team_id===TID){gf+=m.home_score||0;ga+=m.away_score||0;}
    else{gf+=m.away_score||0;ga+=m.home_score||0;}
  });
  document.getElementById('tsM').textContent=mp;
  document.getElementById('tsGA').textContent=ga;

  if(!matches||!matches.length){
    document.getElementById('matchesList').innerHTML='<div class="empty"><span>📅</span><p>لا توجد مباريات بعد</p></div>';
    return;
  }

  const sl={scheduled:'b-sched',live:'b-live',completed:'b-done'};
  const sl2={scheduled:'مجدولة',live:'🔴 مباشر',completed:'منتهية'};

  document.getElementById('matchesList').innerHTML=matches.map(m=>{
    const isHome=m.home_team_id===TID;
    const opp=tm[isHome?m.away_team_id:m.home_team_id]||{};
    const oppName=opp.name_ar||opp.name||'؟';
    const oppColor=opp.primary_color||opp.color_primary||'#79786A';
    const myScore=isHome?(m.home_score??'–'):(m.away_score??'–');
    const theirScore=isHome?(m.away_score??'–'):(m.home_score??'–');
    const d=m.status==='completed';

    return `<div class="match-item" style="--tc:${teamColor}">
      <div class="match-top">
        <span>${m.round_name||''} ${m.group_code?'— المجموعة '+m.group_code:''}</span>
        <span class="m-badge ${sl[m.status]||'b-sched'}">${sl2[m.status]||m.status}</span>
      </div>
      <div class="match-score-row">
        <div class="mt ${isHome?'current':''}">
          <div class="mt-dot" style="background:${isHome?teamColor:oppColor}"></div>
          ${isHome?'الفريق (أنت)':oppName}
        </div>
        <div class="ms-center">
          <div class="ms-nums">
            <span>${d?myScore:'–'}</span><span class="ms-sep">:</span><span>${d?theirScore:'–'}</span>
          </div>
        </div>
        <div class="mt away ${!isHome?'current':''}">
          ${!isHome?'الفريق (أنت)':oppName}
          <div class="mt-dot" style="background:${!isHome?teamColor:oppColor}"></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function init(){
  // تحديد رابط الرجوع للبطولة
  const ref = document.referrer;
  const backBtn = document.getElementById('backBtn');
  if(ref && ref.includes('tournament.html')){
    backBtn.href = ref;
  }
  await loadTeam();
  await loadSquad();
  await loadStats();
  await loadMatches();
}

init();
</script>
</body>
</html>
