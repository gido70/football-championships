<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة الفرق</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  font-family: Arial;
  background: #0b1c2c;
  color: white;
  padding: 20px;
}

.container {
  max-width: 900px;
  margin: auto;
}

.card {
  background: #132f4c;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

input, select, button {
  padding: 10px;
  margin: 5px;
  border-radius: 6px;
  border: none;
}

button {
  background: #3a8cff;
  color: white;
  cursor: pointer;
}

.counter {
  margin-top: 10px;
  color: #ffd54f;
}
</style>
</head>

<body>
<div class="container">

<h2>إدارة الفرق</h2>

<div class="card">
  <label>اختر البطولة</label><br>
  <select id="tournamentSelect"></select>
</div>

<div class="card">
  <h3>إضافة فريق</h3>

  <input id="teamName" placeholder="اسم الفريق">
  <button onclick="addTeam()">إضافة</button>

  <div class="counter" id="counter"></div>
</div>

<div class="card">
  <h3>الفرق الحالية</h3>
  <ul id="teamsList"></ul>
</div>

</div>

<script>
const supabase = supabase.createClient(
  "https://YOUR_URL.supabase.co",
  "YOUR_ANON_KEY"
);

let selectedTournament = null;
let maxTeams = 0;

// تحميل البطولات
async function loadTournaments() {
  const { data } = await supabase.from("tournaments").select("*");

  const select = document.getElementById("tournamentSelect");

  data.forEach(t => {
    const option = document.createElement("option");
    option.value = t.id;
    option.textContent = t.name;
    select.appendChild(option);
  });

  select.onchange = () => {
    selectedTournament = select.value;
    const t = data.find(x => x.id === selectedTournament);
    maxTeams = t.team_count || 0;
    loadTeams();
  };

  // تشغيل أول بطولة تلقائي
  if (data.length) {
    selectedTournament = data[0].id;
    maxTeams = data[0].team_count || 0;
    loadTeams();
  }
}

// تحميل الفرق
async function loadTeams() {
  const { data } = await supabase
    .from("teams")
    .select("*")
    .eq("tournament_id", selectedTournament);

  const list = document.getElementById("teamsList");
  list.innerHTML = "";

  data.forEach(team => {
    const li = document.createElement("li");
    li.textContent = team.name;
    list.appendChild(li);
  });

  updateCounter(data.length);
}

// إضافة فريق
async function addTeam() {
  const name = document.getElementById("teamName").value;

  if (!name || !selectedTournament) return;

  const { data: existing } = await supabase
    .from("teams")
    .select("*")
    .eq("tournament_id", selectedTournament);

  if (existing.length >= maxTeams) {
    alert("تم الوصول للحد الأقصى من الفرق");
    return;
  }

  await supabase.from("teams").insert([
    {
      name: name,
      tournament_id: selectedTournament,
      is_active: true
    }
  ]);

  document.getElementById("teamName").value = "";
  loadTeams();
}

// تحديث العداد
function updateCounter(current) {
  document.getElementById("counter").innerText =
    `المطلوب: ${maxTeams} | الحالي: ${current} | المتبقي: ${maxTeams - current}`;
}

loadTournaments();
</script>

</body>
</html>
