<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة الفرق</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  font-family: Arial;
  background: #0b1c2c;
  color: white;
  padding: 20px;
}

.container {
  max-width: 900px;
  margin: auto;
}

.card {
  background: #132f4c;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

input, select, button {
  padding: 10px;
  margin: 5px;
  border-radius: 6px;
  border: none;
}

button {
  background: #3a8cff;
  color: white;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.counter {
  margin-top: 10px;
  color: #ffd54f;
  font-weight: bold;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  padding: 8px;
  background: #1c3b5c;
  margin-bottom: 5px;
  border-radius: 6px;
}
</style>
</head>

<body>

<div class="container">

<h2>إدارة الفرق</h2>

<!-- اختيار البطولة -->
<div class="card">
  <label>اختر البطولة</label><br>
  <select id="tournamentSelect"></select>
</div>

<!-- إضافة فريق -->
<div class="card">
  <h3>إضافة فريق</h3>

  <input id="teamName" placeholder="اسم الفريق">
  <button onclick="addTeam()">إضافة فريق</button>

  <div class="counter" id="counter"></div>
</div>

<!-- عرض الفرق -->
<div class="card">
  <h3>الفرق الحالية</h3>
  <ul id="teamsList"></ul>
</div>

</div>

<script>

// 🔥 ربط Supabase (جاهز)
const supabaseClient = supabase.createClient(
  "https://npoowwdjpbvhyjrmeqkv.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wb293d2RqcGJ2aHlqcm1lcWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NDM4MzYsImV4cCI6MjA4OTMxOTgzNn0.8Ii2TUvDDRr_L61WVTEQkgOl9VhAyO6ywoLmUUAadgY"
);

let selectedTournament = null;
let maxTeams = 0;

// تحميل البطولات
async function loadTournaments() {
  const { data, error } = await supabaseClient
    .from("tournaments")
    .select("*");

  const select = document.getElementById("tournamentSelect");
  select.innerHTML = "";

  data.forEach(t => {
    const option = document.createElement("option");
    option.value = t.id;
    option.textContent = t.name;
    select.appendChild(option);
  });

  select.onchange = () => {
    selectedTournament = select.value;

    const t = data.find(x => x.id === selectedTournament);
    maxTeams = t.team_count || 0;

    loadTeams();
  };

  if (data.length) {
    selectedTournament = data[0].id;
    maxTeams = data[0].team_count || 0;
    loadTeams();
  }
}

// تحميل الفرق
async function loadTeams() {
  const { data } = await supabaseClient
    .from("teams")
    .select("*")
    .eq("tournament_id", selectedTournament);

  const list = document.getElementById("teamsList");
  list.innerHTML = "";

  data.forEach(team => {
    const li = document.createElement("li");
    li.textContent = team.name;
    list.appendChild(li);
  });

  updateCounter(data.length);
}

// إضافة فريق
async function addTeam() {
  const name = document.getElementById("teamName").value;

  if (!name || !selectedTournament) {
    alert("أدخل اسم الفريق أولاً");
    return;
  }

  const { data: existing } = await supabaseClient
    .from("teams")
    .select("*")
    .eq("tournament_id", selectedTournament);

  if (existing.length >= maxTeams) {
    alert("تم الوصول للحد الأقصى من الفرق");
    return;
  }

  const { error } = await supabaseClient
    .from("teams")
    .insert([
      {
        name: name,
        tournament_id: selectedTournament,
        is_active: true
      }
    ]);

  if (error) {
    alert("خطأ: " + error.message);
    return;
  }

  document.getElementById("teamName").value = "";
  loadTeams();
}

// تحديث العداد
function updateCounter(current) {
  document.getElementById("counter").innerText =
    "المطلوب: " + maxTeams +
    " | الحالي: " + current +
    " | المتبقي: " + (maxTeams - current);
}

// تشغيل الصفحة
loadTournaments();

</script>

</body>
</html>
