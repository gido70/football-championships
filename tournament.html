<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Tajawal",sans-serif;background:#0d1117;color:#e6edf3;direction:rtl;min-height:100vh}
.nav{background:#161b22;border-bottom:1px solid #21262d;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-title{font-size:17px;font-weight:800;color:white;display:flex;align-items:center;gap:10px}
.nav-status{font-size:11px;padding:2px 10px;border-radius:20px;background:rgba(63,185,80,.15);color:#3fb950;border:1px solid rgba(63,185,80,.2);display:none}
.nav-back{color:#8b949e;text-decoration:none;font-size:14px;font-weight:600;padding:7px 16px;border-radius:8px;border:1px solid #30363d;transition:.2s}
.nav-back:hover{background:#21262d;color:white}
.hero{position:relative;overflow:hidden;padding:52px 24px 40px;text-align:center}
.hero-bg{position:absolute;inset:0}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(13,17,23,.2) 0%,rgba(13,17,23,.9) 100%)}
.hero-content{position:relative;z-index:1;display:flex;flex-direction:column;min-height:260px;align-items:stretch}
.hero-side-logo{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.8))}
.hero-logo{width:84px;height:84px;object-fit:contain;border-radius:50%;border:3px solid rgba(255,255,255,.25);margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.hero-logo-ph{font-size:68px;margin-bottom:16px;display:block}
.hero-title{font-size:clamp(26px,4vw,48px);font-weight:900;color:white;margin-bottom:8px;text-shadow:0 2px 16px rgba(0,0,0,.5)}
.hero-season{font-size:22px;font-weight:800;color:rgba(255,255,255,.9);margin-bottom:30px;letter-spacing:2px;background:rgba(255,255,255,.1);display:inline-block;padding:6px 24px;border-radius:30px;border:1px solid rgba(255,255,255,.2)}
.hero-stats{display:flex;justify-content:center;flex-wrap:wrap}
.hs{text-align:center;padding:0 24px;border-left:1px solid rgba(255,255,255,.12)}
.hs:last-child{border-left:none}
.hs-num{font-size:34px;font-weight:900;line-height:1}
.hs-lbl{font-size:12px;color:rgba(255,255,255,.45);margin-top:4px;letter-spacing:.5px}
.tabs-bar{background:#161b22;border-bottom:1px solid #21262d;position:sticky;top:58px;z-index:99;overflow-x:auto}
.tabs{max-width:1200px;margin:0 auto;display:flex;padding:0 20px}
.tab{padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;border:none;background:transparent;color:#8b949e;transition:.2s;border-bottom:3px solid transparent;white-space:nowrap;font-family:"Tajawal",sans-serif}
.tab.active{color:#c9a84c;border-bottom-color:#c9a84c}
.tab:hover:not(.active){color:#e6edf3}
.main{max-width:1200px;margin:0 auto;padding:28px 20px}
.sec-hd{font-size:16px;font-weight:800;color:#e6edf3;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:8px}
/* STANDINGS */
.st-wrap{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;margin-bottom:20px}
.g-title{background:#1c2128;padding:11px 18px;font-size:13px;font-weight:700;color:#c9a84c;letter-spacing:.5px;border-bottom:1px solid #30363d}
.st-table{width:100%;border-collapse:collapse}
.st-table th{padding:10px 14px;text-align:right;font-size:12px;font-weight:700;color:#8b949e;background:#0d1117;border-bottom:1px solid #21262d}
.st-table td{padding:12px 14px;border-bottom:1px solid #21262d;font-size:14px}
.st-table tr:last-child td{border-bottom:none}
.st-table tr:hover td{background:rgba(255,255,255,.02)}
.rk{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:#21262d;color:#8b949e}
.rk-1{background:linear-gradient(135deg,#f6d860,#c9a84c);color:#0d1117}
.rk-2{background:linear-gradient(135deg,#d4d4d4,#a3a3a3);color:#0d1117}
.rk-3{background:linear-gradient(135deg,#cd7f32,#8b4513);color:white}
.t-cell{display:flex;align-items:center;gap:10px}
.t-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.1)}
.t-name{font-weight:700;color:#e6edf3;font-size:15px}
.pts{font-weight:900;font-size:17px;color:#c9a84c}
.nc{color:#8b949e;font-size:14px}
.gd-p{color:#3fb950}.gd-n{color:#f85149}
/* MATCHES */
.m-group{margin-bottom:20px}
.m-round{font-size:12px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.m-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px 18px;margin-bottom:8px;transition:.2s}
.m-card:hover{border-color:#c9a84c;background:#1c2128}
.m-card.live{border-color:#f85149;background:rgba(248,81,73,.04)}
.m-top{display:flex;justify-content:space-between;margin-bottom:10px}
.m-info{font-size:12px;color:#8b949e}
.m-badge{font-size:11px;padding:2px 10px;border-radius:20px;font-weight:700}
.b-live{background:#f85149;color:white}
.b-done{background:rgba(63,185,80,.15);color:#3fb950;border:1px solid rgba(63,185,80,.2)}
.b-sched{background:#21262d;color:#8b949e}
.m-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.mt{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#e6edf3}
.mt.away{flex-direction:row-reverse}
.mt-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ms{text-align:center}
.ms-n{font-size:26px;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:center}
.ms-sep{color:#30363d;font-size:20px}
.ms-sub{font-size:12px;color:#8b949e;margin-top:4px}
/* SCORERS */
.sc-item{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:.2s}
.sc-item:hover{background:#1c2128}
.sc-rank{font-size:20px;font-weight:900;color:#c9a84c;min-width:28px;text-align:center}
.sc-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #30363d;flex-shrink:0}
.sc-ph{width:44px;height:44px;border-radius:50%;background:#21262d;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #30363d;flex-shrink:0}
.sc-info{flex:1}
.sc-name{font-size:15px;font-weight:800;color:#e6edf3}
.sc-team{font-size:12px;color:#8b949e;margin-top:2px;display:flex;align-items:center;gap:5px}
.sc-tdot{width:8px;height:8px;border-radius:50%}
.sc-g{text-align:center}
.sc-gn{font-size:26px;font-weight:900;color:#e6edf3;line-height:1}
.sc-gl{font-size:11px;color:#8b949e;margin-top:2px}
/* TEAMS */
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tm-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px 14px;text-align:center;text-decoration:none;display:block;transition:.2s;position:relative;overflow:hidden}
.tm-card::before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:var(--c,#c9a84c)}
.tm-card:hover{border-color:#c9a84c;transform:translateY(-3px)}
.tm-icon{font-size:38px;margin-bottom:10px;display:block}
.tm-name{font-size:14px;font-weight:800;color:#e6edf3;margin-bottom:4px}
.tm-cnt{font-size:13px;color:#8b949e}
/* SHARED */
.empty{text-align:center;padding:56px 20px;color:#8b949e}
.empty span{font-size:48px;display:block;margin-bottom:14px;opacity:.35}
.empty p{font-size:15px;line-height:1.8}
.skeleton{background:linear-gradient(90deg,#161b22 25%,#1c2128 50%,#161b22 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:12px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.tc{display:none}.tc.active{display:block}
/* إخفاء الصور المكسورة */
img[src=""], img:not([src]) { display:none !important; }
.hero-side-logo-ph { display:none !important; }
</style>
</head>

<script>
const sb=supabase.createClient("https://npoowwdjpbvhyjrmeqkv.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wb293d2RqcGJ2aHlqcm1lcWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NDM4MzYsImV4cCI6MjA4OTMxOTgzNn0.8Ii2TUvDDRr_L61WVTEQkgOl9VhAyO6ywoLmUUAadgY");

function showTab(btn,name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tc').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tc-'+name).classList.add('active');
}

async function loadTournament(){
  if(!TID)return;
  const {data:t,error:terr}=await sb.from('tournaments').select('*').eq('id',TID).single();
  if(terr||!t){
    document.getElementById('heroTitle').textContent='تعذر تحميل البطولة';
    return;
  }
  const name=t.name_ar||t.name||'البطولة';
  const p=t.primary_color||'#0b1f3a';
  const s=t.secondary_color||'#c9a84c';
  const season=t.season_label||'';

  document.title=name;
  document.getElementById('navName').textContent=name;
  document.getElementById('heroTitle').textContent=name;
  document.getElementById('heroSeason').textContent=season;
  document.documentElement.style.setProperty('--season-color',s);

  // حالة البطولة
  const ns=document.getElementById('navStatus');
  const sl={draft:'مسودة',active:'نشطة',completed:'منتهية',archived:'مؤرشفة'};
  if(t.status){
    ns.textContent=sl[t.status]||t.status;
    ns.style.display='inline';
    if(t.status==='active'){ns.style.background='rgba(63,185,80,.15)';ns.style.color='#3fb950';ns.style.border='1px solid rgba(63,185,80,.2)';}
    else if(t.status==='completed'){ns.style.background='rgba(88,166,255,.15)';ns.style.color='#58a6ff';ns.style.border='1px solid rgba(88,166,255,.2)';}
    else{ns.style.background='rgba(255,255,255,.08)';ns.style.color='#b7c6dc';}
  }

  // الخلفية — من GitHub مباشرة حسب الموسم
  const bgEl=document.getElementById('heroBg');
  const bgFile = season==='2027' ? 'bg_2027.jpg' : season==='2026' ? 'bg_2026.jpg' : '';
  if(bgFile){
    bgEl.style.backgroundImage=`url('https://gido70.github.io/football-championships/${bgFile}')`;
    bgEl.style.backgroundSize='cover';
    bgEl.style.backgroundPosition='center top';
  } else if(t.bg_image_url && !t.bg_image_url.startsWith('data:')){
    bgEl.style.backgroundImage=`url('${t.bg_image_url}')`;
    bgEl.style.backgroundSize='cover';
    bgEl.style.backgroundPosition='center top';
  } else {
    bgEl.style.background=`linear-gradient(135deg,${p},${s})`;
  }

  // شعار اللجنة (يسار) — من GitHub
  document.getElementById('committeeLogoWrap').innerHTML=
    `<img src="https://gido70.github.io/football-championships/logo_committee.png" class="hero-side-logo" alt="اللجنة"
      style="filter:drop-shadow(0 2px 8px rgba(0,0,0,.8)) brightness(1.2)"
      onerror="this.style.display='none'">`;

  // شعار الكأس (يمين) — من GitHub حسب الموسم
  const cupFile = season==='2027' ? 'logo_cup_2027.png' : 'logo_cup_2026.png';
  document.getElementById('cupLogoWrap').innerHTML=
    `<img src="https://gido70.github.io/football-championships/${cupFile}" class="hero-side-logo" alt="${name}"
      style="filter:drop-shadow(0 2px 8px rgba(0,0,0,.8))"
      onerror="this.style.display='none'">`;
}


async function loadStandings(){
  const {data:teams}=await sb.from('teams').select('*').eq('tournament_id',TID);
  const {data:matches}=await sb.from('matches').select('*').eq('tournament_id',TID).eq('status','completed');
  document.getElementById('hT').textContent=teams?.length||0;
  if(!teams||!teams.length){document.getElementById('stWrap').innerHTML='<div class="empty"><span>📊</span><p>لا يوجد ترتيب بعد<br>أضف الفرق وابدأ المباريات</p></div>';return;}
  const st={};
  teams.forEach(t=>{st[t.id]={t,p:0,w:0,d:0,l:0,gf:0,ga:0};  });
  (matches||[]).forEach(m=>{
    if(!st[m.home_team_id]||!st[m.away_team_id])return;
    const h=st[m.home_team_id],a=st[m.away_team_id],hs=m.home_score||0,as=m.away_score||0;
    h.p++;a.p++;h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
    if(hs>as){h.w++;a.l++;}else if(hs<as){a.w++;h.l++;}else{h.d++;a.d++;}
  });
  const grouped={};
  teams.forEach(t=>{const g=t.group_code||'عام';if(!grouped[g])grouped[g]=[];grouped[g].push(st[t.id]);});
  Object.values(grouped).forEach(arr=>arr.sort((a,b)=>((b.w*3+b.d)-(a.w*3+a.d))||((b.gf-b.ga)-(a.gf-a.ga))));
  let html='';
  Object.entries(grouped).sort().forEach(([grp,rows])=>{
    html+=`<div class="st-wrap"><div class="g-title">المجموعة ${grp}</div><table class="st-table"><thead><tr><th>#</th><th>الفريق</th><th title="لعب">ل</th><th title="فاز">ف</th><th title="تعادل">ت</th><th title="خسر">خ</th><th title="له">له</th><th title="عليه">عل</th><th title="الفارق">فق</th><th style="color:#c9a84c" title="النقاط">نق</th></tr></thead><tbody>`;
    rows.forEach((r,i)=>{
      const pts=r.w*3+r.d,gd=r.gf-r.ga,gc=gd>0?'gd-p':gd<0?'gd-n':'';
      html+=`<tr><td><span class="rk rk-${i+1}">${i+1}</span></td><td><div class="t-cell"><div class="t-dot" style="background:${r.t.color_primary||'#8b949e'}"></div><span class="t-name">${r.t.name}</span></div></td><td class="nc">${r.p}</td><td class="nc">${r.w}</td><td class="nc">${r.d}</td><td class="nc">${r.l}</td><td class="nc">${r.gf}</td><td class="nc">${r.ga}</td><td class="nc ${gc}">${gd>0?'+':''}${gd}</td><td><span class="pts">${pts}</span></td></tr>`;
    });
    html+='</tbody></table></div>';
  });
  document.getElementById('stWrap').innerHTML=html;
}

async function loadMatches(){
  // نحمل المباريات والفرق بشكل منفصل لتجنب مشاكل FK
  const {data:matches}=await sb.from('matches').select('*').eq('tournament_id',TID).order('match_no');
  const {data:teams}=await sb.from('teams').select('id,name,name_ar,primary_color,color_primary').eq('tournament_id',TID);
  document.getElementById('hM').textContent=matches?.length||0;
  if(!matches||!matches.length){document.getElementById('maWrap').innerHTML='<div class="empty"><span>📅</span><p>لا توجد مباريات بعد</p></div>';return;}
  
  // خريطة الفرق
  const tm={};
  (teams||[]).forEach(t=>{tm[t.id]=t;});
  
  const rl={group:'دور المجموعات',quarter_final:'ربع النهائي',semi_final:'نصف النهائي',third_place:'المركز الثالث',final:'النهائي'};
  const rounds={};
  matches.forEach(m=>{const r=m.round_name||'عام';if(!rounds[r])rounds[r]=[];rounds[r].push(m);});
  const sm={scheduled:'b-sched',live:'b-live',completed:'b-done'};
  const sl={scheduled:'مجدولة',live:'🔴 مباشر',completed:'منتهية'};
  let html='';
  Object.entries(rounds).forEach(([rnd,ms])=>{
    html+=`<div class="m-group"><div class="m-round">${rl[rnd]||rnd}</div>`;
    ms.forEach(m=>{
      const ht=tm[m.home_team_id]||{};
      const at=tm[m.away_team_id]||{};
      const d=m.status==='completed', lv=m.status==='live';
      const hName=ht.name_ar||ht.name||'؟';
      const aName=at.name_ar||at.name||'؟';
      const hColor=ht.primary_color||ht.color_primary||'#8b949e';
      const aColor=at.primary_color||at.color_primary||'#8b949e';
      html+=`<a class="m-card ${lv?'live':''}" href="match-live.html?id=${m.id}" style="display:block;cursor:pointer">
        <div class="m-top">
          <span class="m-info">${m.match_date?new Date(m.match_date).toLocaleDateString('ar-SA',{weekday:'short',month:'short',day:'numeric'}):''} ${m.match_time||''}</span>
          <span class="m-badge ${sm[m.status]||'b-sched'}">${sl[m.status]||m.status}</span>
        </div>
        <div class="m-teams">
          <div class="mt"><div class="mt-dot" style="background:${hColor}"></div>${hName}</div>
          <div class="ms">
            <div class="ms-n"><span>${d||lv?m.home_score??0:'–'}</span><span class="ms-sep">:</span><span>${d||lv?m.away_score??0:'–'}</span></div>
            ${lv?`<div class="ms-sub" style="color:#f85149">${m.match_minute||0}'</div>`:`<div class="ms-sub">${m.match_time||''}</div>`}
          </div>
          <div class="mt away">${aName}<div class="mt-dot" style="background:${aColor}"></div></div>
        </div>
      </a>`;
    });
    html+='</div>';
  });
  document.getElementById('maWrap').innerHTML=html;
}

async function loadScorers(){
  const {data:mids}=await sb.from('matches').select('id').eq('tournament_id',TID);
  if(!mids||!mids.length){document.getElementById('scWrap').innerHTML='<div class="empty"><span>⚽</span><p>لا توجد أهداف بعد</p></div>';return;}
  const {data:evts}=await sb.from('match_events').select('player_id,player:players!player_id(name,full_name_ar,photo_url),team:teams(name,name_ar,primary_color,color_primary)').eq('event_type','goal').in('match_id',mids.map(m=>m.id));
  let tot=0;const cnt={};
  (evts||[]).forEach(e=>{if(!e.player_id)return;tot++;if(!cnt[e.player_id])cnt[e.player_id]={name:e.player?.name||'—',photo:e.player?.photo_url,team:e.team?.name||'',col:e.team?.color_primary,g:0};cnt[e.player_id].g++;});
  document.getElementById('hG').textContent=tot;
  const sorted=Object.values(cnt).sort((a,b)=>b.g-a.g).slice(0,20);
  if(!sorted.length){document.getElementById('scWrap').innerHTML='<div class="empty"><span>⚽</span><p>لا توجد أهداف بعد</p></div>';return;}
  document.getElementById('scWrap').innerHTML='<div class="sec-hd">⚽ الهدافون</div>'+sorted.map((p,i)=>`
    <div class="sc-item">
      <div class="sc-rank">${i+1}</div>
      ${p.photo?`<img class="sc-photo" src="${p.photo}" alt="" onerror="this.outerHTML='<div class=sc-ph>👤</div>'">`:'<div class="sc-ph">👤</div>'}
      <div class="sc-info"><div class="sc-name">${p.name}</div><div class="sc-team"><div class="sc-tdot" style="background:${p.col||'#8b949e'}"></div>${p.team}</div></div>
      <div class="sc-g"><div class="sc-gn">${p.g}</div><div class="sc-gl">هدف</div></div>
    </div>`).join('');
}

async function loadTeams(){
  const {data}=await sb.from('teams').select('*').eq('tournament_id',TID).order('name');
  if(!data||!data.length){document.getElementById('tmWrap').innerHTML='<div class="empty"><span>👥</span><p>لا توجد فرق بعد</p></div>';return;}
  const {data:pl}=await sb.from('players').select('team_id,tournament_id').eq('tournament_id',TID);
  const cnt={};(pl||[]).forEach(p=>{cnt[p.team_id]=(cnt[p.team_id]||0)+1;});
  document.getElementById('hP').textContent=pl?.length||0;
  document.getElementById('tmWrap').innerHTML='<div class="sec-hd">👥 الفرق</div><div class="tm-grid">'+data.map(t=>`
    <a class="tm-card" href="team.html?id=${t.id}" style="--c:${t.primary_color||t.color_primary||'#c9a84c'}">
      <span class="tm-icon">⚽</span>
      <div class="tm-name">${t.name_ar||t.name}</div>
      <div class="tm-cnt">${cnt[t.id]||0} لاعب</div>
    </a>`).join('')+'</div>';
}

sb.channel('rt-t').on('postgres_changes',{event:'*',schema:'public',table:'matches',filter:`tournament_id=eq.${TID}`},()=>{loadMatches();loadStandings();}).subscribe();
if(TID){loadTournament();loadStandings();loadMatches();loadScorers();loadTeams();}
else document.getElementById('heroTitle').textContent='لم يتم تحديد البطولة — ارجع للصفحة الرئيسية';
</script>
