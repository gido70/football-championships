<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البطولة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Tajawal",sans-serif;font-size:16px;background:#f0f4f8;color:#1a1a2e;direction:rtl}
.nav{background:#1a1a2e;height:60px;position:sticky;top:0;z-index:100;border-bottom:3px solid #c9a84c}
.nav-inner{max-width:1300px;margin:0 auto;height:100%;display:flex;align-items:center;padding:0 28px;justify-content:space-between}
.nav-logo{font-size:20px;font-weight:900;color:white;text-decoration:none;display:flex;align-items:center;gap:8px}
.nav-logo em{color:#c9a84c;font-style:normal}
.nav-back{color:rgba(255,255,255,.75);text-decoration:none;font-size:15px;font-weight:600;padding:7px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.15);transition:.2s}
.nav-back:hover{background:rgba(255,255,255,.1);color:white}
.t-hero{padding:48px 24px 36px;text-align:center;position:relative;overflow:hidden}
.t-hero-inner{max-width:800px;margin:0 auto;position:relative}
.t-logo-big{width:90px;height:90px;object-fit:contain;margin-bottom:16px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.5))}
.t-logo-ph{font-size:72px;margin-bottom:16px}
.t-title{font-size:clamp(28px,4vw,48px);font-weight:900;color:white;margin-bottom:8px}
.t-season{font-size:16px;color:rgba(255,255,255,.6);margin-bottom:24px}
.t-stats-row{display:flex;gap:32px;justify-content:center;flex-wrap:wrap}
.t-stat{text-align:center}
.t-stat-num{font-size:32px;font-weight:900;color:#c9a84c}
.t-stat-lbl{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px}
.main{max-width:1200px;margin:0 auto;padding:32px 20px}
.tabs{display:flex;gap:4px;margin-bottom:28px;background:white;border-radius:12px;padding:6px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow-x:auto}
.tab{padding:10px 20px;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;border:none;background:transparent;color:#666;transition:.2s;white-space:nowrap;font-family:"Tajawal",sans-serif}
.tab.active{background:#1a1a2e;color:white}
.tab:hover:not(.active){background:#f0f4f8}
.section-hd{font-size:18px;font-weight:800;color:#1a1a2e;margin-bottom:18px;padding-right:14px;border-right:4px solid #c9a84c;display:flex;align-items:center;gap:10px}
/* الترتيب */
.standings-card{background:white;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden;margin-bottom:28px}
.standings-group-title{background:#1a1a2e;color:white;padding:12px 20px;font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;padding:11px 14px;text-align:right;font-size:13px;font-weight:700;color:#666;border-bottom:1px solid #eee}
td{padding:11px 14px;border-bottom:1px solid #f0f4f8;font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.rank-num{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:#f0f4f8;color:#1a1a2e}
.rank-1{background:#c9a84c;color:white}
.rank-2{background:#aaa;color:white}
.rank-3{background:#cd7f32;color:white}
.team-cell{display:flex;align-items:center;gap:10px}
.team-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.pts{font-weight:800;font-size:16px;color:#1a1a2e}
/* المباريات */
.match-card{background:white;border-radius:14px;padding:18px 20px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.match-meta{font-size:12px;color:#999;margin-bottom:12px;display:flex;justify-content:space-between}
.match-score{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.ms-team{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#1a1a2e}
.ms-team.away{flex-direction:row-reverse;text-align:left}
.ms-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ms-score{text-align:center}
.ms-nums{font-size:28px;font-weight:900;color:#1a1a2e;display:flex;align-items:center;gap:8px;justify-content:center}
.ms-sep{color:#ccc;font-weight:300}
.ms-badge{font-size:11px;padding:3px 10px;border-radius:20px;margin-top:6px;display:inline-block}
.badge-live{background:#fff0f0;color:#e53e3e;font-weight:700}
.badge-done{background:#f0fff4;color:#38a169}
.badge-sched{background:#f7f7f7;color:#999}
/* الهدافون */
.scorer-card{background:white;border-radius:14px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.scorer-rank{font-size:22px;font-weight:900;color:#c9a84c;width:32px;text-align:center}
.scorer-photo{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #eee}
.scorer-ph{width:48px;height:48px;border-radius:50%;background:#f0f4f8;display:flex;align-items:center;justify-content:center;font-size:22px}
.scorer-info{flex:1}
.scorer-name{font-size:15px;font-weight:800;color:#1a1a2e}
.scorer-team{font-size:13px;color:#888;margin-top:2px}
.scorer-goals{font-size:24px;font-weight:900;color:#1a1a2e}
.scorer-goals span{font-size:12px;color:#888;font-weight:400}
/* الفرق */
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.team-card{background:white;border-radius:14px;padding:20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;transition:.2s;text-decoration:none;display:block}
.team-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.team-card-color{height:6px;border-radius:3px;width:48px;margin:0 auto 14px}
.team-card-name{font-size:15px;font-weight:800;color:#1a1a2e}
.team-card-count{font-size:13px;color:#888;margin-top:4px}
.tab-content{display:none}.tab-content.active{display:block}
.empty{text-align:center;padding:48px;color:#aaa}
.empty-icon{font-size:48px;opacity:.4;margin-bottom:12px}
.skeleton{background:linear-gradient(90deg,#eee 25%,#f9f9f9 50%,#eee 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:14px;height:80px;margin-bottom:10px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">🏆 <em>بطولاتي</em></a>
    <a href="index.html" class="nav-back">← العودة</a>
  </div>
</nav>

<div id="heroSection" class="t-hero">
  <div class="t-hero-inner">
    <div id="heroLogo" class="t-logo-ph">🏆</div>
    <div class="t-title" id="heroTitle">جاري التحميل...</div>
    <div class="t-season" id="heroSeason"></div>
    <div class="t-stats-row">
      <div class="t-stat"><div class="t-stat-num" id="heroTeams">—</div><div class="t-stat-lbl">فريق</div></div>
      <div class="t-stat"><div class="t-stat-num" id="heroMatches">—</div><div class="t-stat-lbl">مباراة</div></div>
      <div class="t-stat"><div class="t-stat-num" id="heroPlayers">—</div><div class="t-stat-lbl">لاعب</div></div>
      <div class="t-stat"><div class="t-stat-num" id="heroGoals">—</div><div class="t-stat-lbl">هدف</div></div>
    </div>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab active" onclick="showTab('standings')">🏅 الترتيب</button>
    <button class="tab" onclick="showTab('matches')">📅 المباريات</button>
    <button class="tab" onclick="showTab('scorers')">⚽ الهدافون</button>
    <button class="tab" onclick="showTab('teams')">👥 الفرق</button>
  </div>

  <div class="tab-content active" id="tab-standings">
    <div id="standingsContainer"><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>
  <div class="tab-content" id="tab-matches">
    <div id="matchesContainer"><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>
  <div class="tab-content" id="tab-scorers">
    <div id="scorersContainer"><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>
  <div class="tab-content" id="tab-teams">
    <div id="teamsContainer"><div class="skeleton"></div></div>
  </div>
</div>

<script>
const SURL="https://npoowwdjpbvhyjrmeqkv.supabase.co";
const SKEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wb293d2RqcGJ2aHlqcm1lcWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NDM4MzYsImV4cCI6MjA4OTMxOTgzNn0.8Ii2TUvDDRr_L61WVTEQkgOl9VhAyO6ywoLmUUAadgY";
const sb=supabase.createClient(SURL,SKEY);

const params=new URLSearchParams(location.search);
const TID=params.get('id');
if(!TID){document.getElementById('heroTitle').textContent='لم يتم تحديد البطولة';}

function showTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const names=['standings','matches','scorers','teams'];
    t.classList.toggle('active',names[i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}

async function loadTournament(){
  const {data:t}=await sb.from('tournaments').select('*').eq('id',TID).single();
  if(!t)return;
  document.title=t.name;
  document.getElementById('heroTitle').textContent=t.name;
  document.getElementById('heroSeason').textContent=t.season_label||'';
  const bg=`linear-gradient(135deg,${t.primary_color||'#1a1a2e'},${t.secondary_color||'#0f3460'})`;
  document.getElementById('heroSection').style.background=bg;
  if(t.logo_url){
    document.getElementById('heroLogo').outerHTML=`<img class="t-logo-big" src="${t.logo_url}" alt="${t.name}" id="heroLogo">`;
  }
}

async function loadStandings(){
  const {data:teams}=await sb.from('teams').select('*').eq('tournament_id',TID);
  const {data:matches}=await sb.from('matches').select('*').eq('tournament_id',TID).eq('status','completed');

  if(!teams||!teams.length){
    document.getElementById('standingsContainer').innerHTML='<div class="empty"><div class="empty-icon">📊</div><p>لا يوجد ترتيب بعد</p></div>';
    document.getElementById('heroTeams').textContent=0;
    return;
  }
  document.getElementById('heroTeams').textContent=teams.length;

  // حساب الترتيب
  const stats={};
  teams.forEach(t=>{stats[t.id]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0};});
  (matches||[]).forEach(m=>{
    if(stats[m.home_team_id]&&stats[m.away_team_id]){
      const h=stats[m.home_team_id],a=stats[m.away_team_id];
      const hs=m.home_score||0,as=m.away_score||0;
      h.p++;a.p++;h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
      if(hs>as){h.w++;a.l++;}else if(hs<as){a.w++;h.l++;}else{h.d++;a.d++;}
    }
  });

  const grouped={};
  teams.forEach(t=>{const g=t.group_code||'—';if(!grouped[g])grouped[g]=[];grouped[g].push(stats[t.id]);});
  Object.values(grouped).forEach(arr=>arr.sort((a,b)=>(b.w*3+b.d)-(a.w*3+a.d)||(b.gf-b.ga)-(a.gf-a.ga)));

  let html='';
  Object.entries(grouped).sort().forEach(([grp,rows])=>{
    html+=`<div class="standings-card"><div class="standings-group-title">المجموعة ${grp}</div><table><thead><tr><th>#</th><th>الفريق</th><th>ل</th><th>ف</th><th>ت</th><th>خ</th><th>لع</th><th>لم</th><th>ف</th><th>ن</th></tr></thead><tbody>`;
    rows.forEach((r,i)=>{
      const pts=r.w*3+r.d;
      html+=`<tr><td><span class="rank-num rank-${i+1}">${i+1}</span></td>
        <td><div class="team-cell"><div class="team-dot" style="background:${r.team.color_primary||'#ccc'}"></div>${r.team.name}</div></td>
        <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
        <td>${r.gf}</td><td>${r.ga}</td><td>${r.gf-r.ga}</td>
        <td><strong class="pts">${pts}</strong></td></tr>`;
    });
    html+='</tbody></table></div>';
  });
  document.getElementById('standingsContainer').innerHTML=html||'<div class="empty"><div class="empty-icon">📊</div><p>لا يوجد ترتيب بعد</p></div>';
}

async function loadMatches(){
  const {data}=await sb.from('matches')
    .select('*,home_team:teams!matches_home_team_id_fkey(name,color_primary),away_team:teams!matches_away_team_id_fkey(name,color_primary)')
    .eq('tournament_id',TID).order('match_no');
  document.getElementById('heroMatches').textContent=data?.length||0;
  if(!data||!data.length){document.getElementById('matchesContainer').innerHTML='<div class="empty"><div class="empty-icon">📅</div><p>لا توجد مباريات بعد</p></div>';return;}
  const statusMap={scheduled:'badge-sched',live:'badge-live',completed:'badge-done'};
  const statusLbl={scheduled:'مجدولة',live:'🔴 مباشر',completed:'منتهية'};
  document.getElementById('matchesContainer').innerHTML=data.map(m=>`
    <div class="match-card">
      <div class="match-meta"><span>${m.round_name||''} ${m.group_code?'— المجموعة '+m.group_code:''}</span><span>${m.match_date||''} ${m.match_time||''}</span></div>
      <div class="match-score">
        <div class="ms-team"><div class="ms-dot" style="background:${m.home_team?.color_primary||'#ccc'}"></div>${m.home_team?.name||'؟'}</div>
        <div class="ms-score">
          <div class="ms-nums">${m.status==='scheduled'?'—':(m.home_score??0)}<span class="ms-sep">:</span>${m.status==='scheduled'?'—':(m.away_score??0)}</div>
          <span class="ms-badge ${statusMap[m.status]||'badge-sched'}">${statusLbl[m.status]||m.status}</span>
        </div>
        <div class="ms-team away"><div class="ms-dot" style="background:${m.away_team?.color_primary||'#ccc'}"></div>${m.away_team?.name||'؟'}</div>
      </div>
    </div>`).join('');
}

async function loadScorers(){
  const {data:evts}=await sb.from('match_events')
    .select('player_id,player:players(id,name,photo_url,team_id),team:teams(name,color_primary)')
    .eq('event_type','goal')
    .in('match_id',(await sb.from('matches').select('id').eq('tournament_id',TID)).data?.map(m=>m.id)||[]);

  let totalGoals=0;
  const counts={};
  (evts||[]).forEach(e=>{
    if(!e.player_id)return;
    totalGoals++;
    if(!counts[e.player_id])counts[e.player_id]={name:e.player?.name||'—',photo:e.player?.photo_url,team:e.team?.name||'',teamColor:e.team?.color_primary,goals:0};
    counts[e.player_id].goals++;
  });
  document.getElementById('heroGoals').textContent=totalGoals;
  const sorted=Object.values(counts).sort((a,b)=>b.goals-a.goals).slice(0,20);
  if(!sorted.length){document.getElementById('scorersContainer').innerHTML='<div class="empty"><div class="empty-icon">⚽</div><p>لا توجد أهداف بعد</p></div>';return;}
  document.getElementById('scorersContainer').innerHTML=`<div class="section-hd">⚽ الهدافون</div>`+sorted.map((p,i)=>`
    <div class="scorer-card">
      <div class="scorer-rank">${i+1}</div>
      ${p.photo?`<img class="scorer-photo" src="${p.photo}" alt="">`:`<div class="scorer-ph">👤</div>`}
      <div class="scorer-info">
        <div class="scorer-name">${p.name}</div>
        <div class="scorer-team">${p.team}</div>
      </div>
      <div class="scorer-goals">${p.goals} <span>هدف</span></div>
    </div>`).join('');
}

async function loadTeams(){
  const {data}=await sb.from('teams').select('*').eq('tournament_id',TID).order('name');
  if(!data||!data.length){document.getElementById('teamsContainer').innerHTML='<div class="empty"><div class="empty-icon">👥</div><p>لا توجد فرق بعد</p></div>';return;}
  const counts={};
  const {data:players}=await sb.from('players').select('team_id').eq('tournament_id',TID);
  (players||[]).forEach(p=>{counts[p.team_id]=(counts[p.team_id]||0)+1;});
  document.getElementById('heroPlayers').textContent=players?.length||0;
  document.getElementById('teamsContainer').innerHTML='<div class="teams-grid">'+data.map(t=>`
    <a class="team-card" href="team.html?id=${t.id}">
      <div class="team-card-color" style="background:${t.color_primary||'#c9a84c'}"></div>
      <div class="team-card-name">${t.name}</div>
      <div class="team-card-count">${counts[t.id]||0} لاعب</div>
    </a>`).join('')+'</div>';
}

// Realtime
sb.channel('t-'+TID)
  .on('postgres_changes',{event:'*',schema:'public',table:'matches',filter:`tournament_id=eq.${TID}`},()=>{loadMatches();loadStandings();})
  .subscribe();

if(TID){loadTournament();loadStandings();loadMatches();loadScorers();loadTeams();}
</script>
</body>
</html>
