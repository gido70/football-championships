<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<meta charset="UTF-8">

<title>إدارة الفيديوهات</title>
<link rel="stylesheet" href="admin.css">
<style>
.vid-list{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.vid-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden}
.vid-thumb{width:100%;height:120px;object-fit:cover;background:#0d1117;display:block}
.vid-thumb-ph{width:100%;height:120px;background:#0d1117;display:flex;align-items:center;justify-content:center;font-size:34px;color:#30363d}
.vid-body{padding:12px}
.vid-title{font-weight:800;font-size:14px;margin-bottom:4px}
.vid-type{font-size:11px;color:#8b949e;margin-bottom:8px}
.vid-actions{display:flex;gap:6px}
.vid-del{flex:1;background:rgba(248,81,73,.15);border:1px solid rgba(248,81,73,.3);border-radius:8px;padding:6px;font-size:12px;cursor:pointer;color:#f85149}
.vid-open{flex:1;background:rgba(88,166,255,.15);border:1px solid rgba(88,166,255,.3);border-radius:8px;padding:6px;font-size:12px;cursor:pointer;color:#58a6ff;text-decoration:none;text-align:center;display:block}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="page-head">
    <div class="page-icon">🎬</div>
    <div class="page-title"><h1>إدارة الفيديوهات</h1><p>روابط يوتيوب أو mp4 تظهر في صفحة البطولة العامة</p></div>
  </div>
  <div class="nav-actions">
    <a class="btn secondary" href="./admin-home.html">← لوحة الأدمن</a>
    <a class="btn secondary" href="./index.html" target="_blank">الموقع العام ↗</a>
  </div>
</div></header>

<main class="container">
  <section class="panel">
    <h3>اختر البطولة</h3>
    <div class="form-grid"><div class="field full"><label>البطولة</label>
      <select id="tSel"></select>
    </div></div>
  </section>

  <section class="panel" style="margin-top:20px">
    <h3>➕ إضافة فيديو جديد</h3>
    <div class="form-grid">
      <div class="field full"><label>العنوان</label>
        <input type="text" id="titleInput" placeholder="مثال: ملخص المباراة النهائية">
      </div>
      <div class="field"><label>نوع الفيديو</label>
        <select id="typeInput">
          <option value="youtube">رابط يوتيوب</option>
          <option value="mp4">رابط فيديو مباشر (mp4)</option>
        </select>
      </div>
      <div class="field"><label>رابط الفيديو</label>
        <input type="text" id="urlInput" placeholder="https://youtu.be/... أو رابط mp4" dir="ltr">
      </div>
      <div class="field full"><label>الصورة المصغّرة (اختياري)</label>
        <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap">
          <label style="display:inline-flex;align-items:center;gap:6px;background:rgba(78,161,255,.15);border:1px solid rgba(78,161,255,.3);color:#58a6ff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit">
            📁 اختر صورة من الجهاز
            <input type="file" id="thumbFile" accept="image/*" style="display:none">
          </label>
        </div>
        <div id="thumbSuccessBox" style="display:none;align-items:center;gap:12px;background:rgba(63,185,80,.12);border:1.5px solid #3fb950;border-radius:10px;padding:10px 14px;margin-bottom:8px">
          <img id="thumbPreview" style="width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid #3fb950;flex-shrink:0">
          <div style="flex:1">
            <div style="color:#3fb950;font-weight:800;font-size:13px">✅ تم تجهيز الصورة بنجاح</div>
            <div id="thumbFileName" style="font-size:11px;color:#8b949e;margin-top:2px"></div>
          </div>
          <button type="button" id="thumbClearBtn" onclick="clearThumbFile()" style="background:none;border:1px solid #f85149;color:#f85149;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0">✕ مسح</button>
        </div>
        <input type="text" id="thumbInput" placeholder="أو الصق رابط صورة مباشرة: https://..." dir="ltr">
      </div>
      <div class="field full"><label>وصف مختصر (اختياري)</label>
        <textarea id="descInput" placeholder="مثال: تغطية المؤتمر الصحفي وقرعة البطولة"></textarea>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="addBtn">💾 إضافة الفيديو</button>
    </div>
    <div class="status" id="addMsg"></div>
  </section>

  <section class="panel" style="margin-top:20px">
    <h3>📼 الفيديوهات المضافة <span id="countBadge" style="font-size:12px;color:#8b949e;font-weight:400"></span></h3>
    <div id="vidList" class="vid-list"><div class="status">جاري التحميل...</div></div>
  </section>
</main>

<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
let TID=null;

function setMsg(t,c=''){const e=document.getElementById('addMsg');e.className='status '+c;e.textContent=t;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

async function initTournaments(){
  const {data}=await sb.from('tournaments').select('*').order('created_at',{ascending:false});
  const sel=document.getElementById('tSel');
  sel.innerHTML=(data||[]).map(t=>`<option value="${t.id}">${t.name_ar||t.name}${t.season_label?' - '+t.season_label:''}</option>`).join('');
  sel.onchange=()=>{TID=sel.value;loadVideos();};
  if(data?.length){TID=data[0].id;loadVideos();}
}

async function loadVideos(){
  if(!TID)return;
  const {data}=await sb.from('videos').select('*').eq('tournament_id',TID).order('created_at',{ascending:false});
  const list=document.getElementById('vidList');
  document.getElementById('countBadge').textContent='('+((data||[]).length)+' فيديو)';
  if(!data?.length){list.innerHTML='<div class="empty" style="padding:24px;text-align:center;color:#6e7b8f;grid-column:1/-1">لا توجد فيديوهات بعد — أضف أول فيديو من الأعلى</div>';return;}
  list.innerHTML=data.map(v=>`
    <div class="vid-card">
      ${v.thumbnail_url?`<img class="vid-thumb" src="${v.thumbnail_url}" alt="${esc(v.title)}">`:'<div class="vid-thumb-ph">🎬</div>'}
      <div class="vid-body">
        <div class="vid-title">${esc(v.title)}</div>
        <div class="vid-type">${v.video_type==='youtube'?'▶️ يوتيوب':'🎞️ فيديو مباشر'}</div>
        <div class="vid-actions">
          <a class="vid-open" href="${v.video_url}" target="_blank">فتح</a>
          <button class="vid-del" onclick="deleteVideo('${v.id}')">حذف</button>
        </div>
      </div>
    </div>
  `).join('');
}

function resizeImageToDataUrl(file,maxSize){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=e=>{img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h){if(w>maxSize){h=Math.round(h*maxSize/w);w=maxSize}}else{if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize}}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',0.8));
    };img.onerror=reject;img.src=e.target.result};
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

let uploadedThumbDataUrl=null;
document.getElementById('thumbFile').onchange=async function(){
  const f=this.files[0];
  if(!f)return;
  document.getElementById('thumbSuccessBox').style.display='flex';
  document.getElementById('thumbFileName').textContent='⏳ جاري المعالجة...';
  try{
    uploadedThumbDataUrl=await resizeImageToDataUrl(f,480);
    document.getElementById('thumbFileName').textContent=f.name+' — جاهزة للحفظ مع الفيديو';
    document.getElementById('thumbInput').value='';
    document.getElementById('thumbInput').disabled=true;
    document.getElementById('thumbInput').placeholder='تم اختيار صورة من الجهاز — امسح الاختيار لاستخدام رابط بدلاً منها';
    document.getElementById('thumbPreview').src=uploadedThumbDataUrl;
  }catch(err){
    uploadedThumbDataUrl=null;
    document.getElementById('thumbSuccessBox').style.display='none';
    setMsg('⚠️ تعذّرت قراءة الصورة، جرّب صورة أخرى','warn');
  }
};

function clearThumbFile(){
  uploadedThumbDataUrl=null;
  document.getElementById('thumbFile').value='';
  document.getElementById('thumbSuccessBox').style.display='none';
  document.getElementById('thumbInput').disabled=false;
  document.getElementById('thumbInput').placeholder='أو الصق رابط صورة مباشرة: https://...';
}
window.clearThumbFile=clearThumbFile;

document.getElementById('addBtn').onclick=async()=>{
  const title=document.getElementById('titleInput').value.trim();
  const video_type=document.getElementById('typeInput').value;
  const video_url=document.getElementById('urlInput').value.trim();
  const thumbnail_url=uploadedThumbDataUrl||document.getElementById('thumbInput').value.trim()||null;
  const description=document.getElementById('descInput').value.trim()||null;
  if(!TID){setMsg('⚠️ اختر بطولة أولاً','warn');return;}
  if(!title||!video_url){setMsg('⚠️ العنوان والرابط مطلوبان','warn');return;}
  const {error}=await sb.from('videos').insert({tournament_id:TID,title,video_type,video_url,thumbnail_url,description});
  if(error){setMsg('❌ فشل الحفظ: '+error.message,'err');return;}
  document.getElementById('titleInput').value='';
  document.getElementById('urlInput').value='';
  document.getElementById('thumbInput').value='';
  document.getElementById('thumbInput').disabled=false;
  document.getElementById('thumbInput').placeholder='أو الصق رابط صورة مباشرة: https://...';
  document.getElementById('thumbSuccessBox').style.display='none';
  uploadedThumbDataUrl=null;
  document.getElementById('descInput').value='';
  setMsg('✅ تمت الإضافة','ok');
  loadVideos();
};

async function deleteVideo(id){
  if(!confirm('حذف هذا الفيديو نهائيًا؟'))return;
  await sb.from('videos').delete().eq('id',id);
  loadVideos();
}

window.deleteVideo=deleteVideo;
initTournaments();
</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.update();
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller)
          window.location.reload();
      });
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
}
</script>
</body>
</html>
