<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>فيديوهات البطولة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:"Tajawal",sans-serif;background:#0d1117;color:#e6edf3;direction:rtl;margin:0;min-height:100vh}
.nav{background:#161b22;border-bottom:1px solid #21262d;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.nav a{color:#8b949e;text-decoration:none;font-size:13px;border:1px solid #30363d;padding:8px 16px;border-radius:20px;min-height:36px;display:inline-flex;align-items:center}
.wrap{max-width:100%;margin:0 auto;padding:20px 0 60px}
h1{font-size:19px;color:#c9a84c;margin:0 0 14px;padding:0 16px}

.carousel{display:grid;grid-template-columns:1fr;gap:14px;padding:4px 16px 14px}
.card{width:100%;background:#161b22;border:1px solid #21262d;border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s;padding:0;text-align:right;color:inherit;font-family:inherit;animation:fadeSlideUp .45s ease-out both}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card:hover{outline:2px solid #c9a84c}
.thumb-wrap{position:relative}
.thumb{width:100%;height:190px;object-fit:cover;display:block;background:#0d1117}
.thumb-ph{width:100%;height:190px;background:#0d1117;display:flex;align-items:center;justify-content:center;font-size:32px;color:#30363d}
.play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.play-icon{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.body{padding:12px 14px}
.title{font-weight:800;font-size:14px;margin-bottom:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc{font-size:12px;color:#8b949e;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty-note{text-align:center;color:#6e7b8f;padding:60px 0;font-size:13px}
.loading{text-align:center;color:#6e7b8f;padding:40px 0}

/* شاشات أعرض (تابلت/حاسوب): عمودان أو ثلاثة */
@media(min-width:600px){.carousel{grid-template-columns:repeat(2,1fr)}}
@media(min-width:920px){.carousel{grid-template-columns:repeat(3,1fr)}}
/* الهاتف بالوضع العرضي تحديداً: ثلاثة أعمدة دائماً بغض النظر عن العرض */
@media(orientation:landscape) and (max-width:920px){
  .carousel{grid-template-columns:repeat(3,1fr)}
  .thumb,.thumb-ph{height:110px}
  .body{padding:8px 10px}
  .title{font-size:12px;-webkit-line-clamp:1}
  .desc{display:none}
}

.player-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:999;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.player-overlay.open{display:flex}
.player-box{width:100%;max-width:820px}
.player-frame-wrap{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden}
.player-frame-wrap iframe,.player-frame-wrap video{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-meta{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:#e6edf3}
.player-title{font-weight:800;font-size:14px}
.player-actions{display:flex;gap:10px;align-items:center}
.player-actions a{color:#58a6ff;font-size:12px;text-decoration:none}
.player-home{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);color:#c9a84c!important;border-radius:8px;padding:8px 14px!important;font-size:13px!important;font-weight:800;text-decoration:none!important;min-height:38px;display:inline-flex;align-items:center}
.player-close{background:none;border:1px solid #30363d;color:#e6edf3;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;min-height:38px}
@media(max-width:480px){
  .wrap{padding:14px 10px 40px}
  .player-overlay{padding:8px}
  .player-meta{flex-wrap:wrap;gap:8px}
  .player-title{flex:1 1 100%;order:1}
  .player-actions{order:2;width:100%;justify-content:space-between}
}
.content-page .carousel{grid-template-columns:repeat(3,minmax(0,1fr));padding:0;gap:14px}
.content-page .card{border-radius:18px;border-color:var(--content-line);background:#fff;color:var(--content-ink);box-shadow:0 8px 22px rgba(12,48,78,.09)}
.content-page .card.featured{grid-column:span 2}
.content-page .thumb,.content-page .thumb-ph{height:auto;aspect-ratio:16/9}
.content-page .video-type{display:inline-flex;margin-bottom:7px;padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--theme-primary,#176b9a) 9%,#fff);color:var(--theme-primary,#176b9a);font-size:10px;font-weight:900}
.content-page .video-date{font-size:10.5px;color:var(--content-muted);margin-top:7px}
@media(max-width:760px){
  .content-page .carousel{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .content-page .card.featured{grid-column:span 2}
  .content-page .play-icon{width:40px;height:40px;font-size:15px}
  .content-page .body{padding:10px}
}
@media(max-width:340px){.content-page .carousel{grid-template-columns:1fr}.content-page .card.featured{grid-column:span 1}}
</style>
<link rel="stylesheet" href="tournament-theme.css?v=20260910-2">
<link rel="stylesheet" href="content-pages.css?v=20260910-1">
</head>
<body class="content-page">
<div class="nav"><span style="font-weight:800;color:#c9a84c">🎬 فيديوهات البطولة</span><a href="#" id="backLink" onclick="history.back();return false">‹ رجوع للبطولة</a></div>
<div class="wrap">
  <section class="content-hero">
    <div class="content-kicker">▶️ المركز الإعلامي</div>
    <h1 id="tourName">فيديوهات البطولة</h1>
    <div class="content-summary">ملخصات المباريات والمؤتمرات والمواد المرئية في مكتبة واحدة مرتبة من الأحدث.</div>
    <div class="content-count" id="videosCount">⏳ جاري الحصر...</div>
  </section>
  <div class="content-toolbar" id="videoFilters" style="display:none">
    <button class="filter-chip active" data-filter="all" onclick="setVideoFilter('all',this)">الكل</button>
    <button class="filter-chip" data-filter="matches" onclick="setVideoFilter('matches',this)">ملخصات المباريات</button>
    <button class="filter-chip" data-filter="media" onclick="setVideoFilter('media',this)">المركز الإعلامي</button>
  </div>
  <div id="app"><div class="loading">⏳ جاري التحميل...</div></div>
</div>

<div class="player-overlay" id="playerOverlay" onclick="if(event.target===this)closePlayer()">
  <div class="player-box">
    <div class="player-frame-wrap" id="playerFrameWrap"></div>
    <div class="player-meta">
      <div class="player-title" id="playerTitle"></div>
      <div class="player-actions">
        <a id="playerHomeLink" class="player-home" href="#">🏠 الرئيسية</a>
        <a id="playerExternalLink" href="#" target="_blank" rel="noopener">فتح في يوتيوب ↗</a>
        <button class="player-close" onclick="closePlayer()">✕ إغلاق</button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/supabase.min.js?v=20260910-1"></script>
<script src="supabase-config.js"></script>
<script src="tournament-scope.js?v=20260910-3"></script>
<script src="public-date.js?v=20260910-1"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const qs=new URLSearchParams(location.search);
const TID=qs.get('id')||qs.get('tid');
const scopeUrl=url=>window.TournamentScope?.scopedUrl(url)||url;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

function extractYoutubeId(url){
  const m=String(url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
  return m?m[1]:null;
}

let VIDEOS=[];
let videoFilter='all';
let visibleVideos=12;
async function load(){
  if(!TID){document.getElementById('app').innerHTML='<div class="empty-note">لم تُحدَّد بطولة</div>';return;}
  const backLink=document.getElementById('backLink');
  backLink.href=scopeUrl('tournament.html?id='+TID);
  backLink.removeAttribute('onclick');
  const [{data:t},{data:vidRows,error:videoError},{data:matchVids,error:matchVideoError}]=await Promise.all([
    sb.from('tournaments').select('name,primary_color,secondary_color,logo_url,cup_logo_url').eq('id',TID).single(),
    sb.from('videos').select('id,title,description,video_type,video_url,thumbnail_url,created_at').eq('tournament_id',TID).order('created_at',{ascending:false}),
    sb.from('matches').select('id,home_score,away_score,match_date,highlight_video_url,home_team_id,away_team_id').eq('tournament_id',TID).eq('status','completed').not('highlight_video_url','is',null)
  ]);
  window.TournamentScope?.applyTournamentTheme(t);
  document.getElementById('tourName').textContent=(t?.name||'البطولة')+' — الفيديوهات';
  let matchVideoItems=[];
  if(matchVids?.length){
    const {data:teams}=await sb.from('teams').select('id,name,name_ar').eq('tournament_id',TID);
    const tName=id=>teams?.find(t=>t.id===id)?.name_ar||teams?.find(t=>t.id===id)?.name||'';
    matchVideoItems=matchVids.map(m=>({
      id:'match-'+m.id,title:`ملخص: ${tName(m.home_team_id)} ${m.home_score}-${m.away_score} ${tName(m.away_team_id)}`,
      video_type:'youtube',video_url:m.highlight_video_url,description:'ملخص المباراة',created_at:m.match_date,_isMatch:true
    }));
  }
  if(videoError&&matchVideoError){document.getElementById('app').innerHTML='<div class="content-error">تعذر تحميل الفيديوهات مؤقتًا. أعد المحاولة بعد قليل.</div>';return;}
  VIDEOS=[...matchVideoItems,...(vidRows||[])].filter(v=>/^https:\/\//i.test(v.video_url||''))
    .sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  const app=document.getElementById('app');
  document.getElementById('videosCount').textContent=VIDEOS.length+' '+(VIDEOS.length===1?'فيديو':'فيديوهات');
  if(!VIDEOS.length){app.innerHTML='<div class="content-empty">🎬<br>لا توجد فيديوهات منشورة لهذه البطولة حتى الآن</div>';return;}
  document.getElementById('videoFilters').style.display='flex';
  renderVideos();
}

function filteredVideos(){
  if(videoFilter==='matches')return VIDEOS.filter(v=>v._isMatch);
  if(videoFilter==='media')return VIDEOS.filter(v=>!v._isMatch);
  return VIDEOS;
}
function renderVideos(){
  const filtered=filteredVideos();
  const shown=filtered.slice(0,visibleVideos);
  const app=document.getElementById('app');
  if(!shown.length){app.innerHTML='<div class="content-empty">لا توجد مواد في هذا القسم</div>';return;}
  app.innerHTML='<div class="carousel">'+shown.map((v,i)=>{
    const originalIndex=VIDEOS.indexOf(v);
    const yid=v.video_type==='youtube'?extractYoutubeId(v.video_url):null;
    const thumb=v.thumbnail_url||(yid?`https://i.ytimg.com/vi/${yid}/hqdefault.jpg`:'');
    const date=v.created_at?window.PublicDate.format(v.created_at,{year:true}):'';
    return `
    <button class="card content-card ${i===0?'featured':''}" onclick="openPlayer(${originalIndex})" style="animation-delay:${Math.min(i,8)*0.04}s">
      <div class="thumb-wrap">
        ${thumb?`<img class="thumb" src="${thumb}" alt="${esc(v.title)}" loading="lazy">`:'<div class="thumb-ph">🎬</div>'}
        <div class="play-badge"><div class="play-icon">▶</div></div>
      </div>
      <div class="body">
        <div class="video-type">${v._isMatch?'⚽ ملخص مباراة':'🎥 مادة إعلامية'}</div>
        <div class="title">${esc(v.title)}</div>
        ${v.description?`<div class="desc">${esc(v.description)}</div>`:''}
        ${date?`<div class="video-date">${date}</div>`:''}
      </div>
    </button>`}).join('')+'</div>'+
    (visibleVideos<filtered.length?'<button class="load-more" onclick="showMoreVideos()">عرض المزيد ('+(filtered.length-visibleVideos)+')</button>':'');
}
function setVideoFilter(filter,button){
  videoFilter=filter;visibleVideos=12;
  document.querySelectorAll('#videoFilters .filter-chip').forEach(x=>x.classList.toggle('active',x===button));
  renderVideos();
}
function showMoreVideos(){visibleVideos+=12;renderVideos();}

function openPlayer(i){
  const v=VIDEOS[i];
  const wrap=document.getElementById('playerFrameWrap');
  if(v.video_type==='youtube'){
    const yid=extractYoutubeId(v.video_url);
    wrap.innerHTML=yid
      ? `<iframe src="https://www.youtube.com/embed/${yid}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`
      : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b949e;font-size:13px">تعذّر تشغيل هذا الرابط داخلياً — استخدم "فتح في يوتيوب"</div>`;
  }else{
    wrap.innerHTML=`<video src="${v.video_url}" controls autoplay></video>`;
  }
  document.getElementById('playerTitle').textContent=v.title;
  document.getElementById('playerExternalLink').href=v.video_url;
  document.getElementById('playerExternalLink').textContent=v.video_type==='youtube'?'فتح في يوتيوب ↗':'فتح الرابط مباشرة ↗';
  document.getElementById('playerHomeLink').href=scopeUrl('tournament.html?id='+TID);
  document.getElementById('playerOverlay').classList.add('open');
}

function closePlayer(){
  document.getElementById('playerOverlay').classList.remove('open');
  document.getElementById('playerFrameWrap').innerHTML='';
}
window.openPlayer=openPlayer;
window.closePlayer=closePlayer;
window.setVideoFilter=setVideoFilter;
window.showMoreVideos=showMoreVideos;

load();
</script>
</body>
</html>
