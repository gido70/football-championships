<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>فيديوهات البطولة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:"Tajawal",sans-serif;background:#0d1117;color:#e6edf3;direction:rtl;margin:0;min-height:100vh}
.nav{background:#161b22;border-bottom:1px solid #21262d;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.nav a{color:#8b949e;text-decoration:none;font-size:13px;border:1px solid #30363d;padding:8px 16px;border-radius:20px;min-height:36px;display:inline-flex;align-items:center}
.wrap{max-width:100%;margin:0 auto;padding:20px 0 60px}
h1{font-size:19px;color:#c9a84c;margin:0 0 14px;padding:0 16px}
.video-section{max-width:1100px;margin:0 auto 18px;padding:0 14px}.section-title{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;margin:0;color:#173e58;font-size:16px;font-weight:900;padding:11px 14px;cursor:pointer;background:linear-gradient(145deg,#f8fdff,#dff3fa);border:1px solid #7fb9cf;border-radius:16px;box-shadow:0 5px 0 #4d7f94,0 10px 22px rgba(0,0,0,.22);transition:transform .16s,box-shadow .16s}.section-title::-webkit-details-marker{display:none}.section-title::marker{content:""}.section-title:active{transform:translateY(2px);box-shadow:0 2px 0 #4d7f94,0 5px 12px rgba(0,0,0,.2)}.video-section[open] .section-title{margin-bottom:12px;background:linear-gradient(145deg,#eaf9ff,#ccecf7)}.section-title-tools{display:flex;align-items:center;gap:9px}.section-count{font-size:11px;color:#31566b;background:#fff;border:1px solid #a9cedd;border-radius:999px;padding:4px 9px}.section-arrow{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#176a8b;color:#fff;box-shadow:0 3px 0 #0d4962;transition:transform .2s}.video-section[open] .section-arrow{transform:rotate(180deg)}.video-section-body{animation:videoReveal .24s ease-out}@keyframes videoReveal{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}

.carousel{display:grid;grid-template-columns:1fr;gap:14px;padding:4px 16px 14px;max-width:1100px;margin:0 auto}
.card{width:100%;background:#161b22;border:1px solid #21262d;border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s;padding:0;text-align:right;color:inherit;font-family:inherit;animation:fadeSlideUp .45s ease-out both}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card:hover{outline:2px solid #c9a84c}
.thumb-wrap{position:relative;aspect-ratio:16/9;background:#05080d;overflow:hidden}
.card.orientation-portrait .thumb-wrap{aspect-ratio:9/16}.card.orientation-square .thumb-wrap{aspect-ratio:1/1}
.thumb{width:100%;height:100%;object-fit:cover;display:block;background:#0d1117}
.card.orientation-portrait .thumb{object-fit:contain}.thumb-ph{width:100%;height:100%;background:#0d1117;display:flex;align-items:center;justify-content:center;font-size:32px;color:#536276}
.play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.play-icon{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.body{padding:12px 14px}
.title{font-weight:800;font-size:14px;margin-bottom:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc{font-size:12px;color:#8b949e;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty-note{text-align:center;color:#6e7b8f;padding:60px 0;font-size:13px}
.loading{text-align:center;color:#6e7b8f;padding:40px 0}

/* توزيع واعٍ بعدد الفيديوهات: لا يبقى نصف الشاشة فارغًا */
.carousel.multi{grid-template-columns:repeat(2,minmax(0,1fr))}
.carousel.count-3 .card:first-child{grid-column:1/-1}
.carousel.odd-tail:not(.count-3) .card:last-child{grid-column:1/-1}
@media(min-width:920px){.carousel.multi{grid-template-columns:repeat(3,minmax(0,1fr))}.carousel.count-3 .card:first-child,.carousel.odd-tail:not(.count-3) .card:last-child{grid-column:auto}}
@media(max-width:640px){.carousel.multi{gap:9px;padding:4px 9px 14px}.carousel.multi .body{padding:9px}.carousel.multi .title{font-size:12px}.carousel.multi .desc{font-size:10.5px}}
@media(max-width:640px){.video-section{margin-bottom:14px;padding:0}.section-title{font-size:14px;min-height:54px;padding:9px 11px}}

.player-overlay{position:fixed;inset:0;background:linear-gradient(160deg,rgba(235,249,255,.98),rgba(188,226,241,.97));backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:999;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.player-overlay.open{display:flex}
.player-box{width:100%;max-width:820px;background:rgba(255,255,255,.72);border:1px solid rgba(109,173,199,.65);border-radius:18px;padding:10px;box-shadow:0 18px 42px rgba(42,92,116,.22)}
.player-frame-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}.player-frame-wrap.portrait{aspect-ratio:9/16;max-height:76vh;width:auto;max-width:100%;margin:0 auto}.player-frame-wrap.square{aspect-ratio:1/1;max-height:76vh;width:auto;max-width:100%;margin:0 auto}
.player-frame-wrap iframe,.player-frame-wrap video{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-meta{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:#173047}
.player-title{font-weight:800;font-size:14px}
.player-actions{display:flex;gap:10px;align-items:center}
.player-actions a{color:#176a8b;font-size:12px;text-decoration:none;font-weight:800}
.player-home{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);color:#c9a84c!important;border-radius:8px;padding:8px 14px!important;font-size:13px!important;font-weight:800;text-decoration:none!important;min-height:38px;display:inline-flex;align-items:center}
.player-close{background:#fff;border:1px solid #7fb9cf;color:#173047;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;min-height:38px}
@media(max-width:480px){
  .wrap{padding:14px 10px 40px}
  .player-overlay{padding:8px}
  .player-meta{flex-wrap:wrap;gap:8px}
  .player-title{flex:1 1 100%;order:1}
  .player-actions{order:2;width:100%;justify-content:space-between}
}
</style>
<link rel="stylesheet" href="tournament-theme.css?v=20260910-2">
<link rel="stylesheet" href="public-navigation.css?v=20260911-1">
</head>
<body>
<div class="nav"><span style="font-weight:800;color:#c9a84c">🎬 فيديوهات البطولة</span><a href="index.html" id="backLink">← الرئيسية</a></div>
<div class="wrap"><h1 id="tourName"></h1><div id="app"><div class="loading">⏳ جاري التحميل...</div></div></div>

<div class="player-overlay" id="playerOverlay" onclick="if(event.target===this)closePlayer()">
  <div class="player-box">
    <div class="player-frame-wrap" id="playerFrameWrap"></div>
    <div class="player-meta">
      <div class="player-title" id="playerTitle"></div>
      <div class="player-actions">
        <a id="playerHomeLink" class="player-home" href="#">🏠 الرئيسية</a>
        <a id="playerExternalLink" href="#" target="_blank" rel="noopener">فتح في يوتيوب ↗</a>
        <button class="player-close" onclick="closePlayer()">✕ إغلاق</button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/supabase.min.js?v=20260910-1"></script>
<script src="supabase-config.js"></script>
<script src="tournament-scope.js?v=20260910-3"></script>
<script src="public-navigation.js?v=20260911-1"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const qs=new URLSearchParams(location.search);
const TID=qs.get('id')||qs.get('tid');
const scopeUrl=url=>window.TournamentScope?.scopedUrl(url)||url;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

function extractYoutubeId(url){
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
  return m?m[1]:null;
}

let VIDEOS=[];
async function load(){
  if(!TID){document.getElementById('app').innerHTML='<div class="empty-note">لم تُحدَّد بطولة</div>';return;}
  const backLink=document.getElementById('backLink');
  const tournamentBack=scopeUrl('tournament.html?id='+TID);
  backLink.href=tournamentBack;
  backLink.removeAttribute('onclick');
  window.PublicNavigation?.configureBack(backLink,tournamentBack,'البطولة');
  const {data:t}=await sb.from('tournaments').select('name,primary_color,secondary_color,logo_url,cup_logo_url').eq('id',TID).single();
  window.TournamentScope?.applyTournamentTheme(t);
  document.getElementById('tourName').textContent=(t?.name_ar||t?.name||'')+' — الفيديوهات';

  const {data:vidRows}=await sb.from('videos').select('*').eq('tournament_id',TID).eq('is_visible',true).order('created_at',{ascending:false});
  const {data:matchVids}=await sb.from('matches').select('id,home_score,away_score,match_date,highlight_video_url,home_team_id,away_team_id').eq('tournament_id',TID).eq('status','completed').not('highlight_video_url','is',null);
  let matchVideoItems=[];
  if(matchVids?.length){
    const {data:teams}=await sb.from('teams').select('id,name,name_ar').eq('tournament_id',TID);
    const tName=id=>teams?.find(t=>t.id===id)?.name_ar||teams?.find(t=>t.id===id)?.name||'';
    matchVideoItems=matchVids.map(m=>({
      id:'match-'+m.id,title:`ملخص: ${tName(m.home_team_id)} ${m.home_score}-${m.away_score} ${tName(m.away_team_id)}`,
      video_type:'youtube',video_url:m.highlight_video_url,description:'ملخص المباراة',created_at:m.match_date,_isMatch:true
    }));
  }
  const editorial=vidRows||[];
  VIDEOS=[...editorial,...matchVideoItems];
  const app=document.getElementById('app');
  if(!VIDEOS.length){app.innerHTML='<div class="empty-note">لا توجد فيديوهات مضافة بعد لهذه البطولة</div>';return;}

  const groups=[
    {title:'أخبار وفيديوهات البطولة',items:editorial.filter(v=>v.content_category!=='highlights')},
    {title:'النهائيات والتتويج',items:editorial.filter(v=>v.content_category==='highlights')},
    {title:'ملخصات المباريات',items:matchVideoItems}
  ].filter(g=>g.items.length);
  app.innerHTML=groups.map(g=>renderGroup(g.title,g.items)).join('');
  bindVideoAccordions(app);
}

function renderGroup(title,items){
  const countClass=`count-${Math.min(items.length,9)} ${items.length>1?'multi':''} ${items.length>3&&items.length%2===1?'odd-tail':''}`;
  return `<details class="video-section video-accordion"><summary class="section-title"><span>🎬 ${esc(title)}</span><span class="section-title-tools"><span class="section-count">${items.length}</span><span class="section-arrow" aria-hidden="true">⌄</span></span></summary><div class="video-section-body"><div class="carousel ${countClass}">${items.map(v=>{
    const i=VIDEOS.indexOf(v);
    return `
    <button class="card orientation-${v.media_orientation||'landscape'}" onclick="openPlayer(${i})" style="animation-delay:${i*0.06}s">
      <div class="thumb-wrap">
        ${v.thumbnail_url?`<img class="thumb" src="${v.thumbnail_url}" alt="${esc(v.title)}">`:'<div class="thumb-ph">🎬</div>'}
        <div class="play-badge"><div class="play-icon">▶</div></div>
      </div>
      <div class="body">
        <div class="title">${esc(v.title)}</div>
        ${v.description?`<div class="desc">${esc(v.description)}</div>`:''}
      </div>
    </button>`;
  }).join('')}</div></div></details>`;
}

function bindVideoAccordions(container){
  container.querySelectorAll('.video-accordion').forEach(section=>section.addEventListener('toggle',()=>{
    if(!section.open)return;
    container.querySelectorAll('.video-accordion[open]').forEach(other=>{if(other!==section)other.open=false;});
  }));
}

function openPlayer(i){
  const v=VIDEOS[i];
  const wrap=document.getElementById('playerFrameWrap');
  wrap.className='player-frame-wrap '+(v.media_orientation==='portrait'?'portrait':v.media_orientation==='square'?'square':'');
  if(v.video_type==='youtube'){
    const yid=extractYoutubeId(v.video_url);
    wrap.innerHTML=yid
      ? `<iframe src="https://www.youtube.com/embed/${yid}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`
      : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b949e;font-size:13px">تعذّر تشغيل هذا الرابط داخلياً — استخدم "فتح في يوتيوب"</div>`;
  }else{
    wrap.innerHTML=`<video src="${v.video_url}" controls autoplay></video>`;
  }
  document.getElementById('playerTitle').textContent=v.title;
  document.getElementById('playerExternalLink').href=v.video_url;
  document.getElementById('playerExternalLink').textContent=v.video_type==='youtube'?'فتح في يوتيوب ↗':'فتح الرابط مباشرة ↗';
  document.getElementById('playerHomeLink').href=scopeUrl('tournament.html?id='+TID);
  document.getElementById('playerOverlay').classList.add('open');
}

function closePlayer(){
  document.getElementById('playerOverlay').classList.remove('open');
  document.getElementById('playerFrameWrap').innerHTML='';
}
window.openPlayer=openPlayer;
window.closePlayer=closePlayer;

load();
</script>
</body>
</html>
